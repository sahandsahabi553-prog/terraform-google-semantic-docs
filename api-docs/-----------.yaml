```yaml
openapi: 3.0.0
info:
  title: سرویس مدیریت کودهای کشاورزی
  description: این مستند API جزئیات مربوط به مدیریت کودهای کشاورزی، شامل افزودن، مشاهده، به‌روزرسانی و حذف کودها را ارائه می‌دهد.
  version: 1.0.0
servers:
  - url: https://kalatakco.com/
    description: سرور اصلی کالاتک
paths:
  /fertilizers:
    get:
      summary: دریافت لیست تمام کودهای کشاورزی
      description: این عملیات لیست کاملی از تمام کودهای کشاورزی موجود را برمی‌گرداند.
      operationId: getAllFertilizers
      tags:
        - کودها
      responses:
        '200':
          description: لیست کودها با موفقیت دریافت شد.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Fertilizer'
        '500':
          description: خطای داخلی سرور.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: افزودن یک کود کشاورزی جدید
      description: این عملیات امکان افزودن یک محصول کود کشاورزی جدید را به سیستم فراهم می‌کند.
      operationId: addFertilizer
      tags:
        - کودها
      requestBody:
        description: شیء کود کشاورزی برای افزودن به سیستم.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FertilizerInput'
      responses:
        '201':
          description: کود جدید با موفقیت ایجاد شد.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fertilizer'
        '400':
          description: درخواست نامعتبر (داده‌های ورودی ناقص یا اشتباه).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: خطای داخلی سرور.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /fertilizers/{fertilizerId}:
    get:
      summary: دریافت جزئیات یک کود کشاورزی خاص
      description: این عملیات جزئیات کامل یک کود کشاورزی را بر اساس شناسه منحصر به فرد آن (ID) برمی‌گرداند.
      operationId: getFertilizerById
      tags:
        - کودها
      parameters:
        - name: fertilizerId
          in: path
          description: شناسه منحصر به فرد کود کشاورزی.
          required: true
          schema:
            type: integer
            format: int64
            example: 101
      responses:
        '200':
          description: جزئیات کود با موفقیت دریافت شد.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fertilizer'
        '404':
          description: کود مورد نظر یافت نشد.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: خطای داخلی سرور.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: به‌روزرسانی اطلاعات یک کود کشاورزی
      description: این عملیات اطلاعات موجود یک کود کشاورزی را بر اساس شناسه آن به‌روزرسانی می‌کند.
      operationId: updateFertilizer
      tags:
        - کودها
      parameters:
        - name: fertilizerId
          in: path
          description: شناسه منحصر به فرد کود کشاورزی.
          required: true
          schema:
            type: integer
            format: int64
            example: 101
      requestBody:
        description: شیء کود کشاورزی با اطلاعات به‌روز شده.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FertilizerInput'
      responses:
        '200':
          description: اطلاعات کود با موفقیت به‌روزرسانی شد.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fertilizer'
        '400':
          description: درخواست نامعتبر (داده‌های ورودی ناقص یا اشتباه).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: کود مورد نظر یافت نشد.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: خطای داخلی سرور.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: حذف یک کود کشاورزی
      description: این عملیات یک کود کشاورزی را بر اساس شناسه منحصر به فرد آن از سیستم حذف می‌کند.
      operationId: deleteFertilizer
      tags:
        - کودها
      parameters:
        - name: fertilizerId
          in: path
          description: شناسه منحصر به فرد کود کشاورزی.
          required: true
          schema:
            type: integer
            format: int64
            example: 101
      responses:
        '204':
          description: کود