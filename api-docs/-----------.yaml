```yaml
openapi: 3.0.0
info:
  title: سرویس مدیریت کودهای کشاورزی
  description: |
    یک مستند جامع برای API سرویس مدیریت کودهای کشاورزی شرکت کلاتک.
    این API امکان افزودن، مشاهده، به‌روزرسانی و حذف اطلاعات مربوط به انواع کودهای کشاورزی را فراهم می‌کند.
    شما می‌توانید اطلاعات جامعی از قبیل نام، نوع، ترکیبات NPK و توصیه‌های مصرف را مدیریت کنید.
  version: 1.0.0
servers:
  - url: https://kalatakco.com/
    description: سرور اصلی شرکت کلاتک
paths:
  /koodha:
    get:
      summary: دریافت لیست همه کودها
      description: این عملیات لیست کاملی از تمام کودهای کشاورزی ثبت شده در سیستم را بازمی‌گرداند. امکان فیلتر کردن بر اساس نوع کود و محدود کردن تعداد نتایج نیز وجود دارد.
      operationId: getAllKoodha
      parameters:
        - name: type
          in: query
          description: فیلتر بر اساس نوع کود (مثال: شیمیایی، آلی، زیستی)
          required: false
          schema:
            type: string
            enum:
              - شیمیایی
              - آلی
              - زیستی
              - ترکیبی
        - name: limit
          in: query
          description: حداکثر تعداد نتایج برای بازگرداندن در هر درخواست
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: لیست کودها با موفقیت دریافت شد.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Kood'
        '500':
          description: خطای سرور داخلی هنگام پردازش درخواست.
    post:
      summary: افزودن کود جدید
      description: این عملیات برای ثبت یک کود کشاورزی جدید در سیستم استفاده می‌شود. اطلاعات مورد نیاز شامل نام، نوع، درصد ترکیبات NPK و توضیحات اختیاری است.
      operationId: createKood
      requestBody:
        description: اطلاعات کامل کود جدید برای افزودن به سیستم.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KoodInput'
      responses:
        '201':
          description: کود با موفقیت اضافه شد و شناسه جدید برای آن صادر گردید.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Kood'
        '400':
          description: درخواست نامعتبر است. اطلاعات ارسالی ناقص یا فرمت آن نادرست است.
        '500':
          description: خطای سرور داخلی هنگام افزودن کود.
  /koodha/{koodId}:
    parameters:
      - name: koodId
        in: path
        description: شناسه منحصر به فرد کود کشاورزی
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
        example: 123
    get:
      summary: دریافت جزئیات یک کود خاص
      description: این عملیات جزئیات کامل یک کود کشاورزی را بر اساس شناسه (ID) منحصر به فرد آن بازمی‌گرداند.
      operationId: getKoodById
      responses:
        '200':
          description: جزئیات کود با موفقیت دریافت شد.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Kood'
        '404':
          description: کود با شناسه مشخص شده یافت نشد.
        '500':
          description: خطای سرور داخلی هنگام دریافت جزئیات کود.
    put:
      summary: به‌روزرسانی اطلاعات یک کود
      description: این عملیات اطلاعات یک کود کشاورزی موجود را بر اساس شناسه آن به‌روزرسانی می‌کند. باید تمام فیلدهای مورد نیاز حتی اگر تغییری نکرده باشند، ارسال شوند.
      operationId: updateKood
      requestBody:
        description: اطلاعات به‌روز شده کود.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KoodInput'
      responses:
        '200':
          description: کود با موفقیت به‌روزرسانی شد.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Kood'
        '400':
          description: درخواست نامعتبر است. اطلاعات ارسالی ناقص یا فرمت آن نادرست است.
        '404':
          description: کود با شناسه مشخص شده یافت نشد.
        '500':
          description: خطای سرور داخلی هنگام به‌روزرسانی کود.
    delete:
      summary: حذف یک کود
      description: این عملیات یک کود کشاورزی را بر اساس شناسه (ID) آن از سیستم حذف می‌کند.
      operationId: deleteKood
      responses:
        '204':
          description: کود با موفقیت حذف شد. (No Content)
        '404':
          description: کود با شناسه مشخص شده یافت نشد.
        '500':
          description: خطای سرور داخلی هنگام حذف کود.

components:
  schemas:
    Kood:
      type: object
      required:
        - id
        - name
        - type
        - n_percentage
        - p_percentage
        - k_percentage
      properties:
        id:
          type: integer
          format: int64
          description: شناسه منحصر به فرد و سیستمی کود
          readOnly: true
          example: 123
        name:
          type: string
          description: نام تجاری یا عمومی کود
          example: کود کامل 20-20-20
        type:
          type: string
          description: نوع کود (مانند شیمیایی، آلی، زیستی، ترکیبی)
          enum:
            - شیمیایی
            - آلی
            - زیستی
            - ترکیبی
          example: شیمیایی
        n_percentage:
          type: number
          format: float
          description: درصد نیتروژن (N) موجود در کود (بین 0 تا 100)
          minimum: 0