```yaml
openapi: 3.0.0
info:
  title: سرویس مدیریت کود کشاورزی
  description: |
    این مستندسازی API برای مدیریت اطلاعات کودهای کشاورزی شرکت کلاتک طراحی شده است.
    هدف اصلی این API فراهم کردن امکان دسترسی، افزودن، به‌روزرسانی و حذف اطلاعات مربوط به انواع کودها می‌باشد.
    این سرویس به کشاورزان و فروشندگان کود کمک می‌کند تا اطلاعات دقیق و به‌روزی از محصولات کود در دسترس داشته باشند.
  version: 1.0.0
servers:
  - url: https://kalatakco.com/api/v1
    description: سرور اصلی API شرکت کلاتک
tags:
  - name: کودها
    description: عملیات مربوط به مدیریت کودهای کشاورزی و اطلاعات آن‌ها
paths:
  /fertilizers:
    get:
      summary: دریافت لیست همه کودهای کشاورزی
      operationId: getAllFertilizers
      tags:
        - کودها
      parameters:
        - name: page
          in: query
          description: شماره صفحه برای صفحه‌بندی نتایج. شروع از 1.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: حداکثر تعداد آیتم‌ها در هر صفحه.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 10
        - name: search
          in: query
          description: کلمه کلیدی برای جستجو در نام، نوع یا توضیحات کودها.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: لیست موفقیت‌آمیز کودها
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Fertilizer'
        '400':
          description: درخواست نامعتبر (مثلاً پارامترهای صفحه‌بندی اشتباه)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: افزودن یک کود کشاورزی جدید
      operationId: createFertilizer
      tags:
        - کودها
      requestBody:
        description: اطلاعات کامل کود جدید برای افزودن به سیستم.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewFertilizer'
      responses:
        '201':
          description: کود با موفقیت ایجاد شد و در سیستم ثبت گردید.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fertilizer'
        '400':
          description: اطلاعات ارسالی نامعتبر است (مثلاً فیلدهای ضروری وارد نشده‌اند یا فرمت اشتباه است).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /fertilizers/{id}:
    get:
      summary: دریافت جزئیات یک کود کشاورزی خاص
      operationId: getFertilizerById
      tags:
        - کودها
      parameters:
        - name: id
          in: path
          description: شناسه منحصر به فرد (UUID) کود مورد نظر.
          required: true
          schema:
            type: string
            format: uuid
            example: d290f1ee-6