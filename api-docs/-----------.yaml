```yaml
openapi: 3.0.0
info:
  title: سرویس مدیریت کودهای کشاورزی
  description: API برای مدیریت و دسترسی به اطلاعات کودهای کشاورزی شامل افزودن، مشاهده، به‌روزرسانی و حذف کودها. این سرویس به کشاورزان و فروشندگان کود کمک می‌کند تا موجودی و مشخصات کودها را به صورت کارآمدی مدیریت کنند.
  version: 1.0.0
servers:
  - url: https://kalatakco.com/
    description: سرور اصلی خدمات کود کشاورزی
tags:
  - name: مدیریت کودها
    description: عملیات مربوط به مشاهده، افزودن، به‌روزرسانی و حذف کودهای کشاورزی.
paths:
  /fertilizers:
    get:
      tags:
        - مدیریت کودها
      summary: دریافت لیست همه کودها
      description: این عملیات لیست کاملی از کودهای کشاورزی موجود را بازمی‌گرداند. امکان فیلتر کردن بر اساس نام یا نوع کود برای جستجوی دقیق‌تر وجود دارد.
      parameters:
        - in: query
          name: name
          schema:
            type: string
          description: نام تجاری یا عمومی کود برای فیلتر کردن (جستجوی جزئی)
          example: اوره
        - in: query
          name: type
          schema:
            type: string
            enum: [شیمیایی, آلی, زیستی, NPK, ریزمغذی]
          description: نوع کود برای فیلتر کردن
          example: شیمیایی
      responses:
        '200':
          description: لیست کودها با موفقیت دریافت شد.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Fertilizer'
        '400':
          description: درخواست نامعتبر. پارامترهای ارسالی صحیح نیستند.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: خطای داخلی سرور. مشکلی در پردازش درخواست پیش آمده است.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - مدیریت کودها
      summary: افزودن یک کود جدید
      description: این عملیات امکان افزودن یک کود کشاورزی جدید به سیستم را فراهم می‌کند. تمام مشخصات کود باید در بدنه درخواست ارسال شود.
      requestBody:
        description: مشخصات کامل کود جدیدی که قرار است اضافه شود.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewFertilizer'
      responses:
        '201':
          description: کود با موفقیت ایجاد شد و شناسه جدید به آن اختصاص