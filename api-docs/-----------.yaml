```yaml
openapi: 3.0.0
info:
  title: سرویس مدیریت کودهای کشاورزی
  description: |
    این API برای مدیریت جامع انواع کودهای کشاورزی، شامل ثبت، مشاهده، به‌روزرسانی و حذف اطلاعات کودها و مدیریت موجودی آن‌ها طراحی شده است.
    هدف از این سرویس، فراهم آوردن ابزاری کارآمد برای سازماندهی و ردیابی کودهای مورد استفاده در بخش کشاورزی است.
  version: 1.0.0
servers:
  - url: https://kalatakco.com/
    description: سرور اصلی Kalatak Company
tags:
  - name: کودها
    description: عملیات مربوط به مدیریت کودهای کشاورزی
paths:
  /fertilizers:
    get:
      tags:
        - کودها
      summary: دریافت لیست همه کودها
      description: |
        این عملیات لیست کاملی از تمامی کودهای ثبت شده در سیستم را بازمی‌گرداند.
        می‌توانید از پارامترهای فیلتر و صفحه‌بندی برای محدود کردن نتایج استفاده کنید.
      parameters:
        - name: type
          in: query
          description: فیلتر بر اساس نوع کود (شیمیایی، آلی، زیستی)
          required: false
          schema:
            type: string
            enum: [ شیمیایی, آلی, زیستی, مخلوط ]
        - name: limit
          in: query
          description: حداکثر تعداد نتایج برای بازگشت
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 10
        - name: offset
          in: query
          description: تعداد نتایج برای صرف‌نظر کردن (برای صفحه‌بندی)
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: لیست با موفقیت بازیابی شد.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Fertilizer'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - کودها
      summary: ایجاد یک کود جدید
      description: |
        یک کود کشاورزی جدید با مشخصات ارائه شده را در سیستم ثبت می‌کند.
        شناسه منحصر به فرد برای کود به‌صورت خودکار تولید و در پاسخ بازگردانده می‌شود.
      requestBody:
        description: مشخصات کود جدید برای ایجاد
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FertilizerInput'
      responses:
        '201':
          description: کود با موفقیت ایجاد شد.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fertilizer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /fertilizers/{fertilizerId}:
    get:
      tags:
        - کودها
      summary: دریافت جزئیات یک کود خاص
      description: |
        جزئیات کامل یک کود کشاورزی را بر اساس شناسه منحصر به فرد آن بازمی‌گرداند.
      parameters:
        - name: fertilizerId
          in: path
          description: شناسه منحصر به فرد کود
          required: true
          schema:
            type: string
            format: uuid
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
      responses:
        '200':
          description: جزئیات کود با موفقیت بازیابی شد.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fertilizer'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - کودها
      summary: به‌روزرسانی اطلاعات یک کود
      description: |
        اطلاعات یک کود موجود را بر اساس شناسه آن به‌روزرسانی می‌کند.
        برای این عملیات، تمامی فیلدهای مورد نیاز باید در بدنه درخواست ارسال شوند، حتی اگر تغییری نکرده باشند.
      parameters:
        - name: fertilizerId
          in: path
          description: شناسه منحصر به فرد کود برای به‌روزرسانی
          required: true
          schema:
            type: string
            format: uuid
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
      requestBody:
        description: مشخصات به‌روزرسانی شده کود
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FertilizerInput'
      responses:
        '200':
          description: کود با موفقیت به‌روزرسانی شد.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fertilizer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - کودها
      summary: حذف یک کود
      description: |
        یک کود کشاورزی را بر اساس شناسه آن از سیستم حذف می‌کند.
        پس از حذف، این کود دیگر قابل بازیابی نخواهد بود.
      parameters:
        - name: fertilizerId
          in: path
          description: شناسه منحصر به فرد کود برای حذف
          required: true
          schema:
            type: string
            format: uuid
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
      responses:
        '204':
          description: کود با موفقیت حذف شد. (بدون محتوا)
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /fertilizers/{fertilizerId}/stock:
    post:
      tags:
        - کودها
      summary: به‌روزرسانی موجودی کود
      description: |
        موجودی یک کود خاص را با افزایش یا کاهش مقدار مشخصی، به‌روزرسانی می‌کند.
        این عملیات برای مدیریت ورود یا خروج کود از انبار استفاده می‌شود.
      parameters:
        - name: fertilizerId
          in: path
          description: شناسه منحصر به فرد کود که موجودی آن باید به‌روزرسانی شود
          required: true
          schema:
            type: string
            format: uuid
          example: d290f1ee-6c54-4b01-90e6-