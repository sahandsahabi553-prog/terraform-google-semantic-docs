```yaml
openapi: 3.0.0
info:
  title: سرویس کود کشاورزی
  description: API ثبت، مدیریت و استعلام اطلاعات کودهای کشاورزی
  version: 1.0.0
  contact:
    name: پشتیبانی کالاتک
    url: https://kalatakco.com/support
servers:
  - url: https://kalatakco.com/api/v1
    description: سرور اصلی
paths:
  /fertilizers:
    get:
      summary: دریافت فهرست کودها
      description: بازگرداندن لیستی از تمام کودهای ثبت‌شده با امکان فیلتر و صفحه‌بندی
      parameters:
        - in: query
          name: page
          schema: {type: integer, default: 1}
          description: شماره صفحه
        - in: query
          name: limit
          schema: {type: integer, default: 20}
          description: تعداد رکورد در هر صفحه
        - in: query
          name: type
          schema: {type: string, enum: [ارگانیک, شیمیایی]}
          description: نوع کود
      responses:
        '200':
          description: فهرست کودها
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Fertilizer'}
                  total:
                    type: integer
                    description: تعداد کل
    post:
      summary: افزودن کود جدید
      description: ثبت اطلاعات یک کود جدید در سیستم
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FertilizerInput'}
      responses:
        '201':
          description: کود با موفقیت ایجاد شد
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Fertilizer'}
        '400':
          description: خطای اعتبارسنجی داده‌ها
  /fertilizers/{id}:
    get:
      summary: دریافت جزئیات یک کود
      description: بازگرداندن اطلاعات کامل یک کود خاص
      parameters:
        - {$ref: '#/components/parameters/IdParam'}
      responses:
        '200':
          description: اطلاعات کود
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Fertilizer'}
        '404':
          description: کود یافت نشد
    put:
      summary: بروزرسانی کود
      description: ویرایش اطلاعات یک کود موجود
      parameters:
        - {$ref: '#/components/parameters/IdParam'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FertilizerInput'}
      responses:
        '200':
          description: کود به‌روز شد
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Fertilizer'}
        '404':
          description: کود یافت نشد
    delete:
      summary: حذف کود
      description: حذف یک کود از سیستم
      parameters:
        - {$ref: '#/components/parameters/IdParam'}
      responses:
        '204':
          description: کود با موفقیت حذف شد
        '404':
          description: کود یافت نشد
  /fertilizers/{id/analysis:
    post:
      summary: ثبت آنالیز کود
      description: افزودن گزارش آنالیز جدید برای یک کود
      parameters:
        - {$ref: '#/components/parameters/IdParam'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                labName: {type: string, description: نام آزمایشگاه}
                date: {type: string, format: date, description: تاریخ آزمایش}
                elements: {type: object, additionalProperties: {type: number}, description: درصد عناصر}
      responses:
        '201':
          description: آنالیز ثبت شد
components:
  parameters:
    IdParam:
      in: path
      name: id
      required: true
      schema: {type: integer}
      description: شناسه یکتای کود
  schemas:
    Fertilizer:
      type: object
      properties:
        id: {type: integer, description: شناسه کود}
        name: {type: string, description: نام کود}
        brand: {type: string, description: برند}
        type: {type: string, enum: [ارگانیک, شیمیایی], description: نوع کود}
        granuleSize: {type: string, description: اندازه گرانول}
        usage: {type: string, description: نحوه مصرف}
        createdAt: {type: string, format: date-time, description: زمان ثبت}
    FertilizerInput:
      type: object
      required: [name, type]
      properties:
        name: {type: string, description: نام کود}
        brand: {type: string, description: برند}
        type: {type: string, enum: [ارگانیک, شیمیایی], description: نوع کود}
        granuleSize: {type: string, description: اندازه گرانول}
        usage: {type: string, description: نحوه مصرف}
```