```yaml
openapi: 3.0.0
info:
  title: سرویس مدیریت کودهای کشاورزی
  description: |
    این API امکان مدیریت اطلاعات کودهای کشاورزی شامل افزودن، مشاهده، به‌روزرسانی و حذف را فراهم می‌کند.
    شما می‌توانید لیست کودها را مشاهده کنید، جزئیات یک کود خاص را دریافت کنید، کود جدید اضافه کنید،
    اطلاعات یک کود موجود را به‌روزرسانی کنید و یا یک کود را از سیستم حذف کنید.
  version: 1.0.0
servers:
  - url: https://kalatakco.com/api/v1
    description: سرور اصلی سرویس مدیریت کودهای کشاورزی
tags:
  - name: کودها
    description: عملیات مربوط به مدیریت اطلاعات کودهای کشاورزی
paths:
  /fertilizers:
    get:
      summary: دریافت لیست تمام کودها
      description: |
        این عملیات لیست کاملی از کودهای کشاورزی موجود را بازمی‌گرداند.
        امکان فیلتر کردن بر اساس نام یا نوع و همچنین صفحه‌بندی نتایج نیز وجود دارد.
      tags:
        - کودها
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: شماره صفحه نتایج برای صفحه‌بندی.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: تعداد آیتم‌ها در هر صفحه از نتایج.
        - in: query
          name: search
          schema:
            type: string
          description: عبارتی برای جستجو بر اساس نام یا نوع کود.
      responses:
        '200':
          description: لیست کودها با موفقیت دریافت شد.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Fertilizer'
        '400':
          description: درخواست نامعتبر است (مثلاً پارامترهای صفحه‌بندی نادرست).
    post:
      summary: افزودن کود جدید
      description: این عملیات برای افزودن یک کود کشاورزی جدید به سیستم استفاده می‌شود.
      tags:
        - کودها
      requestBody:
        description: اطلاعات کامل کود جدید برای افزودن.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewFertilizer'
      responses:
        '201':
          description: کود با موفقیت اضافه شد و جزئیات آن بازگردانده می‌شود.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fertilizer'
        '400':
          description: اطلاعات ارسالی برای کود نامعتبر است (مثلاً فیلدهای اجباری پر نشده‌اند).
  /fertilizers/{fertilizerId}:
    get:
      summary: دریافت جزئیات یک کود خاص
      description: این عملیات جزئیات کامل یک کود کشاورزی را بر اساس شناسه منحصر به فرد آن بازمی‌گرداند.
      tags