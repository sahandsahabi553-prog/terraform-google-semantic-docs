```yaml
openapi: 3.0.0
info:
  title: سرویس کود کشاورزی
  description: |
    این مستند OpenAPI مشخصات API سرویس مدیریت کودهای کشاورزی را ارائه می‌دهد.
    شما می‌توانید از این API برای مشاهده، افزودن، به‌روزرسانی و حذف اطلاعات کودهای کشاورزی استفاده کنید.
  version: 1.0.0
servers:
  - url: https://kalatakco.com/api/v1
    description: سرور اصلی API شرکت کلاتک
tags:
  - name: کودها
    description: عملیات مربوط به مدیریت کودهای کشاورزی
paths:
  /fertilizers:
    get:
      tags:
        - کودها
      summary: دریافت لیست تمامی کودهای کشاورزی
      description: این عملیات لیست کاملی از کودهای کشاورزی موجود را بازمی‌گرداند. امکان فیلتر و صفحه‌بندی نتایج وجود دارد.
      operationId: getFertilizers
      parameters:
        - name: page
          in: query
          description: شماره صفحه برای صفحه‌بندی نتایج
          required: false
          schema:
            type: integer
            format: int32
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: تعداد آیتم‌ها در هر صفحه
          required: false
          schema:
            type: integer
            format: int32
            default: 10
            minimum: 1
            maximum: 100
        - name: category
          in: query
          description: فیلتر کردن کودها بر اساس دسته‌بندی (مثلاً "شیمیایی", "آلی", "زیستی")
          required: false
          schema:
            type: string
            enum:
              - شیمیایی
              - آلی
              - زیستی
              - ریزمغذی
              - کامل
      responses:
        '200':
          description: لیست کودها با موفقیت دریافت شد
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Fertilizer'
              examples:
                لیست کودها:
                  value:
                    - id: "fert123"
                      name: "کود کامل NPK 20-20-20"
                      type: "شیمیایی"
                      category: "کامل"
                      description: "کود متعادل برای تمامی مراحل رشد گیاهان زراعی و باغی."
                      usage: "۲۰ گرم در ۱۰ لیتر آب، هر دو هفته یکبار."
                      price: 150000
                      quantity: 500
                      unit: "کیلوگرم"
                    - id: "fert124"
                      name: "کود هیومیک اسید"
                      type: "آلی"
                      category: "ریز مغذی"
                      description: "بهبود دهنده ساختار خاک و افزایش جذب عناصر."
                      usage: "۵ لیتر در هکتار، قبل از کاشت."
                      price: 250000
                      quantity: 200
                      unit: "لیتر"
        '400':
          description: پارامترهای درخواست نامعتبر هستند
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                خطای ورودی:
                  value:
                    code: 400
                    message: "پارامتر 'limit' باید بین 1 تا 100 باشد."
    post:
      tags:
        - کودها
      summary: افزودن یک کود کشاورزی جدید
      description: این عملیات به شما امکان می‌دهد اطلاعات یک کود کشاورزی جدید را به سیستم اضافه کنید.
      operationId: createFertilizer
      requestBody:
        description: اطلاعات کود جدید برای افزودن
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FertilizerInput'
            examples:
              کود جدید:
                value:
                  name: "کود سولفات پتاسیم"
                  type: "شیمیایی"
                  category: "ریز مغذی"
                  description: "منبع غنی پتاسیم و گوگرد برای بهبود کیفیت میوه و افزایش مقاومت گیاه."
                  usage: "۱۰ گرم در هر بوته، قبل از گلدهی."
                  price: 180000
                  quantity: 300
                  unit: "کیلوگرم"
      responses:
        '201':
          description: کود با موفقیت ایجاد شد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fertilizer'
              examples:
                کود ایجاد شده:
                  value:
                    id: "fert125"
                    name: "کود سولفات پتاسیم"
                    type: "شیمیایی"
                    category: "ریز مغذی"
                    description: "منبع غنی پتاسیم و گوگرد برای بهبود کیفیت میوه و افزایش مقاومت گیاه."
                    usage: "۱۰ گرم در هر بوته، قبل از گلدهی."
                    price: 180000
                    quantity: 300
                    unit: "کیلوگرم"
        '400':
          description: اطلاعات ارسالی نامعتبر است
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                خطای اعتبار سنجی:
                  value:
                    code: 400
                    message: "فیلد 'name' الزامی است."
  /fertilizers/{id}:
    parameters:
      - name: id
        in: path
        description: شناسه یکتای کود کشاورزی
        required: true
        schema:
          type: string
          format: uuid
        examples:
          شناسه کود:
            value: "fert123"
    get:
      tags:
        - کودها
      summary: دریافت جزئیات یک کود کشاورزی خاص
      description: با استفاده از شناسه کود، می‌توانید اطلاعات کامل یک کود خاص را مشاهده کنید.
      operationId: getFertilizerById
      responses:
        '200':
          description: جزئیات کود با موفقیت دریافت شد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fertilizer'
              examples:
                جزئیات کود:
                  value:
                    id: "fert123"
                    name: "کود کامل NPK 20-20-20"
                    type: "شیمیایی"
                    category: "کامل"
                    description: "کود متعادل برای تمامی مراحل رشد گیاهان زراعی و باغی."
                    usage: "۲۰ گرم در ۱۰ لیتر آب، هر دو هفته یکبار."
                    price: 150000
                    quantity: 500
                    unit: "کیلوگرم"
        '404':
          description: کود با شناسه مشخص شده یافت نشد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                کود یافت نشد:
                  value:
                    code: 404
                    message: "کود با شناسه 'fert123' یافت نشد."
    put:
      tags:
        - کودها
      summary: به‌روزرسانی کامل اطلاعات یک کود کشاورزی
      description: این عملیات تمام اطلاعات یک کود موجود را بر اساس شناسه آن به‌روزرسانی می‌کند. باید تمامی فیلدهای الزامی را ارسال کنید.
      operationId: updateFertilizer
      requestBody:
        description: اطلاعات به‌روزرسانی شده کود
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FertilizerInput'
            examples:
              به‌روزرسانی کود:
                value:
                  name: "کود کامل NPK 20-20-20 جدید"
                  type: "شیمیایی"
                  category: "کامل"
                  description: "کود متعادل برای تمامی مراحل رشد گیاهان زراعی و باغی. فرمول جدید."
                  usage: "۲۵ گرم در ۱۰ لیتر آب، هر دو هفته یکبار."
                  price: 160000
                  quantity: 480
                  unit: "کیلوگرم"
      responses:
        '200':
          description: اطلاعات کود با موفقیت به‌روزرسانی شد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fertilizer'
              examples:
                کود به‌روزرسانی شده:
                  value:
                    id: "fert123"
                    name: "کود کامل NPK 20-20-20 جدید"
                    type: "شیمیایی"
                    category: "کامل"
                    description: "کود متعادل برای تمامی مراحل رشد گیاهان زراعی و باغی. فرمول جدید."
                    usage: "۲۵ گرم در ۱۰ لیتر آب، هر دو هفته یکبار."
                    price: 160000
                    quantity: 480
                    unit: "کیلوگرم"
        '400':
          description: اطلاعات ارسالی نامعتبر است
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                خطای اعتبار سنجی:
                  value:
                    code: 400
                    message: "فیلد 'price' باید یک عدد مثبت باشد."
        '404':
          description: کود با شناسه مشخص شده یافت نشد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                کود یافت نشد:
                  value:
                    code: 404
                    message: "کود با شناسه 'fert123' یافت نشد."
    delete:
      tags:
        - کودها
      summary: حذف یک کود کشاورزی از سیستم
      description: این عملیات یک کود کشاورزی را بر اساس شناسه آن از سیستم حذف می‌کند.
      operationId: deleteFertilizer
      responses:
        '204':
          description: کود با موفقیت حذف شد
        '404':
          description: کود با شناسه مشخص شده یافت نشد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                کود یافت نشد:
                  value:
                    code: 404
                    message: "کود با شناسه 'fert123' یافت نشد."

components:
  schemas:
    Fertilizer:
      type: object
      required:
        - id
        - name
        - type
        - category
        - price
        - quantity
        - unit
      properties:
        id:
          type: string
          format: uuid
          description: شناسه یکتای کود
          example: "fert123"
        name:
          type: string
          description: نام کود
          example: "کود کامل NPK 20-20-20"
        type:
          type: string
          description: نوع کود (مثلاً شیمیایی، آلی، زیستی)
          example: "شیمیایی"
        category:
          type: string
          description: دسته‌بندی اصلی کود
          enum:
            - شیمیایی
            - آلی
            - زیستی
            - ریزمغذی
            - کامل
          example: "کامل"
        description:
          type: string
          description: توضیحات کامل در مورد کود و کاربردهای آن
          example: "کود متعادل برای تمامی مراحل رشد گیاهان زراعی و باغی."
        usage:
          type: string
          description: نحوه و میزان مصرف توصیه‌شده
          example: "۲۰ گرم در ۱۰ لیتر آب، هر دو هفته یکبار."
        price:
          type: number
          format: float
          description: قیمت واحد کود (به ریال)
          example: 150000
        quantity:
          type: integer
          format: int32
          description: موجودی انبار (بر اساس واحد)
          example: 500
        unit:
          type: string
          description: واحد اندازه‌گیری موجودی (مثلاً "کیلوگرم", "لیتر", "بسته")
          example: "کیلوگرم"
