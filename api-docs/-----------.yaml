```yaml
openapi: 3.0.0
info:
  title: سرویس کود کشاورزی
  description: |
    این API برای مدیریت اطلاعات مربوط به کودهای کشاورزی طراحی شده است.
    کاربران می‌توانند لیست کودها را مشاهده کنند، جزئیات یک کود خاص را دریافت کنند،
    کود جدید اضافه کنند، اطلاعات کودهای موجود را به‌روزرسانی کنند و یا آن‌ها را حذف نمایند.
  version: 1.0.0
servers:
  - url: https://kalatakco.com/
    description: سرور اصلی API کود کشاورزی
tags:
  - name: کودها
    description: عملیات مربوط به مدیریت اطلاعات کودهای کشاورزی (افزودن، مشاهده، به‌روزرسانی، حذف)
paths:
  /fertilizers:
    get:
      summary: دریافت لیست همه کودها
      operationId: getAllFertilizers
      tags:
        - کودها
      description: این متد لیست کاملی از تمام کودهای کشاورزی ثبت شده در سیستم را برمی‌گرداند.
      responses:
        '200':
          description: لیستی از کودها با موفقیت دریافت شد.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Fertilizer'
        '500':
          description: خطای داخلی سرور هنگام بازیابی لیست کودها.
    post:
      summary: افزودن یک کود جدید
      operationId: createFertilizer
      tags:
        - کودها
      description: این متد برای افزودن یک کود کشاورزی جدید به سیستم استفاده می‌شود.
      requestBody:
        description: اطلاعات کامل کود جدید برای ثبت در سیستم.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FertilizerInput'
      responses:
        '201':
          description: کود با موفقیت ایجاد و ذخیره شد.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fertilizer'
        '400':
          description: درخواست نامعتبر است. (مثلاً اطلاعات ناقص یا فرمت اشتباه)
        '409':
          description: کود با همین نام یا مشخصات قبلاً موجود است.

  /fertilizers/{fertilizerId}:
    parameters:
      - name: fertilizerId
        in: path
        required: true
        description: شناسه منحصر به فرد کود مورد نظر.
        schema:
          type: string
          format: uuid
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
    get:
      summary: دریافت جزئیات یک کود خاص
      operationId: getFertilizerById
      tags:
        - کودها
      description: این متد جزئیات کامل یک کود کشاورزی را بر اساس شناسه آن برمی‌گرداند.
      responses:
        '200':
          description: جزئیات کود با موفقیت دریافت شد.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fertilizer'
        '404':
          description: کود با شناسه مشخص شده یافت نشد.
        '400':
          description: فرمت شناسه کود نامعتبر است.
    put:
      summary: به‌روزرسانی کامل اطلاعات یک کود
      operationId: updateFertilizer
      tags:
        - کودها
      description: این متد اطلاعات یک کود موجود را به طور کامل با داده‌های جدید جایگزین می‌کند.
      requestBody:
        description: اطلاعات کامل و به‌روز شده کود.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FertilizerInput'
      responses:
        '200':
          description: کود با موفقیت به‌روزرسانی شد.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fertilizer'
        '400':
          description: درخواست نامعتبر است. (مثلاً اطلاعات ناقص یا فرمت اشتباه)
        '404':
          description: کود با شناسه مشخص شده یافت نشد.
    delete:
      summary: حذف یک کود
      operationId: deleteFertilizer
      tags:
        - کودها
      description: این متد یک کود کشاورزی را بر اساس شناسه آن از سیستم حذف می‌کند.
      responses:
        '204':
          description: کود با موفقیت حذف شد. (پاسخ بدون محتوا)
        '404':
          description: کود با شناسه مشخص شده یافت نشد.
        '400':
          description: فرمت شناسه کود نامعتبر است.

components:
  schemas:
    Fertilizer:
      type: object
      required:
        - id
        - name
        - type
        - composition
        - pricePerUnit
        - unit
      properties:
        id:
          type: string
          format: uuid
          description: شناسه منحصر به فرد کود (تولید شده توسط سیستم).
          readOnly: true
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        name:
          type: string
          description: نام تجاری یا عمومی کود.
          example: کود کامل NPK 20-20-20
        type:
          type: string
          description: نوع کود (مانند شیمیایی، آلی، زیستی، میکروبی).
          enum: [شیمیایی, آلی, زیستی, میکروبی, کلات, مایع, گرانول]
          example: شیمیایی
        composition:
          type: string
          description: ترکیب شیمیایی یا فرمولاسیون اصلی کود (مثلاً NPK 20-20-20 + TE).
          example: NPK 20-20-20 + عناصر ریزمغذی
        manufacturer:
          type: string
          description: نام شرکت تولیدکننده کود.
          nullable: true
          example: شرکت کودسازان برتر آسیا
        description:
          type: string
          description: توضیحات تکمیلی درباره کود، کاربردها و نحوه مصرف آن.
          nullable: true
          example: این کود برای افزایش رشد رویشی و زایشی در کلیه محصولات زراعی و باغی مناسب است.
        pricePerUnit:
          type: number
          format: float
          description: قیمت هر واحد از کود به ریال.
          minimum: 0
          example: 150000.0
        unit:
          type: string
          description: واحد اندازه‌گیری کود (مانند کیلوگرم، لیتر، بسته، عدد).
          enum: [کیلوگرم, لیتر,