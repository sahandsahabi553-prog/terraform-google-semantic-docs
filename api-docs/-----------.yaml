```yaml
openapi: 3.0.3
info:
  title: سرویس کود کشاورزی
  description: مدیریت انواع کودهای کشاورزی، موجودی و سفارش‌ها
  version: 1.0.0
  contact:
    name: پشتیبانی کالاتک
    url: https://kalatakco.com/support
servers:
  - url: https://kalatakco.com/
paths:
  /fertilizers:
    get:
      summary: دریافت فهرست کودها
      description: بازگرداندن لیستی از تمام کودهای ثبت‌شده به‌همراه فیلترهای اختیاری
      operationId: listFertilizers
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [شیمیایی, زیستی, آلی]
          description: فیلتر بر اساس نوع کود
        - in: query
          name: available
          schema:
            type: boolean
          description: فقط کودهای موجود در انبار
      responses:
        '200':
          description: فهرست کودها
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Fertilizer'
    post:
      summary: ثبت کود جدید
      description: افزودن یک نوع کود جدید به سامانه
      operationId: createFertilizer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FertilizerInput'
      responses:
        '201':
          description: کود با موفقیت ایجاد شد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fertilizer'
        '400':
          description: داده‌های ارسالی نادرست است
  /fertilizers/{fertilizerId}:
    get:
      summary: دریافت اطلاعات یک کود
      description: مشاهده جزییات کامل یک کود خاص
      operationId: getFertilizer
      parameters:
        - name: fertilizerId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{24}$'
      responses:
        '200':
          description: جزییات کود
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fertilizer'
        '404':
          description: کود یافت نشد
    put:
      summary: به‌روزرسانی کود
      description: ویرایش اطلاعات یک کود موجود
      operationId: updateFertilizer
      parameters:
        - name: fertilizerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FertilizerInput'
      responses:
        '200':
          description: کود به‌روز شد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fertilizer'
    delete:
      summary: حذف کود
      description: حذف یک کود از سامانه (حذف منطقی)
      operationId: deleteFertilizer
      parameters:
        - name: fertilizerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: کود با موفقیت حذف شد
        '404':
          description: کود یافت نشد
  /orders:
    post:
      summary: ثبت سفارش خرید کود
      description: ایجاد یک درخواست خرید جدید برای کود مشخص
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: سفارش با موفقیت ایجاد شد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: موجودی کافی نیست یا داده‌ها نادرست است
components:
  schemas:
    Fertilizer:
      type: object
      properties:
        id:
          type: string
          description: شناسه یکتا
        name:
          type: string
          description: نام کود
        type:
          type: string
          enum: [شیمیایی, زیستی, آلی]
        stock:
          type: integer
          minimum: 0
          description: موجودی در انبار (کیلوگرم)
        unitPrice:
          type: number
          format: float
          description: قیمت هر کیلوگرم (تومان)
        nutrientContent:
          type: string
          description: درصد عناصر غذایی
        createdAt:
          type: string
          format: date-time
      required: [name, type, stock, unitPrice]
    FertilizerInput:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [شیمیایی, زیستی, آلی]
        stock:
          type: integer
          minimum: 0
        unitPrice:
          type: number
          format: float
        nutrientContent:
          type: string
      required: [name, type, stock, unitPrice]
    OrderInput:
      type: object
      properties:
        fertilizerId:
          type: string
          description: شناسه کود
        quantity:
          type: integer
          minimum: 1
          description: مقدار به کیلوگرم
        customerName:
          type: string
          description: نام خریدار
        address:
          type: string
          description: آدرس تحویل
      required: [fertilizerId, quantity, customerName, address]
    Order:
      allOf:
        - type: object
          properties:
            id:
              type: string
            status:
              type: string
              enum: [در انتظار, تایید شده, ارسال شده, تحویل داده شده]
            createdAt:
              type: string
              format: date-time
        - $ref: '#/components/schemas/OrderInput'
tags:
  - name: fertilizer
    description: عملیات مربوط به کودها
  - name: order
    description: عملیات مربوط به سفارش‌ها
```