```yaml
openapi: 3.0.3
info:
  title: سرویس کود کشاورزی
  description: مدیریت اطلاعات کودهای کشاورزی
  version: 1.0.0
servers:
  - url: https://kalatakco.com/
paths:
  /fertilizers:
    get:
      summary: دریافت لیست کودها
      description: بازگرداندن لیستی از تمام کودهای موجود
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [ارگانیک, شیمیایی]
          description: فیلتر بر اساس نوع کود
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: شماره صفحه برای صفحه‌بندی
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: تعداد آیتم‌ها در هر صفحه
      responses:
        '200':
          description: لیست کودها
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Fertilizer'
                  total:
                    type: integer
        '400':
          $ref: '#/components/responses/400'
    post:
      summary: ثبت کود جدید
      description: ایجاد کود جدید در سیستم
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FertilizerInput'
      responses:
        '201':
          description: کود با موفقیت ایجاد شد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fertilizer'
        '400':
          $ref: '#/components/responses/400'
  /fertilizers/{id}:
    get:
      summary: دریافت اطلاعات یک کود
      description: بازگرداندن اطلاعات کامل یک کود خاص
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: اطلاعات کود
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fertilizer'
        '404':
          $ref: '#/components/responses/404'
    put:
      summary: به‌روزرسانی اطلاعات کود
      description: ویرایش اطلاعات یک کود موجود
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FertilizerInput'
      responses:
        '200':
          description: کود با موفقیت به‌روز شد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fertilizer'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
    delete:
      summary: حذف کود
      description: حذف یک کود از سیستم
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: کود با موفقیت حذف شد
        '404':
          $ref: '#/components/responses/404'
components:
  parameters:
    id:
      in: path
      name: id
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{24}$'
      description: شناسه یکتای کود
  schemas:
    Fertilizer:
      type: object
      properties:
        id:
          type: string
          example: 60d5ec9a8e4dc70015f1a123
        name:
          type: string
          example: نیترات آمونیوم
        type:
          type: string
          enum: [ارگانیک, شیمیایی]
        company:
          type: string
          example: پتروشیمی کرمانشاه
        analysis:
          type: string
          example: ۲۶% نیتروژن
        usage:
          type: string
          example: برای محصولات زراعی
        price:
          type: number
          example: ۲۵۰۰۰
        unit:
          type: string
          example: کیلوگرم
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FertilizerInput:
      type: object
      required: [name, type, company, price, unit]
      properties:
        name:
          type: string
          maxLength: 100
        type:
          type: string
          enum: [ارگانیک, شیمیایی]
        company:
          type: string
          maxLength: 100
        analysis:
          type: string
          maxLength: 50
        usage:
          type: string
          maxLength: 200
        price:
          type: number
          minimum: 0
        unit:
          type: string
          maxLength: 20
  responses:
    '400':
      description: درخواست اشتباه
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: اطلاعات ورودی نامعتبر است
    '404':
      description: یافت نشد
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: کود مورد نظر یافت نشد
```