      operationId: getKeshavarzi
      parameters:
        - in: path
          name: keshavarziId
          schema:
            type: integer
          required: true
          description: شناسه کشت
      responses:
        '200':
          description: کشت
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Keshavarzi'
        '404':
          description: کشت یافت نشد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Cud:
      type: object
      properties:
        id:
          type: integer
          description: شناسه کود
        name:
          type: string
          description: نام کود
        description:
          type: string
          description: توضیحات کود
      required:
        - name
        - description
    Keshavarzi:
      type: object
      properties:
        id:
          type: integer
          description: شناسه کشت
        name:
          type: string
          description: نام کشت
        description:
          type: string
          description: توضیحات کشت
      required:
        - name
        - description
    Error:
      type: object
      properties:
        code:
          type: integer
          description: کد خطا
        message:
          type: string
          description: پیغام خطا
      required:
        - code
        - message
