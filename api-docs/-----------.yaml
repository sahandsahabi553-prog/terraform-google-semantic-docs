openapi: 3.0.0
info:
  title: سرویس مدیریت کود کشاورزی
  description: |
    این API برای مدیریت اطلاعات مربوط به کودهای کشاورزی طراحی شده است.
    شما می‌توانید از این سرویس برای ثبت، مشاهده، به‌روزرسانی و حذف اطلاعات کودها،
    همچنین مدیریت موجودی و جزئیات آن‌ها استفاده کنید.
  version: 1.0.0
  contact:
    name: شرکت کلاتک
    url: https://kalatakco.com
    email: info@kalatakco.com

servers:
  - url: https://kalatakco.com/api/v1
    description: سرور اصلی برای عملیات API کود کشاورزی

tags:
  - name: کودها
    description: عملیات مربوط به مدیریت کودهای کشاورزی

paths:
  /fertilizers:
    get:
      summary: دریافت لیست همه کودهای کشاورزی
      description: این عملیات لیست کاملی از تمام کودهای کشاورزی موجود در سیستم را برمی‌گرداند.
      operationId: getFertilizers
      tags:
        - کودها
      responses:
        '200':
          description: لیست کودها با موفقیت دریافت شد.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Fertilizer'
        '500':
          description: خطای داخلی سرور
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: ثبت یک کود کشاورزی جدید
      description: این عملیات برای ثبت اطلاعات یک کود کشاورزی جدید در سیستم استفاده می‌شود.
      operationId: createFertilizer
      tags:
        - کودها
      requestBody:
        description: شیء کود کشاورزی برای ثبت
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewFertilizer'
      responses:
        '201':
          description: کود جدید با موفقیت ثبت شد.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fertilizer'
        '400':
          description: درخواست نامعتبر (داده‌های ورودی ناقص یا نادرست)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: خطای داخلی سرور
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /fertilizers/{fertilizerId}:
    get:
      summary: دریافت جزئیات یک کود کشاورزی خاص
