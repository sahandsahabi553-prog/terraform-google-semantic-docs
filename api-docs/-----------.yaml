```yml
openapi: 3.0.0
info:
  title: سرویس کود کشاورزی
  description: API برای مدیریت کود کشاورزی
  version: 1.0.0
servers:
  - url: https://kalatakco.com/
    description: سرور اصلی
tags:
  - name: کود
    description: عملیات مربوط به کود
  - name: کشت
    description: عملیات مربوط به کشت
paths:
  /cuds:
    get:
      tags:
        - کود
      summary: دریافت لیست کودها
      description: دریافت لیست تمام کودهای ثبت شده
      operationId: getCuds
      responses:
        '200':
          description: لیست کودها
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cud'
        '500':
          description: خطای سرور
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - کود
      summary: ثبت کود جدید
      description: ثبت یک کود جدید
      operationId: createCud
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cud'
      responses:
        '201':
          description: کود ثبت شد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cud'
        '400':
          description: داده‌های ورود نادرست
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /cuds/{cudId}:
    get:
      tags:
        - کود
      summary: دریافت کود
      description: دریافت یک کود با شناسه مشخص
      operationId: getCud
      parameters:
        - in: path
          name: cudId
          schema:
            type: integer
          required: true
          description: شناسه کود
      responses:
        '200':
          description: کود
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cud'
        '404':
          description: کود یافت نشد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - کود
      summary: ویرایش کود
      description: ویرایش یک کود
      operationId: updateCud
      parameters:
        - in: path
          name: cudId
          schema:
            type: integer
          required: true
          description: شناسه کود
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cud'
      responses:
        '200':
          description: کود ویرایش شد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cud'
        '400':
          description: داده‌های ورود نادرست
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - کود
      summary: حذف کود
      description: حذف یک کود
      operationId: deleteCud
      parameters:
        - in: path
          name: cudId
          schema:
            type: integer
          required: true
          description: شناسه کود
      responses:
        '204':
          description: کود حذف شد
        '404':
          description: کود یافت نشد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /keshavarzi:
    post:
      tags:
        - کشت
      summary: ثبت کشت
      description: ثبت یک کشت جدید
      operationId: createKeshavarzi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Keshavarzi'
      responses:
        '201':
          description: کشت ثبت شد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Keshavarzi'
        '400':
          description: داده‌های ورود نادرست
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /keshavarzi/{keshavarziId}:
    get:
      tags:
        - کشت
