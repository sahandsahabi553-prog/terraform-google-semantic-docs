openapi: 3.0.0
info:
  title: API سرویس دامافارم
  description: رابط برنامه‌نویسی برای مدیریت منابع و محصولات سامانه دامافارم
  version: 1.0.0
servers:
  - url: https://damafarm.ir/api/v1
    description: سرور اصلی دامافارم
paths:
  /products:
    get:
      summary: دریافت لیست محصولات
      tags:
        - محصولات
      responses:
        '200':
          description: لیست محصولات با موفقیت دریافت شد
    post:
      summary: ثبت محصول جدید
      tags:
        - محصولات
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      summary: به‌روزرسانی اطلاعات محصول
      tags:
        - محصولات
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: محصول با موفقیت ویرایش شد
    delete:
      summary: حذف محصول
      tags:
        - محصولات
      responses:
        '204':
          description: محصول با موفقیت حذف شد
  /orders:
    post:
      summary: ثبت سفارش جدید
      tags:
        - سفارشات
      responses:
        '201':
          description: سفارش ثبت شد

components:
  schemas:
    Product:
      type: object
      required:
        - name
        - price
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: نام محصول
        price:
          type: number
          description: قیمت به تومان
        stock:
          type: integer
          description: موجودی در انبار