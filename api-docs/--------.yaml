openapi: 3.0.0
info:
  title: API سرویس دامافارم
  description: مستندات رسمی رابط برنامه‌نویسی کاربردی سامانه دامافارم برای مدیریت محصولات کشاورزی و دامی.
  version: 1.0.0
servers:
  - url: https://damafarm.ir
    description: سرور اصلی دامافارم
paths:
  /products:
    get:
      summary: دریافت لیست محصولات
      description: بازگرداندن لیستی از محصولات موجود در انبار دامافارم.
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      summary: ثبت محصول جدید
      description: افزودن یک محصول دامی یا کشاورزی جدید به سیستم.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: دریافت جزئیات محصول
      description: دریافت اطلاعات کامل یک محصول خاص بر اساس شناسه.
      responses:
        '200':
          description: اطلاعات محصول
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
    put:
      summary: ویرایش محصول
      description: به‌روزرسانی اطلاعات یک محصول موجود.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: محصول با موفقیت ویرایش شد
    delete:
      summary: حذف محصول
      description: حذف یک محصول از دیتابیس دامافارم.
      responses:
        '204':
          description: محصول با موفقیت حذف شد
components:
  schemas:
    Product:
      type: object
      required:
        - id
        - name
        - price
      properties:
        id:
          type: string
          description: شناسه منحصر‌به‌فرد محصول
        name:
          type: string
          description: نام محصول (مثلاً شیر خام، گندم)
        category:
          type: string
          description: دسته‌بندی محصول (دامی/کشاورزی)
        price:
          type: number
          description: قیمت به تومان
        stock:
          type: integer
          description: موجودی در انبار