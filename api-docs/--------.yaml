openapi: 3.0.0
info:
  title: API سرویس دامافارم
  description: مستندات رسمی رابط برنامه‌نویسی کاربردی دامافارم برای مدیریت دام و محصولات کشاورزی.
  version: 1.0.0
servers:
  - url: https://damafarm.ir
    description: سرور اصلی دامافارم
paths:
  /livestock:
    get:
      summary: دریافت لیست دام‌ها
      description: بازگرداندن لیستی از تمام دام‌های ثبت شده در سامانه.
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Livestock'
    post:
      summary: ثبت دام جدید
      description: افزودن یک دام جدید به پایگاه داده دامافارم.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Livestock'
      responses:
        '201':
          description: دام با موفقیت ثبت شد
  /livestock/{id}:
    put:
      summary: به‌روزرسانی اطلاعات دام
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Livestock'
      responses:
        '200':
          description: اطلاعات با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف دام
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: دام با موفقیت حذف شد
  /health-reports:
    get:
      summary: دریافت گزارش‌های سلامت
      description: دریافت سوابق پزشکی و سلامت گله.
      responses:
        '200':
          description: لیست گزارش‌ها
components:
  schemas:
    Livestock:
      type: object
      required:
        - id
        - tag_number
        - species
      properties:
        id:
          type: string
          description: شناسه منحصر‌به‌فرد دام
        tag_number:
          type: string
          description: شماره پلاک گوش دام
        species:
          type: string
          description: نوع دام (گاو، گوسفند و غیره)
        age:
          type: integer
          description: سن دام به ماه
        weight:
          type: number
          description: وزن فعلی دام به کیلوگرم