openapi: 3.0.0
info:
  title: API سرویس دامافارم
  description: رابط برنامه‌نویسی برای مدیریت اطلاعات دام و محصولات کشاورزی در سامانه دامافارم.
  version: 1.0.0
servers:
  - url: https://damafarm.ir/api/v1
    description: سرور اصلی تولیدی

paths:
  /livestock:
    get:
      summary: لیست تمام دام‌ها
      description: دریافت لیست کامل دام‌های ثبت شده در سامانه با قابلیت فیلترینگ.
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Livestock'
    post:
      summary: ثبت دام جدید
      description: افزودن یک رکورد جدید برای دام در سیستم.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Livestock'
      responses:
        '201':
          description: دام با موفقیت ایجاد شد.

  /livestock/{id}:
    put:
      summary: به‌روزرسانی اطلاعات دام
      description: ویرایش مشخصات یک دام خاص بر اساس شناسه.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Livestock'
      responses:
        '200':
          description: اطلاعات با موفقیت به‌روزرسانی شد.
    delete:
      summary: حذف دام
      description: حذف یک رکورد دام از سامانه.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: حذف با موفقیت انجام شد.

  /health:
    get:
      summary: وضعیت سلامت سامانه
      description: بررسی وضعیت آنلاین بودن و سلامت API.
      responses:
        '200':
          description: سامانه در دسترس است.

components:
  schemas:
    Livestock:
      type: object
      required:
        - id
        - breed
        - age
      properties:
        id:
          type: string
          description: شناسه منحصر به فرد دام
        breed:
          type: string
          description: نژاد دام
        age:
          type: integer
          description: سن دام به ماه
        weight:
          type: number
          description: وزن دام به کیلوگرم
        status:
          type: string
          enum: [Healthy, Sick, UnderTreatment]
          description: وضعیت سلامت دام