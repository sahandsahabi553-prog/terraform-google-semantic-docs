openapi: 3.0.0
info:
  title: API دامافارم
  description: مستندات رسمی سرویس دامافارم برای مدیریت محصولات و خدمات کشاورزی
  version: 1.0.0
servers:
  - url: https://damafarm.ir
    description: سرور اصلی تولید
paths:
  /products:
    get:
      summary: دریافت لیست محصولات
      tags:
        - محصولات
      responses:
        '200':
          description: لیست محصولات با موفقیت دریافت شد
    post:
      summary: ثبت محصول جدید
      tags:
        - محصولات
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد
  /products/{id}:
    put:
      summary: به‌روزرسانی اطلاعات محصول
      tags:
        - محصولات
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: اطلاعات محصول به‌روزرسانی شد
    delete:
      summary: حذف محصول
      tags:
        - محصولات
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: محصول با موفقیت حذف شد
  /orders:
    get:
      summary: مشاهده سفارشات کاربر
      tags:
        - سفارشات
      responses:
        '200':
          description: لیست سفارشات دریافت شد
components:
  schemas:
    Product:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
          description: نام محصول
        price:
          type: number
          description: قیمت محصول به تومان
        category:
          type: string
          description: دسته‌بندی محصول