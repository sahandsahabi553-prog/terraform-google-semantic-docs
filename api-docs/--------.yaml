openapi: 3.0.0
info:
  title: API سرویس دامافارم
  description: رابط برنامه‌نویسی برای مدیریت داده‌های کشاورزی و دامداری هوشمند دامافارم.
  version: 1.0.0
servers:
  - url: https://damafarm.ir/api/v1
    description: سرور اصلی دامافارم
paths:
  /livestock:
    get:
      summary: دریافت لیست دام‌ها
      description: بازگرداندن لیستی از تمام دام‌های ثبت شده در سیستم.
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
    post:
      summary: ثبت دام جدید
      description: افزودن یک دام جدید به پایگاه داده دامافارم.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Livestock'
      responses:
        '201':
          description: دام با موفقیت ثبت شد
  /livestock/{id}:
    put:
      summary: ویرایش اطلاعات دام
      description: به‌روزرسانی مشخصات یک دام خاص بر اساس شناسه.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Livestock'
      responses:
        '200':
          description: اطلاعات با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف دام
      description: حذف یک دام از سیستم دامافارم.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: دام با موفقیت حذف شد
  /health-reports:
    get:
      summary: دریافت گزارش‌های سلامت
      description: دریافت تاریخچه وضعیت سلامت دام‌ها.
      responses:
        '200':
          description: لیست گزارش‌ها دریافت شد

components:
  schemas:
    Livestock:
      type: object
      required:
        - tag_id
        - species
      properties:
        tag_id:
          type: string
          description: شماره گوش یا شناسه منحصر‌به‌فرد دام
        species:
          type: string
          description: نوع دام (گاو، گوسفند و غیره)
        age:
          type: integer
          description: سن دام به ماه
        weight:
          type: number
          description: وزن دام به کیلوگرم