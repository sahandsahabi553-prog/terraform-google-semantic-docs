openapi: 3.0.0
info:
  title: API سرویس دامافارم
  description: رابط برنامه‌نویسی برای مدیریت محصولات و خدمات دامپروری و کشاورزی دامافارم.
  version: 1.0.0
servers:
  - url: https://damafarm.ir
    description: سرور اصلی دامافارم
paths:
  /products:
    get:
      summary: دریافت لیست محصولات
      responses:
        '200':
          description: لیست محصولات با موفقیت دریافت شد.
    post:
      summary: ثبت محصول جدید
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد.
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: به‌روزرسانی اطلاعات محصول
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: محصول با موفقیت ویرایش شد.
    delete:
      summary: حذف یک محصول
      responses:
        '204':
          description: محصول با موفقیت حذف شد.
  /orders:
    get:
      summary: دریافت تاریخچه سفارشات کاربر
      responses:
        '200':
          description: لیست سفارشات با موفقیت بازیابی شد.
components:
  schemas:
    Product:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
          description: نام محصول دامی یا کشاورزی
        price:
          type: number
          description: قیمت محصول به تومان
        category:
          type: string
          description: دسته‌بندی محصول (مثلاً خوراک دام، تجهیزات)
        stock:
          type: integer
          description: موجودی انبار