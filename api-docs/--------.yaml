openapi: 3.0.0
info:
  title: API سرویس دامافارم
  description: رابط برنامه‌نویسی برای مدیریت منابع و محصولات سامانه دامافارم
  version: 1.0.0
servers:
  - url: https://damafarm.ir/api/v1
    description: سرور اصلی دامافارم
paths:
  /products:
    get:
      summary: دریافت لیست محصولات
      responses:
        '200':
          description: لیست محصولات با موفقیت دریافت شد
    post:
      summary: ثبت محصول جدید
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                price:
                  type: number
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      summary: ویرایش اطلاعات محصول
      responses:
        '200':
          description: محصول با موفقیت بروزرسانی شد
    delete:
      summary: حذف محصول
      responses:
        '204':
          description: محصول حذف شد
  /inventory/status:
    get:
      summary: بررسی موجودی انبار
      responses:
        '200':
          description: وضعیت موجودی انبار به همراه جزئیات
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                  status:
                    type: string
                    enum: [available, low_stock, out_of_stock]