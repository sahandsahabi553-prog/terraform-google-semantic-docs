openapi: 3.0.0
info:
  title: API سرویس دامافارم
  description: مستندات رسمی رابط برنامه‌نویسی کاربردی سامانه دامافارم برای مدیریت دام و محصولات کشاورزی.
  version: 1.0.0
servers:
  - url: https://damafarm.ir/api/v1
    description: سرور اصلی دامافارم
paths:
  /livestock:
    get:
      summary: لیست دام‌ها
      description: دریافت لیست تمام دام‌های ثبت شده در سامانه.
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
    post:
      summary: ثبت دام جدید
      description: افزودن یک دام جدید به پروفایل مزرعه.
      responses:
        '201':
          description: دام با موفقیت ثبت شد
  /livestock/{id}:
    put:
      summary: به‌روزرسانی اطلاعات دام
      description: ویرایش مشخصات یک دام خاص با شناسه مشخص.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: اطلاعات با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف دام
      description: حذف یک رکورد دام از سامانه.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: دام با موفقیت حذف شد
  /health-records:
    get:
      summary: سوابق پزشکی
      description: دریافت گزارش‌های وضعیت سلامت و واکسیناسیون دام‌ها.
      responses:
        '200':
          description: لیست سوابق پزشکی
components:
  schemas:
    Livestock:
      type: object
      properties:
        id:
          type: string
        tag_number:
          type: string
        breed:
          type: string
        age:
          type: integer