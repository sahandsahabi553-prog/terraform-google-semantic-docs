openapi: 3.0.0
info:
  title: API سرویس دامافارم
  description: رابط برنامه‌نویسی برای مدیریت منابع کشاورزی و دامپروری دامافارم
  version: 1.0.0
servers:
  - url: https://damafarm.ir
    description: سرور اصلی دامافارم
paths:
  /products:
    get:
      summary: دریافت لیست محصولات
      tags:
        - محصولات
      responses:
        '200':
          description: لیست محصولات با موفقیت دریافت شد
    post:
      summary: ثبت محصول جدید
      tags:
        - محصولات
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: نام محصول
                price:
                  type: number
                  description: قیمت محصول
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد
  /products/{id}:
    put:
      summary: ویرایش اطلاعات محصول
      tags:
        - محصولات
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: محصول با موفقیت بروزرسانی شد
    delete:
      summary: حذف محصول
      tags:
        - محصولات
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: محصول با موفقیت حذف شد
  /orders:
    get:
      summary: دریافت لیست سفارشات کاربر
      tags:
        - سفارشات
      responses:
        '200':
          description: لیست سفارشات با موفقیت بازیابی شد
components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number