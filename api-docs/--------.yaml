openapi: 3.0.0
info:
  title: API سرویس دامافارم
  description: مستندات رسمی رابط برنامه‌نویسی کاربردی دامافارم برای مدیریت محصولات و خدمات کشاورزی و دامی.
  version: 1.0.0
servers:
  - url: https://damafarm.ir
    description: سرور اصلی دامافارم
paths:
  /products:
    get:
      summary: دریافت لیست محصولات
      description: بازگرداندن لیستی از محصولات دامی و کشاورزی موجود در سامانه.
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      summary: ثبت محصول جدید
      description: اضافه کردن یک محصول جدید به پایگاه داده دامافارم.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: ویرایش اطلاعات محصول
      description: به‌روزرسانی مشخصات یک محصول خاص بر اساس شناسه.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: محصول با موفقیت ویرایش شد
    delete:
      summary: حذف محصول
      description: حذف یک محصول از لیست محصولات سامانه.
      responses:
        '204':
          description: محصول با موفقیت حذف شد
  /orders:
    post:
      summary: ثبت سفارش جدید
      description: ثبت یک سفارش خرید برای محصولات دامی.
      responses:
        '201':
          description: سفارش با موفقیت ثبت شد
components:
  schemas:
    Product:
      type: object
      required:
        - id
        - name
        - price
      properties:
        id:
          type: string
          description: شناسه منحصر‌به‌فرد محصول
        name:
          type: string
          description: نام محصول دامی یا کشاورزی
        category:
          type: string
          description: دسته‌بندی محصول (مثلاً خوراک دام، تجهیزات)
        price:
          type: number
          description: قیمت به تومان
        stock:
          type: integer
          description: موجودی انبار