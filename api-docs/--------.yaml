openapi: 3.0.0
info:
  title: API سرویس دامافارم
  description: مستندات رسمی رابط برنامه‌نویسی کاربردی سامانه دامافارم برای مدیریت محصولات و سفارشات دامی.
  version: 1.0.0
servers:
  - url: https://damafarm.ir
    description: سرور اصلی دامافارم
paths:
  /products:
    get:
      summary: دریافت لیست محصولات
      tags: [محصولات]
      responses:
        '200':
          description: لیست محصولات با موفقیت دریافت شد.
    post:
      summary: ثبت محصول جدید
      tags: [محصولات]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد.
  /products/{id}:
    put:
      summary: ویرایش اطلاعات محصول
      tags: [محصولات]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: محصول با موفقیت ویرایش شد.
    delete:
      summary: حذف محصول
      tags: [محصولات]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: محصول با موفقیت حذف شد.
  /orders:
    get:
      summary: دریافت تاریخچه سفارشات
      tags: [سفارشات]
      responses:
        '200':
          description: لیست سفارشات کاربر دریافت شد.
components:
  schemas:
    Product:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
          description: نام محصول دامی
        price:
          type: number
          description: قیمت واحد به ریال
        stock:
          type: integer
          description: موجودی در انبار