openapi: 3.0.0
info:
  title: API سرویس دامافارم
  description: مستندات رسمی رابط برنامه‌نویسی کاربردی دامافارم برای مدیریت دام و محصولات کشاورزی.
  version: 1.0.0
servers:
  - url: https://damafarm.ir
    description: سرور اصلی دامافارم
paths:
  /livestock:
    get:
      summary: دریافت لیست دام‌ها
      description: بازگرداندن لیستی از تمام دام‌های ثبت شده در سامانه.
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
    post:
      summary: ثبت دام جدید
      description: افزودن یک دام جدید به پایگاه داده دامافارم.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Livestock'
      responses:
        '201':
          description: دام با موفقیت ثبت شد
  /livestock/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: به‌روزرسانی اطلاعات دام
      description: ویرایش مشخصات یک دام خاص بر اساس شناسه.
      responses:
        '200':
          description: اطلاعات با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف دام
      description: حذف یک دام از سامانه دامافارم.
      responses:
        '204':
          description: دام با موفقیت حذف شد
  /health:
    get:
      summary: وضعیت سلامت سامانه
      description: بررسی وضعیت آنلاین بودن و صحت عملکرد سرور.
      responses:
        '200':
          description: سیستم در وضعیت پایدار قرار دارد
components:
  schemas:
    Livestock:
      type: object
      required:
        - tag_id
        - breed
      properties:
        tag_id:
          type: string
          description: شماره پلاک گوش دام
        breed:
          type: string
          description: نژاد دام
        age:
          type: integer
          description: سن دام به ماه
        weight:
          type: number
          description: وزن دام به کیلوگرم