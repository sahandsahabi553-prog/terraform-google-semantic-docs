openapi: 3.0.0
info:
  title: API سرویس دامافارم
  description: رابط برنامه‌نویسی برای مدیریت داده‌های کشاورزی و دامداری در پلتفرم دامافارم.
  version: 1.0.0
servers:
  - url: https://damafarm.ir
    description: سرور اصلی دامافارم
paths:
  /farms:
    get:
      summary: دریافت لیست مزارع
      responses:
        '200':
          description: لیست مزارع با موفقیت دریافت شد
    post:
      summary: ثبت مزرعه جدید
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Farm'
      responses:
        '201':
          description: مزرعه با موفقیت ایجاد شد
  /farms/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: به‌روزرسانی اطلاعات مزرعه
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Farm'
      responses:
        '200':
          description: اطلاعات با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف مزرعه
      responses:
        '204':
          description: مزرعه با موفقیت حذف شد
  /livestock:
    get:
      summary: دریافت لیست دام‌ها
      responses:
        '200':
          description: لیست دام‌ها با موفقیت دریافت شد
components:
  schemas:
    Farm:
      type: object
      properties:
        id:
          type: string
          description: شناسه یکتای مزرعه
        name:
          type: string
          description: نام مزرعه
        location:
          type: string
          description: آدرس یا موقعیت جغرافیایی
        capacity:
          type: integer
          description: ظرفیت کل مزرعه