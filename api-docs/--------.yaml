openapi: 3.0.0
info:
  title: API سرویس دامافارم
  description: رابط برنامه‌نویسی برای مدیریت محصولات، کاربران و سفارشات در سامانه دامافارم.
  version: 1.0.0
servers:
  - url: https://damafarm.ir
    description: سرور اصلی دامافارم
paths:
  /products:
    get:
      summary: دریافت لیست محصولات
      responses:
        '200':
          description: لیست محصولات با موفقیت دریافت شد.
    post:
      summary: ثبت محصول جدید
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد.
  /products/{id}:
    put:
      summary: ویرایش اطلاعات محصول
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: محصول با موفقیت بروزرسانی شد.
    delete:
      summary: حذف محصول از سامانه
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: محصول با موفقیت حذف شد.
  /orders:
    get:
      summary: دریافت لیست سفارشات کاربر
      responses:
        '200':
          description: لیست سفارشات با موفقیت ارسال شد.
components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
          description: شناسه یکتای محصول
        name:
          type: string
          description: نام محصول دامی
        price:
          type: number
          description: قیمت به تومان