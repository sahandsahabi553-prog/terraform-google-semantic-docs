openapi: 3.0.0
info:
  title: API سرویس دامافارم
  description: مستندات رسمی رابط برنامه‌نویسی کاربردی سامانه دامافارم برای مدیریت محصولات و سفارشات کشاورزی و دامی.
  version: 1.0.0
servers:
  - url: https://damafarm.ir/api/v1
    description: سرور اصلی تولید
paths:
  /products:
    get:
      summary: دریافت لیست محصولات
      description: بازگرداندن لیست تمامی محصولات موجود در سامانه دامافارم.
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      summary: ثبت محصول جدید
      description: ایجاد یک محصول جدید در انبار دامافارم.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: محصول با موفقیت ثبت شد
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      summary: به‌روزرسانی محصول
      description: ویرایش اطلاعات یک محصول موجود بر اساس شناسه.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: به‌روزرسانی موفق
    delete:
      summary: حذف محصول
      description: حذف یک محصول از لیست محصولات دامافارم.
      responses:
        '204':
          description: محصول با موفقیت حذف شد
  /orders:
    post:
      summary: ثبت سفارش جدید
      description: ثبت یک سفارش خرید جدید توسط مشتری.
      responses:
        '201':
          description: سفارش ثبت شد
components:
  schemas:
    Product:
      type: object
      required:
        - name
        - price
      properties:
        id:
          type: integer
          description: شناسه محصول
        name:
          type: string
          description: نام محصول دامی یا کشاورزی
        price:
          type: number
          description: قیمت محصول به ریال
        stock:
          type: integer
          description: موجودی انبار