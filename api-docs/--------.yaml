openapi: 3.0.0
info:
  title: API سرویس دامافارم
  description: مستندات رسمی رابط برنامه‌نویسی کاربردی دامافارم برای مدیریت دام و محصولات کشاورزی.
  version: 1.0.0
servers:
  - url: https://damafarm.ir/api/v1
    description: سرور اصلی دامافارم
paths:
  /livestock:
    get:
      summary: لیست تمام دام‌ها
      responses:
        '200':
          description: دریافت موفقیت‌آمیز لیست دام‌ها
    post:
      summary: ثبت دام جدید
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Livestock'
      responses:
        '201':
          description: دام با موفقیت ثبت شد
  /livestock/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: به‌روزرسانی اطلاعات دام
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Livestock'
      responses:
        '200':
          description: اطلاعات با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف دام از سیستم
      responses:
        '204':
          description: دام با موفقیت حذف شد
  /health-reports:
    get:
      summary: دریافت گزارش‌های سلامت دام‌ها
      responses:
        '200':
          description: لیست گزارش‌های سلامت
components:
  schemas:
    Livestock:
      type: object
      required:
        - tag_id
        - breed
      properties:
        tag_id:
          type: string
          description: شماره پلاک دام
        breed:
          type: string
          description: نژاد دام
        age:
          type: integer
          description: سن دام به ماه
        weight:
          type: number
          description: وزن دام به کیلوگرم