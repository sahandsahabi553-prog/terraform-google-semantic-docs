openapi: 3.0.0
info:
  title: API سرویس دامافارم
  description: مستندات رسمی رابط برنامه‌نویسی کاربردی دامافارم برای مدیریت منابع کشاورزی و دامی.
  version: 1.0.0
servers:
  - url: https://damafarm.ir
    description: سرور اصلی دامافارم
paths:
  /api/v1/livestock:
    get:
      summary: دریافت لیست دام‌ها
      description: بازگرداندن لیستی از تمام دام‌های ثبت شده در سامانه.
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
    post:
      summary: ثبت دام جدید
      description: افزودن یک دام جدید به پایگاه داده دامافارم.
      responses:
        '201':
          description: دام با موفقیت ایجاد شد
  /api/v1/livestock/{id}:
    get:
      summary: دریافت جزئیات دام
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: جزئیات دام
    put:
      summary: ویرایش اطلاعات دام
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: اطلاعات با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف دام
      description: حذف یک رکورد دامی از سامانه بر اساس شناسه.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: دام با موفقیت حذف شد
components:
  schemas:
    Livestock:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        age:
          type: integer