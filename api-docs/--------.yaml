openapi: 3.0.0
info:
  title: API سرویس دامافارم
  description: مستندات رسمی رابط برنامه‌نویسی کاربردی دامافارم برای مدیریت منابع کشاورزی و دامپروری.
  version: 1.0.0
servers:
  - url: https://damafarm.ir
    description: سرور اصلی تولید
paths:
  /api/v1/products:
    get:
      summary: دریافت لیست محصولات
      tags:
        - محصولات
      responses:
        '200':
          description: لیست محصولات با موفقیت دریافت شد.
    post:
      summary: ثبت محصول جدید
      tags:
        - محصولات
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                price:
                  type: number
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد.
  /api/v1/products/{id}:
    put:
      summary: به‌روزرسانی اطلاعات محصول
      tags:
        - محصولات
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: اطلاعات محصول به‌روزرسانی شد.
    delete:
      summary: حذف محصول
      tags:
        - محصولات
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: محصول با موفقیت حذف شد.
  /api/v1/reports/summary:
    get:
      summary: دریافت گزارش آماری مجموعه
      tags:
        - گزارشات
      responses:
        '200':
          description: گزارش آماری با موفقیت تولید شد.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_assets:
                    type: integer
                  active_units:
                    type: integer