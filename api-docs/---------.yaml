openapi: 3.0.0
info:
  title: API سرویس سوزن زرین
  description: مستندات رسمی مدیریت خدمات خیاطی و گلدوزی سوزن زرین
  version: 1.0.0
servers:
  - url: https://www.instagram.com/mina_mino2026?igsh=MW5ndzFqYjBmYnFrNQ==
    description: سرور اصلی خدمات سوزن زرین

paths:
  /orders:
    get:
      summary: دریافت لیست سفارشات
      tags: [سفارشات]
      responses:
        '200':
          description: لیست سفارشات با موفقیت دریافت شد.
    post:
      summary: ثبت سفارش جدید
      tags: [سفارشات]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_name: {type: string}
                service_type: {type: string}
      responses:
        '201':
          description: سفارش با موفقیت ثبت شد.

  /orders/{id}:
    put:
      summary: به‌روزرسانی وضعیت سفارش
      tags: [سفارشات]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: سفارش با موفقیت ویرایش شد.
    delete:
      summary: حذف سفارش
      tags: [سفارشات]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '204':
          description: سفارش با موفقیت حذف شد.

  /portfolio:
    get:
      summary: دریافت نمونه‌کارهای گلدوزی
      tags: [نمونه‌کارها]
      responses:
        '200':
          description: لیست تصاویر و نمونه‌کارها با موفقیت دریافت شد.

components:
  schemas:
    Order:
      type: object
      properties:
        id: {type: string}
        customer_name: {type: string}
        status: {type: string}