openapi: 3.0.0
info:
  title: API سرویس سوزن زرین
  description: مستندات رسمی مدیریت خدمات خیاطی و سفارشات سوزن زرین
  version: 1.0.0
servers:
  - url: https://api.sozane-zarin.com/v1
    description: سرور اصلی تولیدی
  - url: https://www.instagram.com/sozane.zarin
    description: صفحه اینستاگرام سوزن زرین
paths:
  /orders:
    get:
      summary: دریافت لیست سفارشات
      tags:
        - سفارشات
      responses:
        '200':
          description: لیست سفارشات با موفقیت دریافت شد.
    post:
      summary: ثبت سفارش جدید
      tags:
        - سفارشات
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_name:
                  type: string
                service_type:
                  type: string
      responses:
        '201':
          description: سفارش با موفقیت ثبت شد.
  /orders/{orderId}:
    put:
      summary: به‌روزرسانی وضعیت سفارش
      tags:
        - سفارشات
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: وضعیت سفارش با موفقیت تغییر کرد.
    delete:
      summary: حذف سفارش
      tags:
        - سفارشات
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: سفارش حذف شد.
  /services:
    get:
      summary: دریافت لیست خدمات سوزن زرین
      tags:
        - خدمات
      responses:
        '200':
          description: لیست خدمات موجود شامل تعمیرات، دوخت لباس مجلسی و غیره.
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed]