openapi: 3.0.0
info:
  title: API سرویس سوزن زرین
  description: مستندات رسمی برای مدیریت خدمات خیاطی و گلدوزی سوزن زرین
  version: 1.0.0
servers:
  - url: https://api.sozane-zarin.ir/v1
    description: سرور اصلی خدمات

paths:
  /orders:
    get:
      summary: دریافت لیست سفارشات
      tags: [Orders]
      responses:
        '200':
          description: لیست سفارشات با موفقیت دریافت شد
    post:
      summary: ثبت سفارش جدید
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '201':
          description: سفارش با موفقیت ثبت شد

  /orders/{orderId}:
    put:
      summary: ویرایش وضعیت سفارش
      tags: [Orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: سفارش به‌روزرسانی شد
    delete:
      summary: حذف سفارش
      tags: [Orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: سفارش حذف شد

  /services:
    get:
      summary: لیست خدمات سوزن زرین
      tags: [Services]
      responses:
        '200':
          description: لیست خدمات موجود

components:
  schemas:
    Order:
      type: object
      required:
        - customerName
        - serviceType
      properties:
        customerName:
          type: string
          description: نام مشتری
        serviceType:
          type: string
          description: نوع خدمات (گلدوزی، خیاطی و غیره)
        price:
          type: number
          description: مبلغ برآورد شده