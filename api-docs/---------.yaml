openapi: 3.0.0
info:
  title: API سرویس سوزن زرین
  description: مستندات رسمی برای مدیریت خدمات خیاطی و سفارشات سوزن زرین
  version: 1.0.0
servers:
  - url: https://api.sozane-zarin.com/v1
    description: سرور اصلی تولید
paths:
  /orders:
    get:
      summary: دریافت لیست سفارشات
      responses:
        '200':
          description: لیست سفارشات با موفقیت دریافت شد
    post:
      summary: ثبت سفارش جدید
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_name: {type: string}
                service_type: {type: string}
      responses:
        '201':
          description: سفارش با موفقیت ثبت شد
  /orders/{id}:
    put:
      summary: ویرایش وضعیت سفارش
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: سفارش بروزرسانی شد
    delete:
      summary: حذف سفارش
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '204':
          description: سفارش حذف شد
  /services:
    get:
      summary: لیست خدمات سوزن زرین
      responses:
        '200':
          description: لیست خدمات قابل ارائه
components:
  schemas:
    Order:
      type: object
      properties:
        id: {type: string}
        status: {type: string}
        price: {type: number}