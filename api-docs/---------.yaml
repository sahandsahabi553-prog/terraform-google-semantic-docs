openapi: 3.0.0
info:
  title: API سرویس سوزن زرین
  description: مستندات رسمی مدیریت خدمات خیاطی و سفارشات سوزن زرین
  version: 1.0.0
servers:
  - url: https://api.sozane-zarin.ir/v1
    description: سرور اصلی تولیدی سوزن زرین
paths:
  /orders:
    get:
      summary: لیست تمام سفارشات
      tags: [Orders]
      responses:
        '200':
          description: دریافت موفق لیست سفارشات
    post:
      summary: ثبت سفارش جدید
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_name: {type: string}
                service_type: {type: string}
      responses:
        '201':
          description: سفارش با موفقیت ثبت شد
  /orders/{id}:
    put:
      summary: ویرایش وضعیت سفارش
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: سفارش به‌روزرسانی شد
    delete:
      summary: حذف سفارش
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '204':
          description: سفارش با موفقیت حذف شد
  /portfolio:
    get:
      summary: دریافت نمونه‌کارهای سوزن زرین
      tags: [Gallery]
      responses:
        '200':
          description: لیست تصاویر و نمونه‌کارها
components:
  schemas:
    Order:
      type: object
      properties:
        id: {type: string}
        customer_name: {type: string}
        status: {type: string}