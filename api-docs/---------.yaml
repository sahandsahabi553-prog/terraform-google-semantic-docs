openapi: 3.0.0
info:
  title: API سرویس سوزن زرین
  description: مستندات رسمی برای مدیریت سفارشات و محصولات خیاطی سوزن زرین
  version: 1.0.0
servers:
  - url: https://api.soozan-zarrin.com/v1
    description: سرور اصلی تولیدی سوزن زرین

paths:
  /orders:
    get:
      summary: دریافت لیست سفارشات
      tags: [Orders]
      responses:
        '200':
          description: لیست سفارشات با موفقیت دریافت شد
    post:
      summary: ثبت سفارش جدید
      tags: [Orders]
      responses:
        '201':
          description: سفارش با موفقیت ثبت شد

  /orders/{id}:
    put:
      summary: به‌روزرسانی وضعیت سفارش
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: سفارش با موفقیت ویرایش شد
    delete:
      summary: حذف یک سفارش
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: سفارش حذف شد

  /products:
    get:
      summary: مشاهده کاتالوگ محصولات سوزن زرین
      tags: [Products]
      responses:
        '200':
          description: لیست محصولات با موفقیت دریافت شد

components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
        customerName:
          type: string
        serviceType:
          type: string
          description: نوع دوخت یا خدمات خیاطی
        status:
          type: string
          enum: [pending, in_progress, completed]