openapi: 3.0.0
info:
  title: API سرویس سوزن زرین
  description: مستندات رسمی برای مدیریت خدمات گلدوزی و خیاطی سوزن زرین
  version: 1.0.0
servers:
  - url: https://api.sozane-zarin.com/v1
    description: سرور اصلی خدمات سوزن زرین
paths:
  /orders:
    get:
      summary: دریافت لیست سفارشات
      tags: [Orders]
      responses:
        '200':
          description: لیست سفارشات با موفقیت دریافت شد
    post:
      summary: ثبت سفارش جدید
      tags: [Orders]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_name: {type: string}
                service_type: {type: string}
      responses:
        '201':
          description: سفارش با موفقیت ثبت شد
  /orders/{id}:
    put:
      summary: به‌روزرسانی وضعیت سفارش
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: وضعیت سفارش به‌روز شد
    delete:
      summary: حذف سفارش
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '204':
          description: سفارش حذف شد
  /services:
    get:
      summary: دریافت لیست خدمات موجود
      tags: [Services]
      responses:
        '200':
          description: لیست خدمات با موفقیت دریافت شد
components:
  schemas:
    Order:
      type: object
      properties:
        id: {type: string}
        status: {type: string}
        date: {type: string, format: date}