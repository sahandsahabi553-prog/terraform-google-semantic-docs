openapi: 3.0.0
info:
  title: API سرویس سوزن زرین
  description: رابط برنامه‌نویسی برای مدیریت محصولات و خدمات خیاطی و گلدوزی سوزن زرین.
  version: 1.0.0
servers:
  - url: https://api.soozan-zarrin.com/v1
    description: سرور اصلی خدمات سوزن زرین
paths:
  /products:
    get:
      summary: دریافت لیست محصولات
      description: بازگرداندن لیستی از تمام کارهای گلدوزی و خیاطی موجود.
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      summary: ثبت سفارش جدید
      description: ایجاد یک سفارش جدید برای مشتری.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: سفارش با موفقیت ثبت شد
  /products/{id}:
    put:
      summary: ویرایش اطلاعات محصول
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: ویرایش با موفقیت انجام شد
    delete:
      summary: حذف یک محصول
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: محصول با موفقیت حذف شد
  /orders/status:
    get:
      summary: استعلام وضعیت سفارش
      description: پیگیری وضعیت سفارش با استفاده از کد رهگیری.
      parameters:
        - name: trackingCode
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: وضعیت سفارش دریافت شد
components:
  schemas:
    Product:
      type: object
      required:
        - name
        - price
      properties:
        id:
          type: string
          description: شناسه منحصر به فرد محصول
        name:
          type: string
          description: نام طرح یا خدمت
        price:
          type: number
          description: قیمت به تومان
        category:
          type: string
          description: دسته‌بندی (گلدوزی، لباس، پارچه)