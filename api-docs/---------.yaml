openapi: 3.0.0
info:
  title: API سرویس سوزن زرین
  description: مستندات رسمی مدیریت خدمات خیاطی و سفارشات سوزن زرین
  version: 1.0.0
servers:
  - url: https://api.sozane-zarin.com/v1
    description: سرور اصلی
  - url: https://www.instagram.com/sozane.zarin?igsh=MW5ndzFqYjBmYnFrNQ==
    description: صفحه اینستاگرام سوزن زرین
paths:
  /orders:
    get:
      summary: لیست تمام سفارشات
      tags:
        - سفارشات
      responses:
        '200':
          description: لیست سفارشات با موفقیت دریافت شد
    post:
      summary: ثبت سفارش جدید
      tags:
        - سفارشات
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '201':
          description: سفارش با موفقیت ثبت شد
  /orders/{orderId}:
    put:
      summary: ویرایش وضعیت سفارش
      tags:
        - سفارشات
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: سفارش بروزرسانی شد
    delete:
      summary: حذف سفارش
      tags:
        - سفارشات
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: سفارش حذف شد
  /services:
    get:
      summary: مشاهده لیست خدمات خیاطی
      tags:
        - خدمات
      responses:
        '200':
          description: لیست خدمات موجود
components:
  schemas:
    Order:
      type: object
      properties:
        customerName:
          type: string
          description: نام مشتری
        serviceType:
          type: string
          description: نوع خدمات (تعمیرات، دوخت و ...)
        deliveryDate:
          type: string
          format: date
          description: تاریخ تحویل
      required:
        - customerName
        - serviceType