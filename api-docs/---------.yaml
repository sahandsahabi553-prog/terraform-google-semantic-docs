openapi: 3.0.0
info:
  title: API سرویس سوزن زرین
  description: مستندات رسمی برای مدیریت خدمات خیاطی و سفارشات سوزن زرین
  version: 1.0.0
servers:
  - url: https://api.sozane-zarin.com/v1
    description: سرور اصلی تولید
paths:
  /orders:
    get:
      summary: دریافت لیست سفارشات
      tags:
        - سفارشات
      responses:
        '200':
          description: لیست سفارشات با موفقیت دریافت شد
    post:
      summary: ثبت سفارش جدید
      tags:
        - سفارشات
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_name:
                  type: string
                service_type:
                  type: string
      responses:
        '201':
          description: سفارش با موفقیت ثبت شد
  /orders/{orderId}:
    put:
      summary: ویرایش وضعیت سفارش
      tags:
        - سفارشات
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: سفارش با موفقیت بروزرسانی شد
    delete:
      summary: حذف سفارش
      tags:
        - سفارشات
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: سفارش حذف شد
  /portfolio:
    get:
      summary: دریافت نمونه‌کارهای سوزن زرین
      tags:
        - نمونه‌کارها
      responses:
        '200':
          description: لیست تصاویر و نمونه‌کارها با موفقیت دریافت شد
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed]