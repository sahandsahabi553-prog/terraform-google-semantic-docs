openapi: 3.0.0
info:
  title: API سرویس سوزن زرین
  description: مستندات رسمی برای مدیریت سفارشات و محصولات خیاطی و گلدوزی سوزن زرین
  version: 1.0.0
servers:
  - url: https://api.sozane-zarin.ir/v1
    description: سرور اصلی عملیاتی
  - url: https://www.instagram.com/sozane.zarin
    description: صفحه رسمی اینستاگرام سوزن زرین

paths:
  /products:
    get:
      summary: دریافت لیست محصولات
      tags: [محصولات]
      responses:
        '200':
          description: لیست محصولات با موفقیت دریافت شد
    post:
      summary: ثبت محصول جدید
      tags: [محصولات]
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد

  /products/{id}:
    put:
      summary: ویرایش اطلاعات محصول
      tags: [محصولات]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: محصول با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف یک محصول
      tags: [محصولات]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: محصول با موفقیت حذف شد

  /orders:
    get:
      summary: دریافت لیست سفارشات مشتریان
      tags: [سفارشات]
      responses:
        '200':
          description: لیست سفارشات دریافت شد

components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          description: نام طرح یا خدمت خیاطی
        price:
          type: number
        category:
          type: string
    Order:
      type: object
      properties:
        orderId:
          type: string
        customerName:
          type: string
        status:
          type: string
          enum: [pending, processing, completed]