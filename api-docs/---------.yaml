openapi: 3.0.0
info:
  title: API سرویس سوزن زرین
  description: مستندات رسمی برای مدیریت خدمات خیاطی و سفارشات سوزن زرین
  version: 1.0.0
servers:
  - url: https://api.sozane-zarin.com/v1
    description: سرور اصلی تولید
paths:
  /orders:
    get:
      summary: دریافت لیست سفارشات
      tags:
        - سفارشات
      responses:
        '200':
          description: لیست سفارشات با موفقیت دریافت شد
    post:
      summary: ثبت سفارش جدید
      tags:
        - سفارشات
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_name:
                  type: string
                service_type:
                  type: string
      responses:
        '201':
          description: سفارش با موفقیت ثبت شد
  /orders/{id}:
    put:
      summary: به‌روزرسانی وضعیت سفارش
      tags:
        - سفارشات
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: سفارش به‌روزرسانی شد
    delete:
      summary: حذف سفارش
      tags:
        - سفارشات
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: سفارش با موفقیت حذف شد
  /services:
    get:
      summary: دریافت لیست خدمات سوزن زرین
      tags:
        - خدمات
      responses:
        '200':
          description: لیست خدمات موجود
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    title:
                      type: string
                    price:
                      type: number
externalDocs:
  description: صفحه اینستاگرام سوزن زرین
  url: https://www.instagram.com/sozane.zarin?igsh=MW5ndzFqYjBmYnFrNQ==