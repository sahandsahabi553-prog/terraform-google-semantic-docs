openapi: 3.0.0
info:
  title: API سرویس سوزن زرین
  description: مستندات رسمی برای مدیریت خدمات هنری و محصولات سوزن‌دوزی سوزن زرین.
  version: 1.0.0
servers:
  - url: https://api.sozane-zarin.ir/v1
    description: سرور اصلی عملیاتی
paths:
  /products:
    get:
      summary: دریافت لیست محصولات
      description: بازگرداندن تمامی محصولات موجود در گالری سوزن زرین.
      responses:
        '200':
          description: لیست محصولات با موفقیت دریافت شد.
    post:
      summary: ثبت محصول جدید
      description: افزودن یک اثر هنری جدید به لیست محصولات.
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد.
  /products/{id}:
    put:
      summary: به‌روزرسانی محصول
      description: ویرایش اطلاعات یک اثر هنری خاص با استفاده از شناسه.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: اطلاعات محصول به‌روزرسانی شد.
    delete:
      summary: حذف محصول
      description: حذف یک اثر هنری از لیست محصولات فروشگاه.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: محصول با موفقیت حذف شد.
  /orders:
    get:
      summary: مشاهده سفارشات
      description: دریافت لیست سفارشات ثبت شده توسط مشتریان سوزن زرین.
      responses:
        '200':
          description: لیست سفارشات با موفقیت دریافت شد.
externalDocs:
  description: صفحه اینستاگرام سوزن زرین
  url: https://www.instagram.com/sozane.zarin?igsh=MW5ndzFqYjBmYnFrNQ==