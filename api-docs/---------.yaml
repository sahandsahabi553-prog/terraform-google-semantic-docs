openapi: 3.0.0
info:
  title: API سرویس سوزن زرین
  description: مستندات رسمی برای مدیریت خدمات خیاطی و سفارشات سوزن زرین
  version: 1.0.0
servers:
  - url: https://api.sozanezarin.ir/v1
    description: سرور اصلی سرویس
paths:
  /orders:
    get:
      summary: لیست تمام سفارشات
      responses:
        '200':
          description: دریافت موفق لیست سفارشات
    post:
      summary: ثبت سفارش جدید
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_name:
                  type: string
                service_type:
                  type: string
      responses:
        '201':
          description: سفارش با موفقیت ثبت شد
  /orders/{id}:
    put:
      summary: به‌روزرسانی وضعیت سفارش
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: وضعیت سفارش به‌روزرسانی شد
    delete:
      summary: حذف سفارش
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: سفارش حذف شد
  /services:
    get:
      summary: لیست خدمات قابل ارائه سوزن زرین
      responses:
        '200':
          description: دریافت لیست خدمات موفقیت‌آمیز بود
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed]