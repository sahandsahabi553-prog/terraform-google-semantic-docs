openapi: 3.0.0
info:
  title: API سرویس سوزن زرین
  description: مستندات رسمی برای مدیریت سفارشات و محصولات خیاطی و گلدوزی در سرویس سوزن زرین.
  version: 1.0.0
servers:
  - url: https://api.zarin-soozan.ir/v1
    description: سرور اصلی
paths:
  /products:
    get:
      summary: دریافت لیست محصولات
      description: بازگرداندن لیست تمامی محصولات موجود در گالری سوزن زرین.
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
    post:
      summary: ثبت محصول جدید
      description: افزودن یک طرح یا محصول جدید به لیست فروشگاه.
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد
  /products/{id}:
    put:
      summary: ویرایش مشخصات محصول
      description: به‌روزرسانی قیمت، توضیحات یا موجودی یک محصول خاص.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: محصول با موفقیت ویرایش شد
    delete:
      summary: حذف محصول
      description: حذف یک محصول از فهرست فروشگاه.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: محصول با موفقیت حذف شد
  /orders:
    post:
      summary: ثبت سفارش جدید
      description: ثبت درخواست خرید مشتری برای یک محصول خاص.
      responses:
        '201':
          description: سفارش شما با موفقیت ثبت شد و به زودی با شما تماس خواهیم گرفت.
components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: integer
        description:
          type: string
    Order:
      type: object
      properties:
        product_id:
          type: string
        customer_name:
          type: string
        phone_number:
          type: string