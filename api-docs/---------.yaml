openapi: 3.0.0
info:
  title: API سرویس سوزن زرین
  description: مستندات رسمی مدیریت سفارشات و محصولات گالری سوزن زرین
  version: 1.0.0
servers:
  - url: https://api.sozane-zarin.ir/v1
    description: سرور اصلی تولید
paths:
  /products:
    get:
      summary: دریافت لیست محصولات
      tags: [Products]
      responses:
        '200':
          description: لیست محصولات با موفقیت دریافت شد
    post:
      summary: ثبت محصول جدید
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                price: {type: integer}
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد
  /products/{id}:
    put:
      summary: ویرایش اطلاعات محصول
      tags: [Products]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: محصول با موفقیت بروزرسانی شد
    delete:
      summary: حذف محصول
      tags: [Products]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '204':
          description: محصول حذف شد
  /orders:
    post:
      summary: ثبت سفارش جدید
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_name: {type: string}
                product_id: {type: string}
      responses:
        '201':
          description: سفارش ثبت شد