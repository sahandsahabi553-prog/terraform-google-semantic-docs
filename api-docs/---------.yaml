openapi: 3.0.0
info:
  title: API سرویس سوزن زرین
  description: مستندات رسمی برای مدیریت سفارشات و محصولات خیاطی و هنری «سوزن زرین»
  version: 1.0.0
servers:
  - url: https://api.zarin-soozan.ir/v1
    description: سرور اصلی عملیاتی
paths:
  /products:
    get:
      summary: دریافت لیست محصولات
      description: لیست تمامی محصولات هنری و پارچه‌های موجود را برمی‌گرداند.
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
    post:
      summary: ثبت محصول جدید
      description: ایجاد یک آیتم جدید در کاتالوگ سوزن زرین.
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد
  /orders/{orderId}:
    get:
      summary: مشاهده جزئیات سفارش
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: جزئیات سفارش دریافت شد
    put:
      summary: به‌روزرسانی وضعیت سفارش
      description: تغییر وضعیت سفارش (مثلاً از 'در حال دوخت' به 'ارسال شده').
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: وضعیت با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف سفارش
      description: لغو و حذف یک سفارش ثبت شده از دیتابیس.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: سفارش حذف شد
components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
    Order:
      type: object
      properties:
        orderId:
          type: string
        status:
          type: string
          enum: [pending, sewing, completed, cancelled]