openapi: 3.0.0
info:
  title: API سرویس سوزن زرین
  description: مستندات رسمی API برای مدیریت محصولات و سفارشات گالری سوزن زرین.
  version: 1.0.0
servers:
  - url: https://api.sozane-zarin.ir/v1
    description: سرور اصلی
paths:
  /products:
    get:
      summary: دریافت لیست محصولات
      responses:
        '200':
          description: لیست محصولات با موفقیت دریافت شد.
    post:
      summary: افزودن محصول جدید
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                price: {type: integer}
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد.
  /products/{id}:
    put:
      summary: ویرایش مشخصات محصول
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: محصول با موفقیت ویرایش شد.
    delete:
      summary: حذف محصول
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '204':
          description: محصول با موفقیت حذف شد.
  /orders:
    post:
      summary: ثبت سفارش جدید
      responses:
        '201':
          description: سفارش شما در سوزن زرین ثبت گردید.
components:
  schemas:
    Product:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        price: {type: integer}