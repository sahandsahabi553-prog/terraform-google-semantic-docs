openapi: 3.0.0
info:
  title: API سرویس سوزن زرین
  description: مستندات رسمی API برای مدیریت سفارشات و محصولات خیاطی و گلدوزی سوزن زرین
  version: 1.0.0
servers:
  - url: https://api.sozane-zarin.com/v1
    description: سرور اصلی
  - url: https://www.instagram.com/sozane.zarin
    description: صفحه اینستاگرام سوزن زرین

paths:
  /products:
    get:
      summary: دریافت لیست محصولات
      tags: [محصولات]
      responses:
        '200':
          description: لیست محصولات با موفقیت دریافت شد
    post:
      summary: ثبت محصول جدید
      tags: [محصولات]
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد

  /products/{productId}:
    put:
      summary: ویرایش اطلاعات محصول
      tags: [محصولات]
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: محصول با موفقیت بروزرسانی شد
    delete:
      summary: حذف محصول از لیست
      tags: [محصولات]
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: محصول حذف شد

  /orders:
    post:
      summary: ثبت سفارش جدید
      tags: [سفارشات]
      responses:
        '201':
          description: سفارش شما ثبت شد و به زودی با شما تماس می‌گیریم

components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: integer
    Order:
      type: object
      properties:
        customerName:
          type: string
        details:
          type: string