openapi: 3.0.0
info:
  title: API سرویس سوزن زرین
  description: مستندات رسمی برای مدیریت خدمات خیاطی و سفارشات سوزن زرین
  version: 1.0.0
servers:
  - url: https://api.sozane-zarin.ir/v1
    description: سرور اصلی
paths:
  /orders:
    get:
      summary: دریافت لیست سفارشات
      responses:
        '200':
          description: لیست سفارشات با موفقیت دریافت شد
    post:
      summary: ثبت سفارش جدید
      responses:
        '201':
          description: سفارش با موفقیت ثبت شد
  /orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: مشاهده جزئیات یک سفارش
      responses:
        '200':
          description: جزئیات سفارش
    put:
      summary: ویرایش وضعیت سفارش
      responses:
        '200':
          description: سفارش با موفقیت به‌روزرسانی شد
    delete:
      summary: لغو سفارش
      responses:
        '204':
          description: سفارش حذف شد
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
        customerName:
          type: string
        serviceType:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed, cancelled]