openapi: 3.0.0
info:
  title: سرویس مدیریت محصولات سوزن زرین
  description: مستندات API برای مدیریت خدمات خیاطی و محصولات سوزن زرین
  version: 1.0.0
servers:
  - url: https://api.sozane-zarin.ir/v1
    description: سرور اصلی تولیدی سوزن زرین

paths:
  /products:
    get:
      summary: دریافت لیست محصولات
      description: بازگرداندن تمامی محصولات موجود در فروشگاه سوزن زرین
      responses:
        '200':
          description: لیست محصولات با موفقیت دریافت شد
    post:
      summary: ثبت محصول جدید
      description: ایجاد یک آیتم جدید در کاتالوگ سوزن زرین
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد

  /products/{id}:
    put:
      summary: ویرایش اطلاعات محصول
      description: به‌روزرسانی مشخصات یک محصول خاص با شناسه مربوطه
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: محصول با موفقیت ویرایش شد
    delete:
      summary: حذف محصول
      description: حذف یک محصول از لیست محصولات سوزن زرین
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: محصول با موفقیت حذف شد

  /orders:
    post:
      summary: ثبت سفارش جدید
      description: ثبت درخواست خیاطی یا خرید محصول توسط مشتری
      responses:
        '201':
          description: سفارش شما با موفقیت ثبت شد و به زودی با شما تماس می‌گیریم

externalDocs:
  description: صفحه اینستاگرام سوزن زرین
  url: https://www.instagram.com/sozane.zarin?igsh=MW5ndzFqYjBmYnFrNQ==