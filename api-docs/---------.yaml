openapi: 3.0.0
info:
  title: سرویس مدیریت سوزن زرین
  description: مستندات API برای مدیریت خدمات و محصولات گالری سوزن زرین
  version: 1.0.0
servers:
  - url: https://api.sozane-zarin.ir/v1
    description: سرور اصلی تولید
paths:
  /products:
    get:
      summary: دریافت لیست محصولات
      tags:
        - محصولات
      responses:
        '200':
          description: لیست محصولات با موفقیت دریافت شد
    post:
      summary: افزودن محصول جدید
      tags:
        - محصولات
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                price: {type: integer}
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    put:
      summary: به‌روزرسانی اطلاعات محصول
      tags:
        - محصولات
      responses:
        '200':
          description: محصول با موفقیت ویرایش شد
    delete:
      summary: حذف محصول از لیست
      tags:
        - محصولات
      responses:
        '204':
          description: محصول با موفقیت حذف شد
  /orders:
    post:
      summary: ثبت سفارش جدید
      tags:
        - سفارشات
      responses:
        '201':
          description: سفارش شما با موفقیت در سوزن زرین ثبت شد
components:
  schemas:
    Product:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        price: {type: integer}
        description: {type: string}