openapi: 3.0.0
info:
  title: API سرویس سوزن زرین
  description: مستندات رسمی برای مدیریت سفارشات و محصولات خیاطی و گلدوزی سوزن زرین
  version: 1.0.0
servers:
  - url: https://api.sozane-zarin.ir/v1
    description: سرور اصلی عملیاتی
paths:
  /products:
    get:
      summary: دریافت لیست محصولات
      description: بازگرداندن تمامی محصولات موجود در گالری سوزن زرین
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      summary: ثبت محصول جدید
      description: افزودن یک نمونه کار جدید به کاتالوگ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: محصول با موفقیت ثبت شد
  /orders/{id}:
    put:
      summary: به‌روزرسانی وضعیت سفارش
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [pending, sewing, completed, shipped]
      responses:
        '200':
          description: وضعیت سفارش تغییر کرد
    delete:
      summary: حذف سفارش
      description: لغو و حذف یک سفارش ثبت شده از سیستم
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: سفارش با موفقیت حذف شد
  /customers/profile:
    get:
      summary: مشاهده پروفایل مشتری
      description: دریافت اطلاعات کاربری و تاریخچه سفارشات مشتری
      responses:
        '200':
          description: اطلاعات پروفایل
components:
  schemas:
    Product:
      type: object
      required:
        - id
        - name
        - price
      properties:
        id:
          type: string
        name:
          type: string
          description: نام طرح یا محصول
        price:
          type: number
          description: قیمت به تومان
        category:
          type: string
          description: نوع دوخت (گلدوزی، خیاطی و غیره)