openapi: 3.0.0
info:
  title: API سرویس سوزن زرین
  description: مستندات رسمی برای مدیریت خدمات گلدوزی و خیاطی سوزن زرین
  version: 1.0.0
servers:
  - url: https://api.sozanezarin.com/v1
    description: سرور اصلی
paths:
  /orders:
    get:
      summary: دریافت لیست سفارش‌ها
      responses:
        '200':
          description: لیست سفارش‌ها با موفقیت دریافت شد
    post:
      summary: ثبت سفارش جدید
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '201':
          description: سفارش با موفقیت ثبت شد
  /orders/{orderId}:
    get:
      summary: دریافت جزئیات یک سفارش
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: جزئیات سفارش
    put:
      summary: به‌روزرسانی وضعیت سفارش
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: سفارش با موفقیت ویرایش شد
    delete:
      summary: حذف سفارش
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: سفارش با موفقیت حذف شد
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
        customerName:
          type: string
        serviceType:
          type: string
          description: نوع خدمات گلدوزی یا خیاطی
        price:
          type: number
        status:
          type: string
          enum: [pending, in_progress, completed]