openapi: 3.0.0
info:
  title: API سرویس سوزن زرین
  description: مستندات رسمی برای مدیریت خدمات خیاطی و سفارشات سوزن زرین
  version: 1.0.0
servers:
  - url: https://api.sozane-zarin.ir/v1
    description: سرور اصلی تولید
paths:
  /orders:
    get:
      summary: دریافت لیست سفارشات
      tags: [سفارشات]
      responses:
        '200':
          description: لیست سفارشات با موفقیت دریافت شد
    post:
      summary: ثبت سفارش جدید
      tags: [سفارشات]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_name: {type: string}
                service_type: {type: string}
      responses:
        '201':
          description: سفارش با موفقیت ثبت شد
  /orders/{id}:
    put:
      summary: ویرایش وضعیت سفارش
      tags: [سفارشات]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: سفارش بروزرسانی شد
    delete:
      summary: حذف سفارش
      tags: [سفارشات]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '204':
          description: سفارش حذف شد
  /services:
    get:
      summary: دریافت لیست خدمات موجود
      tags: [خدمات]
      responses:
        '200':
          description: لیست خدمات با موفقیت دریافت شد
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: integer}
                    name: {type: string}
                    price: {type: number}
components:
  schemas:
    Order:
      type: object
      properties:
        id: {type: string}
        status: {type: string}
        created_at: {type: string, format: date-time}