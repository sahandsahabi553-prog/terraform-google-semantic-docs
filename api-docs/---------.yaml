openapi: 3.0.0
info:
  title: API سرویس سوزن زرین
  description: مستندات رسمی برای مدیریت خدمات گلدوزی و خیاطی سوزن زرین
  version: 1.0.0
servers:
  - url: https://api.sozanezarin.com/v1
    description: سرور اصلی
paths:
  /orders:
    get:
      summary: دریافت لیست سفارشات
      responses:
        '200':
          description: لیست سفارشات با موفقیت دریافت شد
    post:
      summary: ثبت سفارش جدید
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_name:
                  type: string
                service_type:
                  type: string
      responses:
        '201':
          description: سفارش با موفقیت ثبت شد
  /orders/{id}:
    put:
      summary: به‌روزرسانی وضعیت سفارش
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: سفارش به‌روزرسانی شد
    delete:
      summary: حذف سفارش
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: سفارش حذف شد
  /products:
    get:
      summary: دریافت لیست نمونه کارهای سوزن زرین
      responses:
        '200':
          description: لیست محصولات با موفقیت دریافت شد
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, processing, completed]