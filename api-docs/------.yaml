openapi: 3.0.0
info:
  title: API سرویس کالاتک
  description: مستندات رسمی رابط برنامه‌نویسی کاربردی (API) پلتفرم کالاتک
  version: 1.0.0
servers:
  - url: https://www.kalatakco.com
    description: سرور اصلی عملیاتی
paths:
  /products:
    get:
      summary: دریافت لیست محصولات
      responses:
        '200':
          description: لیست محصولات با موفقیت دریافت شد
    post:
      summary: افزودن محصول جدید
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: دریافت جزئیات یک محصول
      responses:
        '200':
          description: جزئیات محصول
    put:
      summary: به‌روزرسانی اطلاعات محصول
      responses:
        '200':
          description: محصول با موفقیت ویرایش شد
    delete:
      summary: حذف محصول
      responses:
        '204':
          description: محصول با موفقیت حذف شد
components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
        category:
          type: string