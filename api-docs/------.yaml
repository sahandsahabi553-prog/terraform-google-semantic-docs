openapi: 3.0.0
info:
  title: مستندات API سرویس کالاتک
  description: رابط برنامه‌نویسی برای مدیریت موجودی و محصولات شرکت کالاتک
  version: 1.0.0
servers:
  - url: https://www.kalatakco.com
    description: سرور اصلی تولیدی

paths:
  /products:
    get:
      summary: دریافت لیست محصولات
      tags:
        - محصولات
      responses:
        '200':
          description: لیست محصولات با موفقیت دریافت شد
    post:
      summary: افزودن محصول جدید
      tags:
        - محصولات
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد

  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: دریافت جزئیات یک محصول
      tags:
        - محصولات
      responses:
        '200':
          description: جزئیات محصول
    put:
      summary: به‌روزرسانی اطلاعات محصول
      tags:
        - محصولات
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: محصول با موفقیت ویرایش شد
    delete:
      summary: حذف یک محصول
      tags:
        - محصولات
      responses:
        '204':
          description: محصول با موفقیت حذف شد

components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
          description: شناسه یکتای محصول
        name:
          type: string
          description: نام فارسی محصول
        price:
          type: number
          description: قیمت به تومان
        stock:
          type: integer
          description: موجودی انبار
      required:
        - name
        - price