openapi: 3.0.0
info:
  title: API سرویس کالاتک
  description: مستندات رسمی رابط برنامه‌نویسی اپلیکیشن کالاتک برای مدیریت محصولات و سفارشات.
  version: 1.0.0
servers:
  - url: https://kalatakco.com
    description: سرور اصلی کالاتک
paths:
  /products:
    get:
      summary: دریافت لیست محصولات
      tags: [Products]
      responses:
        '200':
          description: لیست محصولات با موفقیت دریافت شد.
    post:
      summary: افزودن محصول جدید
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                price: {type: number}
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد.
  /products/{id}:
    put:
      summary: به‌روزرسانی اطلاعات محصول
      tags: [Products]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: محصول با موفقیت آپدیت شد.
    delete:
      summary: حذف محصول
      tags: [Products]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '204':
          description: محصول حذف شد.
  /orders:
    get:
      summary: دریافت لیست سفارشات
      tags: [Orders]
      responses:
        '200':
          description: لیست سفارشات دریافت شد.
components:
  schemas:
    Product:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        price: {type: number}
    Order:
      type: object
      properties:
        orderId: {type: string}
        totalAmount: {type: number}