openapi: 3.0.0
info:
  title: API سرویس کالاتک
  description: مستندات رسمی API برای مدیریت محصولات و سفارشات در سامانه کالاتک
  version: 1.0.0
servers:
  - url: https://www.kalatakco.com
    description: سرور اصلی کالاتک
paths:
  /products:
    get:
      summary: دریافت لیست محصولات
      tags:
        - محصولات
      responses:
        '200':
          description: لیست محصولات با موفقیت دریافت شد
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      summary: ثبت محصول جدید
      tags:
        - محصولات
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: ویرایش اطلاعات محصول
      tags:
        - محصولات
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: محصول با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف محصول
      tags:
        - محصولات
      responses:
        '204':
          description: محصول با موفقیت حذف شد
  /orders:
    post:
      summary: ثبت سفارش جدید
      tags:
        - سفارشات
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: string
                quantity:
                  type: integer
      responses:
        '201':
          description: سفارش ثبت شد
components:
  schemas:
    Product:
      type: object
      required:
        - id
        - name
        - price
      properties:
        id:
          type: string
          description: شناسه منحصر‌به‌فرد کالا
        name:
          type: string
          description: نام محصول
        price:
          type: number
          description: قیمت کالا به تومان
        stock:
          type: integer
          description: موجودی انبار