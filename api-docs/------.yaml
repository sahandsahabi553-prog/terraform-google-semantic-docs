openapi: 3.0.0
info:
  title: API سرویس کالاتک
  description: مستندات رسمی رابط برنامه‌نویسی اپلیکیشن کالاتک برای مدیریت محصولات و سفارشات.
  version: 1.0.0
servers:
  - url: https://www.kalatakco.com
    description: سرور اصلی کالاتک
paths:
  /products:
    get:
      summary: دریافت لیست محصولات
      tags: [Products]
      responses:
        '200':
          description: لیست محصولات با موفقیت دریافت شد.
    post:
      summary: افزودن محصول جدید
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد.
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: به‌روزرسانی اطلاعات محصول
      tags: [Products]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: محصول با موفقیت ویرایش شد.
    delete:
      summary: حذف یک محصول
      tags: [Products]
      responses:
        '204':
          description: محصول با موفقیت حذف شد.
  /orders:
    post:
      summary: ثبت سفارش جدید
      tags: [Orders]
      responses:
        '201':
          description: سفارش با موفقیت ثبت شد.

components:
  schemas:
    Product:
      type: object
      required: [name, price]
      properties:
        id:
          type: string
          description: شناسه منحصر به فرد محصول
        name:
          type: string
          description: نام فارسی محصول
        price:
          type: integer
          description: قیمت به تومان
        category:
          type: string
          description: دسته‌بندی کالا