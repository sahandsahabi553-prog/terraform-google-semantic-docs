openapi: 3.0.0
info:
  title: API سرویس کالاتک
  description: مستندات رسمی رابط برنامه‌نویسی کاربردی کالاتک برای مدیریت محصولات و سفارشات
  version: 1.0.0
servers:
  - url: https://www.kalatakco.com
    description: سرور اصلی کالاتک
paths:
  /products:
    get:
      summary: دریافت لیست محصولات
      responses:
        '200':
          description: لیست محصولات با موفقیت دریافت شد
    post:
      summary: افزودن محصول جدید
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: ویرایش اطلاعات محصول
      responses:
        '200':
          description: محصول با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف محصول از لیست
      responses:
        '204':
          description: محصول با موفقیت حذف شد
  /orders:
    post:
      summary: ثبت سفارش جدید
      responses:
        '201':
          description: سفارش شما با موفقیت ثبت شد
components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          description: نام محصول
        price:
          type: number
          description: قیمت به تومان
    Order:
      type: object
      properties:
        product_id:
          type: string
        quantity:
          type: integer