openapi: 3.0.0
info:
  title: API سرویس کالاتک
  description: مستندات رسمی API برای مدیریت محصولات و سفارشات در سامانه کالاتک
  version: 1.0.0
servers:
  - url: https://www.kalatakco.com
    description: سرور اصلی کالاتک
paths:
  /products:
    get:
      summary: دریافت لیست محصولات
      tags:
        - محصولات
      responses:
        '200':
          description: لیست محصولات با موفقیت دریافت شد
    post:
      summary: افزودن محصول جدید
      tags:
        - محصولات
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: ویرایش اطلاعات محصول
      tags:
        - محصولات
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: محصول با موفقیت ویرایش شد
    delete:
      summary: حذف محصول
      tags:
        - محصولات
      responses:
        '204':
          description: محصول با موفقیت حذف شد
  /orders:
    post:
      summary: ثبت سفارش جدید
      tags:
        - سفارشات
      responses:
        '201':
          description: سفارش با موفقیت ثبت شد
components:
  schemas:
    Product:
      type: object
      properties:
        name:
          type: string
          description: نام محصول
        price:
          type: number
          description: قیمت به تومان
        category:
          type: string
          description: دسته‌بندی محصول
      required:
        - name
        - price