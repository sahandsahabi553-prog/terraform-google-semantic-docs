openapi: 3.0.0
info:
  title: API سرویس کالاتک
  description: مستندات رسمی سرویس کالاتک برای مدیریت محصولات و موجودی کالا
  version: 1.0.0
servers:
  - url: https://www.kalatakco.com
    description: سرور اصلی کالاتک
paths:
  /products:
    get:
      summary: دریافت لیست محصولات
      description: بازگرداندن لیستی از تمام محصولات موجود در کالاتک
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      summary: افزودن محصول جدید
      description: ایجاد یک محصول جدید در سیستم کالاتک
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: دریافت جزئیات محصول
      description: بازگرداندن اطلاعات یک محصول خاص بر اساس شناسه
      responses:
        '200':
          description: محصول یافت شد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
    put:
      summary: به‌روزرسانی محصول
      description: ویرایش اطلاعات یک محصول موجود
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: محصول با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف محصول
      description: حذف یک محصول از دیتابیس کالاتک
      responses:
        '204':
          description: محصول با موفقیت حذف شد
components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
        stock:
          type: integer
    ProductInput:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
        price:
          type: number
        stock:
          type: integer