openapi: 3.0.0
info:
  title: API سرویس کالاتک
  description: مستندات رسمی رابط برنامه‌نویسی کاربردی کالاتک برای مدیریت محصولات و سفارشات.
  version: 1.0.0
servers:
  - url: https://www.kalatakco.com
    description: سرور اصلی کالاتک
paths:
  /products:
    get:
      summary: لیست محصولات
      description: دریافت لیست تمامی محصولات موجود در انبار کالاتک
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      summary: افزودن محصول جدید
      description: ثبت یک محصول جدید در سیستم کالاتک
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد
  /products/{id}:
    put:
      summary: به‌روزرسانی محصول
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: محصول با موفقیت ویرایش شد
    delete:
      summary: حذف محصول
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: محصول با موفقیت حذف شد
  /orders:
    post:
      summary: ثبت سفارش
      description: ایجاد یک سفارش جدید برای مشتری
      responses:
        '201':
          description: سفارش ثبت شد
components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
          description: شناسه یکتای محصول
        name:
          type: string
          description: نام فارسی محصول
        price:
          type: number
          description: قیمت به تومان
        stock:
          type: integer
          description: تعداد موجودی
      required:
        - name
        - price