openapi: 3.0.0
info:
  title: Ayatsaadati API
  description: API service for managing Quranic ayat and spiritual content.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: Production server
paths:
  /api/v1/ayats:
    get:
      summary: Retrieve a list of Ayats
      responses:
        '200':
          description: A list of Ayats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ayat'
    post:
      summary: Create a new Ayat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ayat'
      responses:
        '201':
          description: Ayat created successfully
  /api/v1/ayats/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a specific Ayat by ID
      responses:
        '200':
          description: Ayat details
    put:
      summary: Update an existing Ayat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ayat'
      responses:
        '200':
          description: Ayat updated
    delete:
      summary: Delete an Ayat
      responses:
        '204':
          description: Ayat deleted successfully

components:
  schemas:
    Ayat:
      type: object
      required:
        - surah
        - ayah_number
        - text
      properties:
        id:
          type: string
          readOnly: true
        surah:
          type: integer
        ayah_number:
          type: integer
        text:
          type: string
        translation:
          type: string
        category:
          type: string