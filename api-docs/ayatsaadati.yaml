openapi: 3.0.0
info:
  title: AyatSaadati API
  description: API service for managing spiritual reflections and verses.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: Production server
paths:
  /verses:
    get:
      summary: List all verses
      responses:
        '200':
          description: A list of verses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Verse'
    post:
      summary: Create a new verse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerseInput'
      responses:
        '201':
          description: Verse created
  /verses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Update an existing verse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerseInput'
      responses:
        '200':
          description: Verse updated
    delete:
      summary: Delete a verse
      responses:
        '204':
          description: Verse deleted
  /search:
    get:
      summary: Search verses by keyword
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Search results
components:
  schemas:
    Verse:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        reference:
          type: string
    VerseInput:
      type: object
      required:
        - content
      properties:
        content:
          type: string
        reference:
          type: string