openapi: 3.0.0
info:
  title: Ayatsaadati API
  description: API service for managing Quranic verses and spiritual reflections.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: Production server
paths:
  /verses:
    get:
      summary: Retrieve a list of verses
      responses:
        '200':
          description: A list of verses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Verse'
    post:
      summary: Create a new verse entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verse'
      responses:
        '201':
          description: Verse created successfully
  /verses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Update an existing verse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verse'
      responses:
        '200':
          description: Verse updated
    delete:
      summary: Remove a verse
      responses:
        '204':
          description: Verse deleted
  /daily-reflection:
    get:
      summary: Get the daily spiritual reflection
      responses:
        '200':
          description: Reflection retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  text:
                    type: string
components:
  schemas:
    Verse:
      type: object
      required:
        - id
        - surah
        - ayah
        - content
      properties:
        id:
          type: string
        surah:
          type: integer
        ayah:
          type: integer
        content:
          type: string
        translation:
          type: string