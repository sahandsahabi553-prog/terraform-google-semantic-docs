openapi: 3.0.0
info:
  title: AyatSaadati API
  description: API service for managing AyatSaadati content and user interactions.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: Production server
paths:
  /ayat:
    get:
      summary: Retrieve all Ayat
      responses:
        '200':
          description: A list of Ayat
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ayah'
    post:
      summary: Create a new Ayah
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AyahInput'
      responses:
        '201':
          description: Ayah created successfully
  /ayat/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Update an existing Ayah
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AyahInput'
      responses:
        '200':
          description: Ayah updated successfully
    delete:
      summary: Delete an Ayah
      responses:
        '204':
          description: Ayah deleted successfully
  /search:
    get:
      summary: Search Ayat by keyword
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Search results
components:
  schemas:
    Ayah:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        surah:
          type: string
        verseNumber:
          type: integer
    AyahInput:
      type: object
      required:
        - text
        - surah
      properties:
        text:
          type: string
        surah:
          type: string
        verseNumber:
          type: integer