openapi: 3.0.0
info:
  title: AyatSaadati API
  description: API service for managing Quranic verses and spiritual reflections.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: Production server
paths:
  /verses:
    get:
      summary: Retrieve a list of verses
      responses:
        '200':
          description: A list of verses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Verse'
    post:
      summary: Add a new verse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verse'
      responses:
        '201':
          description: Verse created successfully
  /verses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a specific verse
      responses:
        '200':
          description: Detailed verse information
    put:
      summary: Update an existing verse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verse'
      responses:
        '200':
          description: Verse updated successfully
    delete:
      summary: Remove a verse
      responses:
        '204':
          description: Verse deleted successfully
components:
  schemas:
    Verse:
      type: object
      required:
        - id
        - text
        - surah
      properties:
        id:
          type: string
        text:
          type: string
        surah:
          type: string
        verse_number:
          type: integer
        translation:
          type: string