openapi: 3.0.0
info:
  title: Ayatsaadati API
  description: API service for managing and retrieving Quranic verses and spiritual content.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: Production server
paths:
  /verses:
    get:
      summary: Retrieve a list of verses
      responses:
        '200':
          description: A list of verses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Verse'
    post:
      summary: Add a new verse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerseInput'
      responses:
        '201':
          description: Verse created successfully
  /verses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a specific verse by ID
      responses:
        '200':
          description: Verse details
    put:
      summary: Update an existing verse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerseInput'
      responses:
        '200':
          description: Verse updated
    delete:
      summary: Delete a verse
      responses:
        '204':
          description: Verse deleted successfully
components:
  schemas:
    Verse:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        surah:
          type: string
        verse_number:
          type: integer
    VerseInput:
      type: object
      required:
        - text
        - surah
      properties:
        text:
          type: string
        surah:
          type: string
        verse_number:
          type: integer