openapi: 3.0.0
info:
  title: AyatSaadati API
  description: API service for managing spiritual verses and daily reflections.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: Production Server
paths:
  /verses:
    get:
      summary: Retrieve a list of verses
      responses:
        '200':
          description: A list of verses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Verse'
    post:
      summary: Create a new verse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verse'
      responses:
        '201':
          description: Verse created successfully
  /verses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Update an existing verse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verse'
      responses:
        '200':
          description: Verse updated
    delete:
      summary: Delete a verse
      responses:
        '204':
          description: Verse deleted
  /daily-reflection:
    get:
      summary: Get today's featured verse
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verse'
components:
  schemas:
    Verse:
      type: object
      required:
        - id
        - content
        - source
      properties:
        id:
          type: string
        content:
          type: string
        source:
          type: string
        category:
          type: string