openapi: 3.0.0
info:
  title: AyatSaadati API
  description: API service for managing Quranic verses and reflective content.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: Production server
paths:
  /verses:
    get:
      summary: Get all verses
      responses:
        '200':
          description: A list of verses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Verse'
    post:
      summary: Add a new verse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerseInput'
      responses:
        '201':
          description: Verse created successfully
  /verses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Update an existing verse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerseInput'
      responses:
        '200':
          description: Verse updated
    delete:
      summary: Delete a verse
      responses:
        '204':
          description: Verse deleted
  /stats:
    get:
      summary: Get service statistics
      responses:
        '200':
          description: Usage statistics returned
components:
  schemas:
    Verse:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        surah:
          type: integer
        ayah:
          type: integer
    VerseInput:
      type: object
      required:
        - text
        - surah
      properties:
        text:
          type: string
        surah:
          type: integer
        ayah:
          type: integer