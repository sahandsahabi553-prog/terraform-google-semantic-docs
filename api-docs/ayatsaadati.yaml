openapi: 3.0.0
info:
  title: AyatSaadati API
  description: API service for managing Quranic verses and spiritual content.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: Production server
paths:
  /verses:
    get:
      summary: Get all verses
      responses:
        '200':
          description: A list of verses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Verse'
    post:
      summary: Add a new verse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verse'
      responses:
        '201':
          description: Verse created
  /verses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a specific verse
      responses:
        '200':
          description: Verse details
        '404':
          description: Verse not found
    put:
      summary: Update an existing verse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verse'
      responses:
        '200':
          description: Verse updated
    delete:
      summary: Delete a verse
      responses:
        '204':
          description: Verse deleted
components:
  schemas:
    Verse:
      type: object
      required:
        - surah_number
        - ayah_number
        - text
      properties:
        id:
          type: string
          readOnly: true
        surah_number:
          type: integer
        ayah_number:
          type: integer
        text:
          type: string
        translation:
          type: string