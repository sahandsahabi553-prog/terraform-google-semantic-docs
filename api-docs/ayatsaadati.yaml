openapi: 3.0.0
info:
  title: Ayat Saadati API
  description: API service for managing Quranic verses and spiritual reflections.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: Production server
paths:
  /verses:
    get:
      summary: Get list of verses
      responses:
        '200':
          description: A list of verses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Verse'
    post:
      summary: Create a new verse entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verse'
      responses:
        '201':
          description: Verse created
  /verses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a specific verse
      responses:
        '200':
          description: Verse details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verse'
    put:
      summary: Update an existing verse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verse'
      responses:
        '200':
          description: Verse updated
    delete:
      summary: Delete a verse
      responses:
        '204':
          description: Verse deleted
components:
  schemas:
    Verse:
      type: object
      required:
        - id
        - surah_name
        - ayah_number
        - content
      properties:
        id:
          type: string
        surah_name:
          type: string
        ayah_number:
          type: integer
        content:
          type: string
        reflection:
          type: string