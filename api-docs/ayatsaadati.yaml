openapi: 3.0.0
info:
  title: Ayatsaadati API
  description: API service for managing and retrieving Quranic verses and spiritual content.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: Production server
paths:
  /verses:
    get:
      summary: Get list of verses
      responses:
        '200':
          description: A list of verses
    post:
      summary: Create a new verse entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verse'
      responses:
        '201':
          description: Verse created successfully
  /verses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a specific verse by ID
      responses:
        '200':
          description: Detailed verse information
    put:
      summary: Update an existing verse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verse'
      responses:
        '200':
          description: Verse updated successfully
    delete:
      summary: Delete a verse
      responses:
        '204':
          description: Verse deleted successfully
components:
  schemas:
    Verse:
      type: object
      required:
        - surah_number
        - ayah_number
        - text
      properties:
        id:
          type: string
          readOnly: true
        surah_number:
          type: integer
        ayah_number:
          type: integer
        text:
          type: string
        translation:
          type: string