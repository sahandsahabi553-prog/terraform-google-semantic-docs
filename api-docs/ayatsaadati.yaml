openapi: 3.0.0
info:
  title: AyatSaadati API
  description: API service for managing spiritual verses and daily reflections.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: Production Server
paths:
  /verses:
    get:
      summary: Retrieve a list of verses
      responses:
        '200':
          description: A list of verses
    post:
      summary: Add a new verse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verse'
      responses:
        '201':
          description: Verse created successfully
  /verses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a single verse by ID
      responses:
        '200':
          description: Requested verse details
    put:
      summary: Update an existing verse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verse'
      responses:
        '200':
          description: Verse updated successfully
    delete:
      summary: Delete a verse
      responses:
        '204':
          description: Verse deleted successfully
components:
  schemas:
    Verse:
      type: object
      required:
        - content
        - source
      properties:
        id:
          type: string
          readOnly: true
        content:
          type: string
        source:
          type: string
        category:
          type: string