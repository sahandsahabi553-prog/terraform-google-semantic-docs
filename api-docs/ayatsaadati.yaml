openapi: 3.0.0
info:
  title: AyatSaadati API
  description: API service for managing Quranic verses and spiritual reflections.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: Production server
paths:
  /verses:
    get:
      summary: Get all verses
      responses:
        '200':
          description: A list of verses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Verse'
    post:
      summary: Add a new verse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verse'
      responses:
        '201':
          description: Created
  /verses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a specific verse
      responses:
        '200':
          description: Verse details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verse'
    put:
      summary: Update a verse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verse'
      responses:
        '200':
          description: Updated successfully
    delete:
      summary: Delete a verse
      responses:
        '204':
          description: Deleted successfully
components:
  schemas:
    Verse:
      type: object
      properties:
        id:
          type: string
        surah:
          type: integer
        ayah:
          type: integer
        text:
          type: string
        reflection:
          type: string