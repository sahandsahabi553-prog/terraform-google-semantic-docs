openapi: 3.0.0
info:
  title: AyatSaadati API
  description: API service for managing spiritual verses and reflections.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: Production server
paths:
  /verses:
    get:
      summary: Retrieve a list of verses
      responses:
        '200':
          description: A list of verses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Verse'
    post:
      summary: Create a new verse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerseInput'
      responses:
        '201':
          description: Verse created successfully
  /verses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Update an existing verse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerseInput'
      responses:
        '200':
          description: Verse updated successfully
    delete:
      summary: Delete a verse
      responses:
        '204':
          description: Verse deleted successfully
  /daily:
    get:
      summary: Get the verse of the day
      responses:
        '200':
          description: The daily verse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verse'
components:
  schemas:
    Verse:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        reference:
          type: string
        created_at:
          type: string
          format: date-time
    VerseInput:
      type: object
      required:
        - content
        - reference
      properties:
        content:
          type: string
        reference:
          type: string