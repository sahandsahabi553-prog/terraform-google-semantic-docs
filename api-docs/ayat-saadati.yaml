```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati Service API
  description: |
    This API provides access to content and management features related to Ayat Saadati's platform.
    It allows users to retrieve, create, update, and delete various resources such as posts and comments.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Development server for Ayat Saadati's platform
paths:
  /posts:
    get:
      summary: Retrieve a list of all posts
      operationId: getAllPosts
      tags:
        - Posts
      parameters:
        - name: limit
          in: query
          description: Maximum number of posts to return
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 10
        - name: offset
          in: query
          description: Number of posts to skip before starting to collect the result set
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: A list of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '500':
          description: Internal server error
    post:
      summary: Create a new post
      operationId: createPost
      tags:
        - Posts
      requestBody:
        description: Post object to be created
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreate'
      responses:
        '201':
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Invalid input
        '500':
          description: Internal server error

  /posts/{postId}:
    get:
      summary: Retrieve a specific post by ID
      operationId: getPostById
      tags:
        - Posts
      parameters:
        - name: postId
          in: path
          description: ID of the post to retrieve
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Post details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Post not found
        '500':
          description: Internal server error
    put:
      summary: Update an existing post
      operationId: updatePost
      tags:
        - Posts
      parameters:
        - name: postId
          in: path
          description: ID of the post to update
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Post object with updated fields
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostUpdate'
      responses:
        '200':
          description: Post updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Invalid input
        '404':
          description: Post not found
        '500':
          description: Internal server error
    delete:
      summary: Delete a specific post
      operationId: deletePost
      tags:
        - Posts
      parameters:
        - name: postId
          in: path
          description: ID of the post to delete
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Post deleted successfully
        '404':
          description: Post not found
        '500':
          description: Internal server error

  /posts/{postId}/comments:
    get:
      summary: Retrieve comments for a specific post
      operationId: getCommentsForPost
      tags:
        - Comments
      parameters:
        - name: postId
          in: path
          description: ID of the post to retrieve comments for
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Maximum number of comments to return
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 10
      responses:
        '200':
          description: A list of comments for the specified post
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '404':
          description: Post not found
        '500':
          description: Internal server error
    post:
      summary: Add a new comment to a specific post
      operationId: addCommentToPost
      tags:
        - Comments
      parameters:
        - name: postId
          in: path
          description: ID of the post to add a comment to
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Comment object to be added
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreate'
      responses:
        '201':
          description: Comment added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: Invalid input
        '404':
          description: Post not found
        '500':
          description: Internal server error

components:
  schemas:
    Post:
      type: object
      required:
        - id
        - title
        - content
        - authorId
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the post
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        title:
          type: string
          description: Title of the post
          example: My First Blog Post
        content:
          type: string
          description: Full content of the post
          example: This is the detailed content of my very first blog post on Ayat Saadati's platform.
        authorId:
          type: string
          format: uuid
          description: ID of the user who authored the post
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        tags:
          type: array
          items:
            type: string
          description: List of tags associated with the post
          example: ["programming", "devto", "thoughts"]
        createdAt:
          type: string
          format: date-time
          description: Date and time when the post was created
          example: '2023-10-26T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Date and time when the post was last updated
          example: '2023-10-26T11:30:00Z'
    PostCreate:
      type: object
      required:
        - title
        - content
        - authorId
      properties:
        title:
          type: string
          description: Title of the post
          example: My New Blog Post Idea
        content:
          type: string
          description: Full content of the post
          example: This is the draft content for an upcoming blog post.
        authorId:
          type: string
          format: uuid
          description: ID of the user who is creating the post
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        tags:
          type: array
          items:
            type: string
          description: List of tags to associate with the post
          example: ["draft", "ideas"]
    PostUpdate:
      type: object
      properties:
        title:
          type: string
          description: Updated title of the post
          example: My Updated Blog Post Title
        content:
          type: string
          description: Updated full content of the post
          example: The revised and improved content for the blog post.
        tags:
          type: array
          items:
            type: string
          description: Updated list of tags associated with the post
          example: ["programming", "devto", "updated"]
    Comment:
      type: object
      required:
        - id
        - postId
        - authorId
        - content
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the comment
          example: e3a1b2c3-d4e5-f678-9012-34567890abcd
        postId:
          type: string
          format: uuid
          description: ID of the post this comment belongs to
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        authorId:
          type: string
          format: uuid
          description: ID of the user who made the comment
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        content:
          type: string
          description: The actual comment text
          example: Great post, very insightful!
        createdAt:
          type: string
          format: date-time
          description: Date and time when the comment was created
          example: '2023-10-26T12:05:00Z'
    CommentCreate:
      type: object
      required:
        - authorId
        - content
      properties:
        authorId:
          type: string
          format: uuid
          description: ID of the user making the comment
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        content:
          type: string
          description: The comment text
          example: I totally agree with your points!

```