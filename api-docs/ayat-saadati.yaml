```yml
openapi: 3.0.0
info:
  title: Ayat Saadati Service
  description: API documentation for Ayat Saadati service
  version: 1.0.0
  contact:
    name: Ayat Saadati
    url: https://dev.to/ayat_saadat
    email: ayat.saadat@example.com
servers:
  - url: https://dev.to/ayat_saadat
tags:
  - name: users
    description: User management endpoints
  - name: posts
    description: Post management endpoints
paths:
  /users:
    get:
      tags:
        - users
      summary: Retrieves a list of all users
      description: Returns a list of all registered users
      operationId: getUsers
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - users
      summary: Creates a new user
      description: Creates a new user with the provided details
      operationId: createUser
      requestBody:
        description: User details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/{userId}:
    get:
      tags:
        - users
      summary: Retrieves a user by ID
      description: Returns a user with the specified ID
      operationId: getUserById
      parameters:
        - in: path
          name: userId
          schema:
            type: integer
          required: true
          description: User ID
      responses:
        '200':
          description: A user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - users
      summary: Updates a user
      description: Updates a user with the provided details
      operationId: updateUser
      parameters:
        - in: path
          name: userId
          schema:
            type: integer
          required: true
          description: User ID
      requestBody:
        description: User details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - users
      summary: Deletes a user
      description: Deletes a user with the specified ID
      operationId: deleteUser
      parameters:
        - in: path
          name: userId
          schema:
            type: integer
          required: true
          description: User ID
      responses:
        '204':
          description: User deleted successfully
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /posts:
    get:
      tags:
        - posts
      summary: Retrieves a list of all posts
      description: Returns a list of all published posts
      operationId: getPosts
      responses:
        '200':
          description: A list of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - posts
      summary: Creates a new post
      description: Creates a new post with the provided details
      operationId: createPost
      requestBody:
        description: Post details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Post'
        required: true
      responses:
        '201':
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /posts/{postId}:
    get:
      tags:
        - posts
      summary: Retrieves a post by ID
      description: Returns a post with the specified ID
      operationId: getPostById
      parameters:
        - in: path
          name: postId
          schema:
            type: integer
          required: true
          description: Post ID
      responses:
        '200':
          description: A post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          description: User ID
        name:
          type: string
          description: User name
        email:
          type: string
          format: email
          description: User email
      required:
        - id
        - name
        - email
    Post:
      type: object
      properties:
        id:
          type: integer
          description: Post ID
        title:
          type: string
          description: Post title
        content:
          type: string
          description: Post content
      required:
        - id
        - title
        - content
    Error:
      type: object
      properties:
        code:
          type: integer
          description: Error code
        message:
          type: string
          description: Error message
      required:
        - code
        - message
```