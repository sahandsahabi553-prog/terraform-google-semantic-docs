```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati Article Service API
  description: |
    Welcome to the Ayat Saadati Article Service API. This API allows developers to interact with Ayat Saadati's blog content,
    including retrieving, creating, updating, and deleting articles.
    
    Explore the documentation below to understand how to integrate with the service and manage blog posts programmatically.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Ayat Saadati's official blog platform
paths:
  /articles:
    get:
      summary: Retrieve a list of articles
      operationId: getArticles
      parameters:
        - name: limit
          in: query
          description: How many items to return at one time (max 100)
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: Offset for pagination, useful for skipping first N articles
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
      responses:
        '200':
          description: A paginated list of articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
        '500':
          description: Internal server error
    post:
      summary: Create a new article
      operationId: createArticle
      requestBody:
        description: Article object that needs to be added to the collection
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewArticle'
      responses:
        '201':
          description: Article created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input provided (e.g., missing required fields)
        '500':
          description: Internal server error
  /articles/{articleId}:
    parameters:
      - name: articleId
        in: path
        description: Unique identifier of the article to retrieve or manipulate
        required: true
        schema:
          type: string
          format: uuid
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
    get:
      summary: Find article by ID
      operationId: getArticleById
      responses:
        '200':
          description: Successful operation, returns the article object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          description: Article not found
        '500':
          description: Internal server error
    put:
      summary: Update an existing article
      operationId: updateArticle
      requestBody:
        description: Article object with updated fields. Only provided fields will be updated.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewArticle'
      responses:
        '200':
          description: Article updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid ID supplied or invalid input in request body
        '404':
          description: Article not found
        '500':
          description: Internal server error
    delete:
      summary: Deletes an article
      operationId: deleteArticle
      responses:
        '204':
          description: Article deleted successfully, no content
        '404':
          description: Article not found
        '500':
          description: Internal server error
components:
  schemas:
    Article:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier for the article.
          readOnly: true
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        title:
          type: string
          description: The title of the article.
          example: Unlocking the Power of OpenAPI 3.0
        content:
          type: string
          description: The full content of the article, usually in Markdown or HTML.
          example: This article explores the benefits and features of OpenAPI 3.0...
        author:
          type: string
          description: The author of the article.
          example: Ayat Saadati
        tags:
          type: array
          description: A list of tags or categories associated with the article.
          items:
            type: string
          example: ["OpenAPI", "API Documentation", "Software Design"]
        createdAt:
          type: string
          format: date-time
          description: The timestamp when the article was first created.
          readOnly: true
          example: 2023-10-27T10:00:00Z
        updatedAt:
          type: string
          format: date-time
          description: The timestamp when the article was last updated.
          readOnly: true
          example: 2023-10-27T11:30:00Z
      required:
        - id
        - title
        - content
        - author
        - createdAt
    NewArticle:
      type: object
      properties:
        title:
          type: string
          description: The title for the new article.
          example: My Journey into Cloud Native Development
        content:
          type: string
          description: The main body content of the article.
          example: In this article, I share my personal experiences and insights...
        author:
          type: string
          description: The author of the article.
          example: Ayat Saadati
        tags:
          type: array
          description: A list of tags to categorize the article.
          items:
            type: string
          example: ["Cloud", "Kubernetes", "DevOps"]
      required:
        - title
        - content
        - author
```