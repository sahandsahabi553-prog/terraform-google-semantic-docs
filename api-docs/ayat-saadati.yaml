```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati Content Platform API
  version: 1.0.0
  description: |
    Welcome to the Ayat Saadati Content Platform API documentation.
    This API provides a robust set of endpoints for managing articles and their associated comments,
    allowing users to create, retrieve, update, and delete content seamlessly.

    The platform aims to provide a reliable and easy-to-use interface for content creators and consumers.
  contact:
    name: Ayat Saadati Support
    url: https://dev.to/ayat_saadat
    email: support@ayatsaadati.com
servers:
  - url: https://dev.to/ayat_saadat
    description: Production server for the Ayat Saadati service
paths:
  /articles:
    get:
      summary: Retrieve a list of articles
      description: |
        Returns a list of all articles available on the platform.
        Results can be filtered by tags or author ID to find specific content.
      operationId: getArticles
      tags:
        - Articles
      parameters:
        - in: query
          name: tags
          schema:
            type: array
            items:
              type: string
          description: List of tags to filter articles by (e.g., `?tags=programming,webdev`)
          example: ['programming', 'api-design']
          style: form
          explode: false
        - in: query
          name: authorId
          schema:
            type: string
            format: uuid
          description: ID of the author to filter articles by
          example: "f1e2d3c4-b5a6-9876-5432-10fedcba9876"
      responses: