```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati Article Management API
  description: |
    This API provides endpoints for managing articles, inspired by the dev.to platform.
    Users can create, retrieve, update, and delete articles, and browse through a collection
    of posts.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Development server for Ayat Saadati's article platform
tags:
  - name: Articles
    description: Operations related to managing articles and posts.
paths:
  /articles:
    get:
      summary: Retrieve a list of articles
      description: Fetches all published articles, with optional filtering by author or tag.
      operationId: getAllArticles
      tags:
        - Articles
      parameters:
        - in: query
          name: author
          schema:
            type: string
          description: Filter articles by the author's username.
          required: false
          example: ayat_saadat
        - in: query
          name: tag
          schema:
            type: string
          description: Filter articles by a specific tag.
          required: false
          example: webdev
      responses:
        '200':
          description: A list of articles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new article
      description: Submits a new article to be published on the platform.
      operationId: createArticle
      tags:
        - Articles
      requestBody:
        description: Article object that needs to be created.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewArticle'
      responses:
        '201':
          description: Article created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input provided for article creation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /articles/{articleId}:
    get:
      summary: Get an article by ID
      description: Retrieves a single article based on its unique identifier.
      operationId: getArticleById
      tags:
        - Articles
      parameters:
        - in: path
          name: articleId
          schema:
            type: string
            format: uuid
          required: true
          description: Unique identifier of the article to retrieve.
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
      responses:
        '200':
          description: Article details retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          description: Article not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update an existing article
      description: Updates the details of an existing article identified by its ID.
      operationId: updateArticle
      tags:
        - Articles
      parameters:
        - in: path
          name: articleId
          schema:
            type: string
            format: uuid
          required: true
          description: Unique identifier of the article to update.
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
      requestBody:
        description: Article object with updated fields.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewArticle'
      responses:
        '200':
          description: Article updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input or missing fields for update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Article not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete an article
      description: Deletes an article permanently from the platform using its unique ID.
      operationId: deleteArticle
      tags:
        - Articles
      parameters:
        - in: path
          name: articleId
          schema:
            type: string
            format: uuid
          required: true
          description: Unique identifier of the article to delete.
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
      responses:
        '204':
          description: Article deleted successfully, no content to return.
        '404':
          description: Article not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Article:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the article.
          readOnly: true
          example: d290f1ee