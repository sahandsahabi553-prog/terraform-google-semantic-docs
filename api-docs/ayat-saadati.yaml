```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati Service API
  description: |
    Welcome to the Ayat Saadati Service API documentation. This API provides programmatic access to manage articles, users, and other content related to Ayat Saadati's platform.
    
    You can use this API to create, read, update, and delete articles, manage user profiles, and interact with various content features.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Production server
paths:
  /articles:
    get:
      summary: Retrieve a list of articles
      operationId: getArticles
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
          description: Maximum number of articles to return
          example: 10
        - in: query
          name: offset
          schema:
            type: integer
            format: int32
            minimum: 0
          description: Number of articles to skip for pagination
          example: 0
        - in: query
          name: category
          schema:
            type: string
          description: Filter articles by category
          example: programming
      responses:
        '200':
          description: A list of articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new article
      operationId: createArticle
      requestBody:
        description: Article object to be created
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewArticle'
      responses:
        '201':
          description: Article created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /articles/{articleId}:
    get:
      summary: Retrieve a single article by ID
      operationId: getArticleById
      parameters:
        - in: path
          name: articleId
          schema:
            type: string
            format: uuid
          required: true
          description: ID of the article to retrieve
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
      responses:
        '200':
          description: Article details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update an existing article
      operationId: updateArticle
      parameters:
        - in: path
          name: articleId
          schema:
            type: string
            format: uuid
          required: true
          description: ID of the article to update
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
      requestBody:
        description: Article object with updated fields
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArticle'
      responses:
        '200':
          description: Article updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden (user does not own the article)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete an article
      operationId: deleteArticle
      parameters:
        - in: path
          name: articleId
          schema:
            type: string
            format: uuid
          required: true
          description: ID of the article to delete
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
      responses:
        '204':
          description: Article deleted successfully (No Content)
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden (user does not own the article)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Article:
      type: object
      required:
        - id
        - title
        - content
        - authorId
        - category
        - publishedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the article
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        title:
          type: string
          description: Title of the article
          example: My First Article on OpenAPI
        content:
          type: string
          description: Full content of the article (can be markdown)
          example: This is the detailed content of my first article. It explains how to use OpenAPI.
        authorId:
          type: string
          format: uuid
          description: ID of the author who wrote the article
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        category:
          type: string
          description: Category of the article
          example: technology
        tags:
          type: array
          items:
            type: string
          description: List of tags associated with the article
          example: [openapi, yaml, documentation]
        publishedAt:
          type: string
          format: date-time
          description: Timestamp when the article was published
          example: 2023-10-26T10:00:00Z
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the article was last updated
          example: 2023-10-26T10:30:00Z
        isPublished:
          type: boolean
          description: Indicates if the article is published or a draft
          default: true
          example: true
    NewArticle:
      type: object
      required:
        - title
        - content
        - authorId
        - category
      properties:
        title:
          type: string
          description: Title of the new article
          example: Getting Started with Ayat Saadati API
        content:
          type: string
          description: Full content of the new article (can be markdown)
          example: This article will guide you through the process of integrating with the Ayat Saadati API.
        authorId:
          type: string
          format: uuid
          description: ID of the author creating the article
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        category:
          type: string
          description: Category for the new article
          example: api-integration
        tags:
          type: array
          items:
            type: string
          description: Optional list of tags for the article
          example: [tutorial, api, getting-started]
        isPublished:
          type: boolean
          description: Whether the article should be published immediately or saved as draft
          default: true
          example: true
    UpdateArticle:
      type: object
      properties:
        title:
          type: string
          description: Updated title of the article
          example: Mastering the Ayat Saadati API
        content:
          type: string
          description: Updated full content of the article (can be markdown)
          example: This revised article provides advanced techniques for integrating with the Ayat Saadati API.
        category:
          type: string
          description: Updated category of the article
          example: advanced-topics
        tags:
          type: array
          items:
            type: string
          description: Updated list of tags associated with the article
          example: [advanced, api, best-practices]
        isPublished:
          type: boolean
          description: Update article's published status
          example: false
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: Error code
          example: 400
        message:
          type: string
          description: A human-readable description of the error
          example: Invalid input provided.
```