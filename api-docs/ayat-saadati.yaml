```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati Content API
  description: |
    Welcome to the professional API documentation for the Ayat Saadati service.
    This API provides a comprehensive set of endpoints to manage articles and
    related content, including creation, retrieval, updates, and deletion.
    It's designed to be intuitive and robust, supporting various operations
    for a content-driven platform, similar to a personal blog or tech articles.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Production server for Ayat Saadati content
paths:
  /articles:
    get:
      summary: Retrieve a list of articles
      description: Returns a list of all articles available on the Ayat Saadati platform.
      operationId: getArticles
      parameters:
        - name: limit
          in: query
          description: How many articles to return at one time (max 100)
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: The number of items to skip before starting to collect the result set
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
      responses:
        '200':
          description: A successful response returning a list of articles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
        '400':
          description: Invalid parameters supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new article
      description: Creates a brand new article on the Ayat Saadati platform.
      operationId: createArticle
      requestBody:
        description: Article object that needs to be added to the store
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewArticle'
      responses:
        '201':
          description: Article created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict, an article with the same title already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /articles/{articleId}:
    get:
      summary: Retrieve a single article by ID
      description: Returns a single article based on its unique identifier.
      operationId: getArticleById
      parameters:
        - name: articleId
          in: path
          description: ID of the article to retrieve
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A successful response returning the article.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          description: Article not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid ID supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update an existing article
      description: Updates an existing article's details on the platform.
      operationId: updateArticle
      parameters:
        - name: articleId
          in: path
          description: ID of the article to update
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Article object with updated fields
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewArticle' # Re-using for fields that can be updated
      responses:
        '200':
          description: Article updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid ID or request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Article not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete an article
      description: Deletes a specific article from the Ayat Saadati platform by its ID.
      operationId: deleteArticle
      parameters:
        - name: articleId
          in: path
          description: ID of the article to delete
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Article deleted successfully. No content to return.
        '400':
          description: Invalid ID supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Article not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Article:
      type: object
      required:
        - id
        - title
        - content
        - author
        - publishedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the article.
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        title:
          type: string
          description: The title of the article.
          example: My First Professional API Documentation
        content:
          type: string
          description: The main body content of the article (can be Markdown or HTML).
          example: "# Introduction\nThis is a sample article content..."
        author:
          type: string
          description: The author of the article.
          example: Ayat Saadati
        tags:
          type: array
          items:
            type: string
          description: A list of tags or categories associated with the article.
          example: ["API", "OpenAPI", "Documentation"]
        publishedAt:
          type: string
          format: date-time
          description: The date and time when the article was published.
          example: '2023-10-27T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: The date and time when the article was last updated.
          example: '2023-10-27T11:30:00Z'
        status:
          type: string
          enum: [draft, published, archived]
          default: draft
          description: The publication status of the article.
          example: published
    NewArticle:
      type: object
      required:
        - title
        - content
        - author
      properties:
        title:
          type: string
          description: The title of the article.
          example: Building Robust Microservices
        content:
          type: string
          description: The main body content of the article.
          example: "Microservices architecture patterns..."
        author:
          type: string
          description: The author of the article.
          example: Ayat Saadati
        tags:
          type: array
          items:
            type: string
          description: A list of tags for the article.
          example: ["Microservices", "Architecture", "Cloud"]
        status:
          type: string
          enum: [draft, published]
          default: draft
          description: The publication status of the article.
          example: draft
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: A unique error code.
          example: 400
        message:
          type: string
          description: A human-readable description of the error.
          example: Invalid Article ID supplied.
```