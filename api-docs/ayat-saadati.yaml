openapi: 3.0.0
info:
  title: Ayat Saadati Service API
  description: API documentation for services related to Ayat Saadati's activities on dev.to. This API allows managing articles, profile information, and interactions.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Production server for Ayat Saadati's dev.to services.
tags:
  - name: Articles
    description: Operations related to articles authored by Ayat Saadati.
  - name: Profile
    description: Operations related to Ayat Saadati's user profile information.
paths:
  /articles:
    get:
      summary: Get all articles
      description: Retrieve a list of all articles published by Ayat Saadati.
      operationId: getArticles
      tags:
        - Articles
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Maximum number of articles to return.
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
          description: The number of articles to skip before starting to collect the result set.
      responses:
        '200':
          description: A list of articles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new article
      description: Allows Ayat Saadati to create and publish a new article. Authentication is required.
      operationId: createArticle
      tags:
        - Articles
      requestBody:
        description: Article object to be created.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewArticle'
      responses:
        '201':
          description: Article created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /articles/{articleId}:
    get:
      summary: Get a specific article
      description: Retrieve details of a single article by its unique identifier.
      operationId: getArticleById
      tags:
        - Articles
      parameters:
        - in: path
