```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati Service API
  description: |
    Welcome to the Ayat Saadati Service API documentation. This API provides
    endpoints for managing various resources related to the Ayat Saadati platform,
    including articles, users, and more. This documentation aims to guide
    developers through the available endpoints, request/response structures,
    and authentication mechanisms.

    **Key Features:**
    - Create, Read, Update, and Delete (CRUD) operations for core resources.
    - Secure access using API keys or token-based authentication (to be implemented).
    - Detailed error responses for robust client-side handling.

    We strive to provide a consistent and easy-to-use API experience.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Production server for Ayat Saadati service
paths:
  /articles:
    get:
      summary: Get all articles
      description: Retrieve a list of all articles available on the platform, with optional filtering and pagination.
      operationId: getAllArticles
      parameters:
        - name: limit
          in: query
          description: Maximum number of articles to return
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 10
        - name: offset
          in: query
          description: Number of articles to skip for pagination
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: A paginated list of articles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
        '400':
          description: Invalid query parameters.
    post:
      summary: Create a new article
      description: Submit new article data to create a new entry on the platform.
      operationId: createArticle
      requestBody:
        description: Article object that needs to be added
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewArticle'
      responses:
        '201':
          description: Article created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input provided.
        '401':
          description: Unauthorized request.
  /articles/{articleId}:
    get:
      summary: Get an article by ID
      description: Retrieve a single article's details using its unique identifier.
      operationId: getArticleById
      parameters:
        - name: articleId
          in: path
          description: ID of the article to retrieve
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Article details found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          description: Article not found.
    put:
      summary: Update an existing article
      description: Update the details of an existing article identified by its ID.
      operationId: updateArticle
      parameters:
        - name: articleId
          in: path
          description: ID of the article to update
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Article object with updated fields
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArticle'
      responses:
        '200':
          description: Article updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input provided.
        '404':
          description: Article not found.
        '401':
          description: Unauthorized request.
    delete:
      summary: Delete an article
      description: Remove an article from the platform using its unique identifier.
      operationId: deleteArticle
      parameters:
        - name: articleId
          in: path
          description: ID of the article to delete
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Article deleted successfully. No content.
        '404':
          description: Article not found.
        '401':
          description: Unauthorized request.
  /users/{userId}/articles:
    get:
      summary: Get articles by a specific user
      description: Retrieve a list of all articles authored by a specific user.
      operationId: getArticlesByUser
      parameters:
        - name: userId
          in: path
          description: ID of the user whose articles are to be retrieved
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Maximum number of articles to return
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 10
      responses:
        '200':
          description: A list of articles by the specified user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
        '404':
          description: User not found.
components:
  schemas:
    Article:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the article.
          readOnly: true
        title:
          type: string
          description: Title of the article.
          example: "Understanding OpenAPI 3.0"
        content:
          type: string
          description: Full content of the article, typically in Markdown or HTML.
          example: "OpenAPI 3.0 is a specification for machine-readable interface files for describing, producing, consuming, and visualizing RESTful web services."
        authorId:
          type: string
          format: uuid
          description: Unique identifier for the author of the article.
          example: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
        tags:
          type: array
          items:
            type: string
          description: A list of tags associated with the article.
          example: ["OpenAPI", "REST", "Documentation"]
        createdAt:
          type: string
          format: date-time
          description: Date and time when the article was created.
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: Date and time when the article was last updated.
          readOnly: true
      required:
        - id
        - title
        - content
        - authorId
        - createdAt
        - updatedAt
    NewArticle:
      type: object
      properties:
        title:
          type: string
          description: Title of the new article.
          example: "My First Article on Ayat Saadati"
        content:
          type: string
          description: Full content of the new article.
          example: "This is the exciting content of my very first article. Hope you enjoy it!"
        authorId:
          type: string
          format: uuid
          description: Unique identifier for the author creating the article.
          example: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
        tags:
          type: array
          items:
            type: string
          description: A list of tags to associate with the new article.
          example: ["Beginner", "Welcome"]
      required:
        - title
        - content
        - authorId
    UpdateArticle:
      type: object
      properties:
        title:
          type: string
          description: New title for the article.
          example: "Updated Title for My First Article"
        content:
          type: string
          description: New full content for the article.
          example: "The content of my first article has been updated with more details."
        tags:
          type: array
          items:
            type: string
          description: An updated list of tags for the article.
          example: ["Beginner", "Welcome", "Revised"]
      # All fields are optional for update, as only specific fields might be changed
```