```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati API
  description: |
    This API provides access to manage articles and related content for Ayat Saadati.
    It allows users to retrieve, create, update, and delete articles, mimicking
    common functionalities found in content management systems or blogging platforms.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Production server for Ayat Saadati's content.
tags:
  - name: Articles
    description: Operations related to managing articles.
paths:
  /articles:
    get:
      summary: Get a list of articles
      operationId: getArticles
      tags:
        - Articles
      parameters:
        - name: limit
          in: query
          description: Maximum number of articles to return
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 10
        - name: offset
          in: query
          description: Number of articles to skip before starting to return results
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: A list of articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new article
      operationId: createArticle
      tags:
        - Articles
      requestBody:
        description: Article object to be created
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewArticle'
      responses:
        '201':
          description: Article created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized to create article
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /articles/{articleId}:
    get:
      summary: Get an article by ID
      operationId: getArticleById
      tags:
        - Articles
      parameters:
        - name: articleId
          in: path
          description: ID of the article to retrieve
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Article retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update an existing article
      operationId: updateArticle
      tags:
        - Articles
      parameters:
        - name: articleId
          in: path
          description: ID of the article to update
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Article object with updated fields
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArticle'
      responses:
        '200':
          description: Article updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized to update article
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete an article
      operationId: deleteArticle
      tags:
        - Articles
      parameters:
        - name: articleId
          in: path
          description: ID of the article to delete
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Article deleted successfully (No Content)
        '401':
          description: Unauthorized to delete article
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/{userId}/articles:
    get:
      summary: Get articles by a specific user
      operationId: getArticlesByUser
      tags:
        - Articles
      parameters:
        - name: userId
          in: path
          description: ID of the user whose articles to retrieve
          required: true
          schema:
            type: string
            format: uuid
        - name: publishedOnly
          in: query
          description: Filter to show only published articles
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: A list of articles by the specified user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Article:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the article
          readOnly: true
        title:
          type: string
          description: The title of the article
          example: My First Article on Dev.to
        content:
          type: string
          description: The full content of the article (Markdown or HTML)
          example: "# Hello World\nThis is the content of my first article."
        authorId:
          type: string
          format: uuid
          description: The ID of the author of the article
          readOnly: true
        tags:
          type: array
          items:
            type: string
          description: A list of tags associated with the article
          example: ["programming", "webdev", "tutorial"]
        publishedAt:
          type: string
          format: date-time
          description: Date and time when the article was published
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: Date and time when the article was last updated
          readOnly: true
        isPublished:
          type: boolean
          description: Indicates if the article is published or a draft
          default: false
      required:
        - id
        - title
        - content
        - authorId
        - isPublished
    NewArticle:
      type: object
      properties:
        title:
          type: string
          description: The title of the article
          example: My First Article on Dev.to
        content:
          type: string
          description: The full content of the article (Markdown or HTML)
          example: "# Hello World\nThis is the content of my first article."
        tags:
          type: array
          items:
            type: string
          description: A list of tags associated with the article
          example: ["programming", "webdev", "tutorial"]
        isPublished:
          type: boolean
          description: Set to true to publish the article immediately
          default: false
      required:
        - title
        - content
    UpdateArticle:
      type: object
      properties:
        title:
          type: string
          description: The updated title of the article
        content:
          type: string
          description: The updated full content of the article (Markdown or HTML)
        tags:
          type: array
          items:
            type: string
          description: An updated list of tags associated with the article
        isPublished:
          type: boolean
          description: Update the publication status of the article
      minProperties: 1 # At least one field must be provided for update
    Error:
      type: object
      properties:
        code:
          type: string
          description: A unique error code
          example: ARTICLE_NOT_FOUND
        message:
          type: string
          description: A human-readable error message
          example: The article with the provided ID does not exist.
      required:
        - code
        - message
```