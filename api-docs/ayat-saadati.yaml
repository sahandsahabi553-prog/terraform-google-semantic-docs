```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati API
  description: API for managing articles and content for Ayat Saadati's personal platform.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Development server for Ayat Saadati's platform
paths:
  /articles:
    get:
      summary: Retrieve a list of all articles
      description: Returns a list of all articles available on Ayat Saadati's platform, optionally filtered or paginated.
      parameters:
        - name: limit
          in: query
          description: Maximum number of articles to return
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 10
        - name: offset
          in: query
          description: Number of articles to skip before starting to return results
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: A list of articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new article
      description: Adds a new article to Ayat Saadati's platform.
      requestBody:
        description: Article object to be created
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleRequest'
      responses:
        '201':
          description: Article created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /articles/{articleId}:
    parameters:
      - name: articleId
        in: path
        description: Unique identifier of the article
        required: true
        schema:
          type: string
          format: uuid
          example: 87654321-abcd-ef01-2345-6789abcdef01
    get:
      summary: Retrieve a single article by ID
      description: Returns a specific article identified by its ID.
      responses:
        '200':
          description: The requested article
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update an existing article
      description: Updates the details of an existing article identified by its ID.
      requestBody:
        description: Article object with updated fields
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleRequest'
      responses:
        '200':
          description: Article updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete an article
      description: Deletes a specific article by its ID.
      responses:
        '204':
          description: Article deleted successfully (No Content)
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Article:
      type: object
      required:
        - id
        - title
        - content
        - author
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the article
          example: 12345678-abcd-ef01-2345-6789abcdef01
        title:
          type: string
          description: Title of the article
          example: My Journey into API Design
        content:
          type: string
          description: Full content of the article
          example: This is an exciting article about the challenges and rewards of designing robust APIs...
        author:
          type: string
          description: Author of the article
          example: Ayat Saadati
        tags:
          type: array
          items:
            type: string
          description: List of tags associated with the article
          example:
            - programming
            - apidesign
            - webdev
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the article was created
          example: 2023-10-27T10:00:00Z
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the article was last updated
          example: 2023-10-27T10:30:00Z
    ArticleRequest:
      type: object
      required:
        - title
        - content
        - author
      properties:
        title:
          type: string
          description: Title of the article
          example: My Journey into API Design
        content:
          type: string
          description: Full content of the article
          example: This is an exciting article about the challenges and rewards of designing robust APIs...
        author:
          type: string
          description: Author of the article
          example: Ayat Saadati
        tags:
          type: array
          items:
            type: string
          description: List of tags associated with the article
          example:
            - programming
            - apidesign
            - webdev
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: Error code
          example: 404
        message:
          type: string
          description: Description of the error
          example: Article with ID '123' not found
```