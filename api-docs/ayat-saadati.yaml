```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati API
  description: |
    Welcome to the professional API documentation for the "Ayat Saadati" service.
    This API provides a comprehensive set of endpoints for managing users and related resources.
    It supports standard CRUD operations (Create, Read, Update, Delete) for various entities,
    ensuring a robust and scalable interaction model.

    Explore the available endpoints to interact with the Ayat Saadati platform.
  version: 1.0.0
  contact:
    name: Ayat Saadati
    url: https://dev.to/ayat_saadat
    email: ayat.saadat@example.com # Placeholder email
servers:
  - url: https://dev.to/ayat_saadat
    description: Development Server
tags:
  - name: Users
    description: Operations related to user management.
  - name: Products
    description: Operations related to product catalog.

paths:
  /users:
    get:
      summary: Retrieve a list of all users
      operationId: getAllUsers
      tags:
        - Users
      parameters:
        - name: limit
          in: query
          description: How many users to return at one time (max 100)
          required: false
          schema:
            type: integer
            format: int32
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: The number of items to skip before starting to collect the result set
          required: false
          schema:
            type: integer
            format: int32
            default: 0
      responses:
        '200':
          description: A list of users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '500':
          description: Internal server error.
    post:
      summary: Create a new user
      operationId: createUser
      tags:
        - Users
      requestBody:
        description: User object to be created
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '201':
          description: User created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input or user already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.

  /users/{userId}:
    get:
      summary: Retrieve a single user by ID
      operationId: getUserById
      tags:
        - Users
      parameters:
        - name: userId
          in: path
          description: ID of the user to retrieve
          required: true
          schema:
            type: string
            format: uuid
            example: "d290f1ee-6c54-4b01-90e6-d701748f0851"
      responses:
        '200':
          description: User data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
    put:
      summary: Update an existing user
      operationId: updateUser
      tags:
        - Users
      parameters:
        - name: userId
          in: path
          description: ID of the user to update
          required: true
          schema:
            type: string
            format: uuid
            example: "d290f1ee-6c54-4b01-90e6-d701748f0851"
      requestBody:
        description: User object with fields to update
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
      responses:
        '200':
          description: User updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input or no fields to update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '440':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
    delete:
      summary: Delete a user by ID
      operationId: deleteUser
      tags:
        - Users
      parameters:
        - name: userId
          in: path
          description: ID of the user to delete
          required: true
          schema:
            type: string
            format: uuid
            example: "d290f1ee-6c54-4b01-90e6-d701748f0851"
      responses:
        '204':
          description: User deleted successfully. (No content)
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.

  /products:
    get:
      summary: Retrieve a list of all products
      operationId: getAllProducts
      tags:
        - Products
      parameters:
        - name: category
          in: query
          description: Filter products by category
          required: false
          schema:
            type: string
            enum: [electronics, books, home, clothing]
        - name: maxPrice
          in: query
          description: Maximum price of products to return
          required: false
          schema:
            type: number
            format: float
            minimum: 0
      responses:
        '200':
          description: A list of products.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '500':
          description: Internal server error.
    post:
      summary: Add a new product to the catalog
      operationId: createProduct
      tags:
        - Products
      requestBody:
        description: Product object to be added
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProduct'
      responses:
        '201':
          description: Product added successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid product data provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.

components:
  schemas:
    User:
      type: object
      required:
        - id
        - username
        - email
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the user.
          example: "d290f1ee-6c54-4b01-90e6-d701748f0851"
        username:
          type: string
          description: User's chosen username.
          example: "ayat_saadat"
        email:
          type: string
          format: email
          description: User's email address.
          example: "ayat.saadat@example.com"
        firstName:
          type: string
          description: User's first name.
          example: "Ayat"
        lastName:
          type: string
          description: User's last name.
          example: "Saadat"
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the user account was created.
          example: "2023-10-27T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the user account was last updated.
          example: "2023-10-27T10:30:00Z"
    NewUser:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          description: User's desired username.
          example: "new_user_123"
        email:
          type: string
          format: email
          description: User's email address.
          example: "new.user@example.com"
        password:
          type: string
          format: password
          description: User's password.
          example: "SecurePassword123!"
        firstName:
          type: string
          description: User's first name.
          example: "New"
        lastName:
          type: string
          description: User's last name.
          example: "User"
    UpdateUser:
      type: object
      description: Fields that can be updated for an existing user.
      minProperties: 1
      properties:
        username:
          type: string
          description: New username for the user.
          example: "updated_ayat"
        email:
          type: string
          format: email
          description: New email address for the user.
          example: "updated.