```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati API
  description: |
    API documentation for the Ayat Saadati service, offering endpoints to manage and retrieve various forms of content, such as articles or blog posts.
    This API provides a standard set of operations including creating, reading, updating, and deleting posts.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Development server for Ayat Saadati
tags:
  - name: Posts
    description: Operations related to blog posts or articles.
paths:
  /posts:
    get:
      tags:
        - Posts
      summary: Retrieve all posts
      description: Fetches a list of all available posts, potentially with filtering or pagination capabilities in a future version.
      operationId: getAllPosts
      responses:
        '200':
          description: A successful response returning a list of posts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Posts
      summary: Create a new post
      description: Submits new data to create a new post entry.
      operationId: createPost
      requestBody:
        description: Post object to be created.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPost'
      responses:
        '201':
          description: Post created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Bad Request - Invalid input data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /posts/{postId}:
    get:
      tags:
        - Posts
      summary: Retrieve a single post by ID
      description: Fetches a specific post using its unique identifier.
      operationId: getPostById
      parameters:
        - name: postId
          in: path
          description: The unique identifier of the post.
          required: true
          schema:
            type: string
            format: uuid
            example: "d290f1ee-6c54-4b01-90e6-d701748f0851"
      responses:
        '200':
          description: A successful response returning the requested post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Post not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Posts
      summary: Update an existing post
      description: Updates the details of an existing post identified by its ID.
      operationId: updatePost
      parameters:
        - name: postId
          in: path
          description: The unique identifier of the post to update.
          required: true
          schema:
            type: string
            format: uuid
            example: "d290f1ee-6c54-4b01-90e6-d701748f0851"
      requestBody:
        description: Post object with updated fields.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPost' # Re-using NewPost for update payload
      responses:
        '200':
          description: Post updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Bad Request - Invalid input data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Posts
      summary: Delete a post
      description: Removes a post from the system using its unique identifier.
      operationId: deletePost
      parameters:
        - name: postId
          in: path
          description: The unique identifier of the post to delete.
          required: true
          schema:
            type: string
            format: uuid
            example: "d290f1ee-6c54-4b01-90e6-d701748f0851"
      responses:
        '204':
          description: Post deleted successfully (No Content).
        '404':
          description: Post not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Post:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier for the post.
          example: "d290f1ee-6c54-4b01-90e6-d701748f0851"
        title:
          type: string
          description: The title of the post.
          example: "My First Blog Post"
        content:
          type: string
          description: The full content of the post.
          example: "This is the amazing content of my very first blog post. Hope you enjoy reading it!"
        author:
          type: string
          description: The author of the post.
          example: "Ayat Saadati"
        createdAt:
          type: string
          format: date-time
          description: The date and time when the post was created.
          example: "2023-10-26T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          description: The date and time when the post was last updated.
          example: "2023-10-26T11:30:00Z"
      required:
        - id
        - title
        - content
        - author
        - createdAt
    NewPost:
      type: object
      properties:
        title:
          type: string
          description: The title of the post.
          example: "My New Blog Post Idea"
        content:
          type: string
          description: The full content of the new post.
          example: "Draft content for a new exciting topic. Stay tuned for more details!"
        author:
          type: string
          description: The author of the post.
          example: "Ayat Saadati"
      required:
        - title
        - content
        - author
    Error:
      type: object
      properties:
        code:
          type: string
          description: A unique error code identifying the type of error.
          example: "POST_NOT_FOUND"
        message:
          type: string
          description: A human-readable message describing the error.
          example: "The requested post could not be found."
      required:
        - code
        - message
```