```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati Article Service API
  description: |
    API documentation for the Ayat Saadati Article Service. This service provides functionalities
    to manage articles, including creation, retrieval, updates, and deletion.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Production server for Ayat Saadati articles (simulated)
tags:
  - name: Articles
    description: Operations related to managing articles
paths:
  /articles:
    get:
      summary: Retrieve a list of articles
      operationId: getArticles
      tags:
        - Articles
      parameters:
        - name: limit
          in: query
          description: How many articles to return at one time (max 100)
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Offset for pagination
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: authorId
          in: query
          description: Filter articles by author ID
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A paginated list of articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new article
      operationId: createArticle
      tags:
        - Articles
      requestBody:
        description: Article object that needs to be added to the service
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewArticle'
      responses:
        '201':
          description: Article created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized to create article
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /articles/{articleId}:
    get:
      summary: Retrieve a single article by ID
      operationId: getArticleById
      tags:
        - Articles
      parameters:
        - name: articleId
          in: path
          description: ID of the article to retrieve
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Article found and returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update an existing article
      operationId: updateArticle
      tags:
        - Articles
      parameters:
        - name: articleId
          in: path
          description: ID of the article to update
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Article object with updated fields
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArticle'
      responses:
        '200':
          description: Article updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized to update article
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete an article
      operationId: deleteArticle
      tags:
        - Articles
      parameters:
        - name: articleId
          in: path
          description: ID of the article to delete
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Article deleted successfully (No Content)
        '401':
          description: Unauthorized to delete article
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Article:
      type: object
      required:
        - id
        - title
        - content
        - authorId
        - publishedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the article
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        title:
          type: string
          description: Title of the article
          example: My First Article on Dev.to
        content:
          type: string
          description: Full content of the article (Markdown)
          example: "# Hello World\nThis is the content of my first article."
        authorId:
          type: string
          format: uuid
          description: Unique identifier of the author
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        publishedAt:
          type: string
          format: date-time
          description: Date and time when the article was published
          example: '2023-10-27T10:00:00Z'
        tags:
          type: array
          items:
            type: string
          description: List of tags associated with the article
          example: ["programming", "webdev", "tutorial"]
        views:
          type: integer
          format: int64
          description: Number of views the article has received
          readOnly: true
          example: 12345
    NewArticle:
      type: object
      required:
        - title
        - content
        - authorId
      properties:
        title:
          type: string
          description: Title of the article
          example: My Brand New Article
        content:
          type: string
          description: Full content of the article (Markdown)
          example: "## Getting Started\nThis is the content for my new article."
        authorId:
          type: string
          format: uuid
          description: Unique identifier of the author
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        tags:
          type: array
          items:
            type: string
          description: List of tags for the article
          example: ["javascript", "backend", "api"]
    UpdateArticle:
      type: object
      properties:
        title:
          type: string
          description: New title for the article
          example: Updated Article Title
        content:
          type: string
          description: New full content for the article (Markdown)
          example: "## Revised Content\nThis article has been updated."
        tags:
          type: array
          items:
            type: string
          description: New list of tags for the article
          example: ["javascript", "frontend", "react"]
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: Error code
          example: 400
        message:
          type: string
          description: A human-readable error message
          example: Invalid input provided
```