```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati Content API
  description: |
    Welcome to the Ayat Saadati Content API documentation. This API allows you to manage blog posts, articles, and other content for the Ayat Saadati platform.
    
    You can perform operations such as creating, retrieving, updating, and deleting content.
    
    Explore the endpoints below to interact with the API.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Production server for Ayat Saadati content
tags:
  - name: Posts
    description: Operations related to blog posts
paths:
  /posts:
    get:
      tags:
        - Posts
      summary: Retrieve all blog posts
      description: Fetches a list of all published blog posts, with optional pagination.
      parameters:
        - name: limit
          in: query
          description: Maximum number of posts to return
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 10
        - name: offset
          in: query
          description: Number of posts to skip before starting to return results
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: A list of blog posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Posts
      summary: Create a new blog post
      description: Adds a new blog post to the system.
      requestBody:
        description: Post object to be created
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPost'
      responses:
        '201':
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Invalid input provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /posts/{postId}:
    get:
      tags:
        - Posts
      summary: Retrieve a specific blog post
      description: Fetches a single blog post by its unique ID.
      parameters:
        - name: postId
          in: path
          description: ID of the post to retrieve
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Posts
      summary: Update an existing blog post
      description: Updates the details of an existing blog post identified by its ID.
      parameters:
        - name: postId
          in: path
          description: ID of the post to update
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Post object with updated fields
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePost'
      responses:
        '200':
          description: Post updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Invalid input provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Posts
      summary: Delete a blog post
      description: Deletes a blog post from the system by its unique ID.
      parameters:
        - name: postId
          in: path
          description: ID of the post to delete
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Post deleted successfully (No Content)
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Post:
      type: object
      required:
        - id
        - title
        - content
        - authorId
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the post
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        title:
          type: string
          description: Title of the blog post
          example: My First Blog Post
        content:
          type: string
          description: Full content of the blog post
          example: This is the exciting content of my very first post on Ayat Saadati.
        authorId:
          type: string
          format: uuid
          description: ID of the author who wrote the post
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        createdAt:
          type: string
          format: date-time
          description: Date and time when the post was created
          example: '2023-10-27T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Date and time when the post was last updated
          example: '2023-10-27T11:30:00Z'
    NewPost:
      type: object
      required:
        - title
        - content
        - authorId
      properties:
        title:
          type: string
          description: Title of the blog post
          example: Announcing a New Feature
        content:
          type: string
          description: Full content of the blog post
          example: We are thrilled to announce a brand new feature in our platform!
        authorId:
          type: string
          format: uuid
          description: ID of the author creating the post
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
    UpdatePost:
      type: object
      properties:
        title:
          type: string
          description: New title for the blog post
          example: Updated Feature Announcement
        content:
          type: string
          description: New full content for the blog post
          example: We have updated the details of our new feature. Read more here!
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: Error code
          example: 400
        message:
          type: string
          description: A human-readable error message
          example: Invalid input for post creation.
```