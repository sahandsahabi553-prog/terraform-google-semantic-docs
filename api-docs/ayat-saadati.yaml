```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati API
  description: API for managing personal entries, thoughts, and reflections. "Ayat Saadati" translates to "My Verses of Happiness" or "My Chapters of Felicity," suggesting a personal journaling or content management system.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Development server for Ayat Saadati
tags:
  - name: Entries
    description: Operations related to personal journal entries.
  - name: Categories
    description: Management of entry categories.
paths:
  /entries:
    get:
      summary: Get all journal entries
      description: Retrieves a list of all personal journal entries, optionally paginated.
      tags:
        - Entries
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Maximum number of entries to return.
          example: 10
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
          description: The number of entries to skip before starting to collect the result set.
          example: 0
      responses:
        '200':
          description: A list of journal entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entry'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new journal entry
      description: Adds a new personal journal entry to the system.
      tags:
        - Entries
      requestBody:
        description: Entry object to be created.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewEntry'
      responses:
        '201':
          description: Entry created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '400':
          description: Invalid input provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /entries/{entryId}:
    get:
      summary: Get a journal entry by ID
      description: Retrieves a single journal entry based on its unique identifier.
      tags:
        - Entries
      parameters:
        - in: path
          name: entryId
          schema:
            type: string
            format: uuid
          required: true
          description: Unique identifier of the entry to retrieve.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      responses:
        '200':
          description: The requested journal entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '404':
          description: Entry not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update a journal entry by ID
      description: Updates an existing personal journal entry identified by its ID.
      tags:
        - Entries
      parameters:
        - in: path
          name: entryId
          schema:
            type: string
            format: uuid
          required: true
          description: Unique identifier of the entry to update.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      requestBody:
        description: Entry object with updated fields.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEntry'
      responses:
        '200':
          description: Entry updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '400':
          description: Invalid input provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Entry not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a journal entry by ID
      description: Deletes a personal journal entry from the system.
      tags:
        - Entries
      parameters:
        - in: path
          name: entryId
          schema:
            type: string
            format: uuid
          required: true
          description: Unique identifier of the entry to delete.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      responses:
        '204':
          description: Entry deleted successfully, no content to return.
        '404':
          description: Entry not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /categories:
    get:
      summary: Get all categories
      description: Retrieves a list of all defined categories for entries.
      tags:
        - Categories
      responses:
        '200':
          description: A list of categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new category
      description: Adds a new category for organizing entries.
      tags:
        - Categories
      requestBody:
        description: Category object to be created.
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: The name of the new category.
                  example: Personal Reflections
      responses:
        '201':
          description: Category created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Invalid input provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Entry:
      type: object
      required:
        - id
        - title
        - content
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the entry.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        title:
          type: string
          description: The title of the journal entry.
          minLength: 1
          maxLength: 255
          example: My First Thought of the Day
        content:
          type: string
          description: The main content/body of the journal entry.
          example: Today was a beautiful day, full of new opportunities and challenges...
        categoryId:
          type: string
          format: uuid
          nullable: true
          description: Optional identifier for the category this entry belongs to.
          example: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
        createdAt:
          type: string
          format: date-time
          description: The timestamp when the entry was created.
          example: '2023-10-27T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: The timestamp when the entry was last updated.
          example: '2023-10-27T10:30:00Z'
    NewEntry:
      type: object
      required:
        - title
        - content
      properties:
        title:
          type: string
          description: The title of the journal entry.
          minLength: 1
          maxLength: 255
          example: A New Reflection
        content:
          type: string
          description: The main content/body of the journal entry.
          example: Reflecting on the past week, I found myself grateful for...
        categoryId:
          type: string
          format: uuid
          nullable: true
          description: Optional identifier for the category this entry belongs to.
          example: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
    UpdateEntry:
      type: object
      properties:
        title:
          type: string
          description: The updated title of the journal entry.
          minLength: 1
          maxLength: 255
          example: Updated Reflection on Gratitude
        content:
          type: string
          description: The updated main content/body of the journal entry.
          example: I've expanded my thoughts on gratitude and added new insights.
        categoryId:
          type: string
          format: uuid
          nullable: true
          description: Optional updated identifier for the category. Can be set to null to remove category.
          example: null
    Category:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the category.
          example: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
        name:
          type: string
          description: The name of the category.
          minLength: 1
          maxLength: 100
          example: Daily Thoughts
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: HTTP status code.
          example: 400
        message:
          type: string
          description: A human-readable error message.
          example: Invalid request parameters.
```