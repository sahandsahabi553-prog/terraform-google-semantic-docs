```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati Service API
  description: API for managing content and interactions on Ayat Saadati's platform, mirroring typical dev.to functionalities.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Production server for Ayat Saadati's platform.
tags:
  - name: Articles
    description: Operations related to articles/posts.
  - name: Comments
    description: Operations related to comments on articles.
paths:
  /articles:
    get:
      tags:
        - Articles
      summary: Get a list of all articles
      description: Retrieves a paginated list of all articles available on the platform.
      operationId: listArticles
      parameters:
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            format: int32
            default: 1
        - name: pageSize
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            format: int32
            default: 10
      responses:
        '200':
          description: A list of articles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Articles
      summary: Create a new article
      description: Allows a user to create and publish a new article.
      operationId: createArticle
      requestBody:
        description: Article object that needs to be added to the platform.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleCreateRequest'
      responses:
        '201':
          description: Article created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /articles/{articleId}:
    get:
      tags:
        - Articles
      summary: Get an article by ID
      description: Retrieves a single article using its unique identifier.
      operationId: getArticleById
      parameters:
        - name: articleId
          in: path
          description: ID of the article to retrieve
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Article details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          description: Article not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Articles
      summary: Update an existing article
      description: Updates the details of an existing article identified by its ID.
      operationId: updateArticle
      parameters:
        - name: articleId
          in: path
          description: ID of the article to update
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Article object with updated fields.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleUpdateRequest'
      responses:
        '200':
          description: Article updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Article not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Articles
      summary: Delete an article
      description: Deletes an article permanently from the platform using its unique identifier.
      operationId: deleteArticle
      parameters:
        - name: articleId
          in: path
          description: ID of the article to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Article deleted successfully (No Content).
        '404':
          description: Article not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /articles/{articleId}/comments:
    post:
      tags:
        - Comments
      summary: Add a comment to an article
      description: Allows a user to post a new comment on a specific article.
      operationId: addCommentToArticle
      parameters:
        - name: articleId
          in: path
          description: ID of the article to add a comment to
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Comment object that needs to be added.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
      responses:
        '201':
          description: Comment added successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: Invalid input provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Article not found to add a comment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Article:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the article.
          readOnly: true
        title:
          type: string
          description: Title of the article.
          example: "My First Article on OpenAPI"
        content:
          type: string
          description: Full content of the article, usually in Markdown.
          example: "This is the **amazing** content of my first article."
        authorId:
          type: integer
          format: int64
          description: ID of the user who authored the article.
        tags:
          type: array
          items:
            type: string
          description: List of tags associated with the article.
          example: ["openapi", "swagger", "api-design"]
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the article was created.
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the article was last updated.
          readOnly: true
      required:
        - id
        - title
        - content
        - authorId
        - createdAt
        - updatedAt
    ArticleCreateRequest:
      type: object
      properties:
        title:
          type: string
          description: Title of the article.
          example: "Creating RESTful APIs with Node.js"
        content:
          type: string
          description: Full content of the article, usually in Markdown.
          example: "In this article, we will explore how to build RESTful APIs..."
        authorId:
          type: integer
          format: int64
          description: ID of the user who is authoring the article.
        tags:
          type: array
          items:
            type: string
          description: List of tags to associate with the article.
          example: ["nodejs", "rest-api", "javascript"]
      required:
        - title
        - content
        - authorId
    ArticleUpdateRequest:
      type: object
      properties:
        title:
          type: string
          description: Updated title of the article.
          example: "Advanced RESTful API Design with Node.js"
        content:
          type: string
          description: Updated full content of the article.
          example: "This article now includes advanced topics like HATEOAS..."
        tags:
          type: array
          items:
            type: string
          description: Updated list of tags for the article.
          example: ["nodejs", "rest-api", "javascript", "hateoas"]
    Comment:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the comment.
          readOnly: true
        articleId:
          type: integer
          format: int64
          description: ID of the article the comment belongs to.
          readOnly: true
        authorId:
          type: integer
          format: int64
          description: ID of the user who authored the comment.
        content:
          type: string
          description: The text content of the comment.
          example: "Great article! Very insightful."
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the comment was created.
          readOnly: true
      required:
        - id
        - articleId
        - authorId
        - content
        - createdAt
    CommentCreateRequest:
      type: object
      properties:
        authorId:
          type: integer
          format: int64
          description: ID of the user who is posting the comment.
        content:
          type: string
          description: The text content of the comment to be posted.
          example: "I have a question about the third point mentioned."
      required:
        - authorId
        - content
    Error:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: A unique error code.
          example: 4001
        message:
          type: string
          description: A human-readable description of the error.
          example: "Invalid input provided. 'title' cannot be empty."
```