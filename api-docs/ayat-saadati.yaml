```yaml
openapi: 3.0.3
info:
  title: Ayat Saadati Service
  description: Professional API for managing Ayat Saadati resources
  version: 1.0.0
  contact:
    name: API Support
    email: support@ayatsaadati.dev
servers:
  - url: https://dev.to/ayat_saadat
paths:
  /verses:
    get:
      summary: List all verses
      operationId: listVerses
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: surah
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of verses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Verse'
                  meta:
                    $ref: '#/components/schemas/Meta'
    post:
      summary: Create a new verse
      operationId: createVerse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerseInput'
      responses:
        '201':
          description: Verse created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /verses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a verse by ID
      operationId: getVerse
      responses:
        '200':
          description: Verse details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update a verse
      operationId: updateVerse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerseInput'
      responses:
        '200':
          description: Verse updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a verse
      operationId: deleteVerse
      responses:
        '204':
          description: Verse deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /recitations:
    get:
      summary: List recitations
      operationId: listRecitations
      parameters:
        - name: verse_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of recitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recitation'
components:
  schemas:
    Verse:
      type: object
      properties:
        id:
          type: string
        surah:
          type: string
        ayah:
          type: integer
        text:
          type: string
        translation:
          type: string
    VerseInput:
      type: object
      required:
        - surah
        - ayah
        - text
      properties:
        surah:
          type: string
        ayah:
          type: integer
        text:
          type: string
        translation:
          type: string
    Recitation:
      type: object
      properties:
        id:
          type: string
        verse_id:
          type: string
        audio_url:
          type: string
        reciter:
          type: string
    Meta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
```