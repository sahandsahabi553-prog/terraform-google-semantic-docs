```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati Service API
  description: API documentation for the Ayat Saadati content service, providing endpoints to manage articles, posts, or similar content.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Development server (Ayat Saadati domain on dev.to)
paths:
  /posts:
    get:
      summary: Retrieve a list of all posts
      operationId: getAllPosts
      tags:
        - Posts
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            format: int32
            default: 10
            minimum: 1
            maximum: 100
          description: Maximum number of posts to return
        - in: query
          name: offset
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
          description: Number of posts to skip before starting to collect the result set
      responses:
        '200':
          description: A list of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new post
      operationId: createPost
      tags:
        - Posts
      requestBody:
        description: Post object to be created
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPost'
      responses:
        '201':
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /posts/{postId}:
    get:
      summary: Retrieve a single post by ID
      operationId: getPostById
      tags:
        - Posts
      parameters:
        - in: path
          name: postId
          schema:
            type: string
            format: uuid
          required: true
          description: Unique identifier of the post to retrieve
      responses:
        '200':
          description: A single post object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update an existing post by ID
      operationId: updatePost
      tags:
        - Posts
      parameters:
        - in: path
          name: postId
          schema:
            type: string
            format: uuid
          required: true
          description: Unique identifier of the post to update
      requestBody:
        description: Post object with updated fields
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePost'
      responses:
        '200':
          description: Post updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Invalid input or request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a post by ID
      operationId: deletePost
      tags:
        - Posts
      parameters:
        - in: path
          name: postId
          schema:
            type: string
            format: uuid
          required: true
          description: Unique identifier of the post to delete
      responses:
        '204':
          description: Post deleted successfully (No Content)
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Post:
      type: object
      required:
        - id
        - title
        - content
        - authorId
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the post
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        title:
          type: string
          description: Title of the post
          example: My First Post on Ayat Saadati
        content:
          type: string
          description: Full content of the post
          example: This is the detailed content of my very first post. I hope you enjoy reading it!
        authorId:
          type: string
          format: uuid
          description: Unique identifier of the author
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the post was created
          example: '2023-10-27T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the post was last updated
          example: '2023-10-27T11:30:00Z'
    NewPost:
      type: object
      required:
        - title
        - content
        - authorId
      properties:
        title:
          type: string
          description: Title of the post
          example: A New Article About OpenAPI
        content:
          type: string
          description: Full content of the new post
          example: This article will explore the benefits and usage of OpenAPI specifications for API documentation.
        authorId:
          type: string
          format: uuid
          description: Unique identifier of the author creating the post
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
    UpdatePost:
      type: object
      properties:
        title:
          type: string
          description: New title for the post (optional)
          example: Updated Title for My Article
        content:
          type: string
          description: New content for the post (optional)
          example: This is the revised content after some edits and additions.
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: Error code
          example: 400
        message:
          type: string
          description: A descriptive error message
          example: Invalid input provided. Please check your request.
```