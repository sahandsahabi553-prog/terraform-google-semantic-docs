        '200':
          description: Quote found and returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '404':
          description: Quote not found for the given ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update an existing quote
      operationId: updateQuote
      tags:
        - Quotes
      description: Updates the details of an existing quote identified by its ID.
      requestBody:
        description: Quote object with the fields to be updated.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewQuote' # Assumes all fields of NewQuote are updatable
      responses:
        '200':
          description: Quote updated successfully. Returns the updated quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          description: Invalid request payload or ID mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Quote not found for the given ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a quote by ID
      operationId: deleteQuote
      tags:
        - Quotes
      description: Permanently deletes a quote from the database using its unique identifier.
      responses:
        '204':
          description: Quote deleted successfully. No content returned.
        '404':
          description: Quote not found for the given ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /quotes/random:
    get:
      summary: Retrieve a random quote
      operationId: getRandomQuote
      tags:
        - Quotes
      description: Fetches a single random quote from the collection. Useful for daily inspiration.
      responses:
        '200':
          description: A random quote successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '404':
          description: No quotes available in the database to retrieve.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
