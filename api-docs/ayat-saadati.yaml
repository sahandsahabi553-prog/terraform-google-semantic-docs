```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati Article Management API
  description: |
    This API provides a comprehensive set of endpoints for managing articles for the "Ayat Saadati" platform.
    Users can create, retrieve, update, and delete articles, as well as manage their publication status.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Production server
paths:
  /articles:
    get:
      summary: Retrieve a list of all articles
      operationId: getAllArticles
      tags:
        - Articles
      parameters:
        - name: limit
          in: query
          description: Maximum number of articles to return
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 10
        - name: offset
          in: query
          description: Number of articles to skip before starting to return
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: A list of articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new article
      operationId: createArticle
      tags:
        - Articles
      requestBody:
        description: Article object to be created
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewArticle'
      responses:
        '201':
          description: Article created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /articles/{articleId}:
    parameters:
      - name: articleId
        in: path
        description: ID of the article to retrieve, update, or delete
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Retrieve a single article by ID
      operationId: getArticleById
      tags:
        - Articles
      responses:
        '200':
          description: Article data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update an existing article
      operationId: updateArticle
      tags:
        - Articles
      requestBody:
        description: Article object with updated fields
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArticle'
      responses:
        '200':
          description: Article updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete an article
      operationId: deleteArticle
      tags:
        - Articles
      responses:
        '204':
          description: Article deleted successfully (No Content)
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /articles/{articleId}/publish:
    post:
      summary: Publish an article
      operationId: publishArticle
      tags:
        - Articles
      parameters:
        - name: articleId
          in: path
          description: ID of the article to publish
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Article published successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Article already published or cannot be published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Article:
      type: object
      required:
        - id
        - title
        - content
        - authorId
        - status
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the article
          example: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
        title:
          type: string
          description: The title of the article
          example: "My First Article on Ayat Saadati"
        content:
          type: string
          description: The main body content of the article (Markdown or HTML)
          example: "This is the **content** of my new article. It's very informative!"
        authorId:
          type: string
          format: uuid
          description: ID of the author who wrote the article
          example: "f0e9d8c7-b6a5-4321-fedc-ba9876543210"
        createdDate:
          type: string
          format: date-time
          description: Date and time when the article was created
          readOnly: true
          example: "2023-10-26T10:00:00Z"
        publishedDate:
          type: string
          format: date-time
          description: Date and time when the article was published (if applicable)
          nullable: true
          example: "2023-10-26T14:30:00Z"
        status:
          type: string
          description: Current status of the article
          enum:
            - DRAFT
            - PENDING_REVIEW
            - PUBLISHED
            - ARCHIVED
          example: "DRAFT"
    NewArticle:
      type: object
      required:
        - title
        - content
        - authorId
      properties:
        title:
          type: string
          description: The title of the new article
          example: "A Brand New Topic for Discussion"
        content:
          type: string
          description: The main body content of the new article
          example: "Here's some fresh content for Ayat Saadati readers!"
        authorId:
          type: string
          format: uuid
          description: The ID of the author creating the article
          example: "f0e9d8c7-b6a5-4321-fedc-ba9876543210"
    UpdateArticle:
      type: object
      properties:
        title:
          type: string
          description: The updated title of the article
          example: "An Updated Article Title"
        content:
          type: string
          description: The updated main body content of the article
          example: "This content has been revised and improved."
        status:
          type: string
          description: The updated status of the article
          enum:
            - DRAFT
            - PENDING_REVIEW
            - PUBLISHED
            - ARCHIVED
          example: "PENDING_REVIEW"
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: A unique error code
          example: "ARTICLE_NOT_FOUND"
        message:
          type: string
          description: A human-readable description of the error
          example: "The article with the specified ID was not found."
```