```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati Content API
  description: |
    Welcome to the Ayat Saadati Content API! This API provides a robust set of
    endpoints for managing articles, posts, and other content attributed to
    Ayat Saadati. Whether you're fetching existing content, publishing new articles,
    or updating your latest thoughts, this API empowers seamless interaction.

    All operations are designed to be intuitive and follow RESTful principles.
    Authentication is assumed to be handled at a higher level (e.g., via API keys or OAuth),
    and is not explicitly detailed in these specifications, but standard security
    practices should be applied.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Production server for Ayat Saadati's content service
paths:
  /articles:
    get:
      summary: Retrieve a list of all articles
      description: |
        Fetches an array of all articles published by Ayat Saadati.
        Supports pagination to handle large datasets efficiently.
      operationId: getAllArticles
      tags:
        - Articles
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Maximum number of articles to return in a single response.
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of articles to skip before starting to collect the result set (for pagination).
        - in: query
          name: tags
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Filter articles by one or more tags (e.g., `?tags=programming,tutorial`).
      responses:
        '200':
          description: A successfully retrieved list of articles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
        '400':
          description: Invalid query parameters provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new article
      description: |
        Adds a new article to the Ayat Saadati collection.
        The article's ID, author, and publication date will be automatically generated by the server.
      operationId: createArticle
      tags:
        - Articles
      requestBody:
        description: Article object containing the data for the new article.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleCreateRequest'
      responses:
        '201':
          description: Article created successfully. Returns the full article object with server-generated fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid article data supplied (e.g., missing required fields, invalid format).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized request (e.g., missing or invalid authentication token).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /articles/{articleId}:
    get:
      summary: Retrieve a single article by ID
      description: Fetches a specific article using its unique identifier.
      operationId: getArticleById
      tags:
        - Articles
      parameters:
        - in: path
          name: articleId
          schema:
            type: string
            format: uuid
          required: true
          description: Unique ID of the article to retrieve.
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
      responses:
        '200':
          description: Article details successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid article ID format supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Article not found with the specified ID.
          content:
            application/json: