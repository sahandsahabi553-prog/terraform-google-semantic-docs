```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati API
  description: |
    Welcome to the Ayat Saadati API documentation!
    This API provides a robust set of endpoints for managing and retrieving 'Saadats' (blessings, inspirations, or posts).
    It allows users to perform CRUD (Create, Read, Update, Delete) operations on inspirational content,
    making it easy to share and manage positive affirmations or insightful articles.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Development server for Ayat Saadati API
paths:
  /saadats:
    get:
      summary: Retrieve a list of all Saadats
      description: |
        Fetches a comprehensive list of all 'Saadats' (inspirational posts or blessings) available in the system.
        Results can be paginated or filtered in a more advanced implementation (not shown here).
      operationId: getAllSaadats
      tags:
        - Saadats
      responses:
        '200':
          description: A successful response returning an array of Saadat objects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Saadat'
              examples:
                successList:
                  summary: Example of a successful list of Saadats
                  value:
                    - id: 101
                      title: "The Power of Gratitude"
                      content: "Cultivate an attitude of gratitude, and watch your world transform. Every challenge is an opportunity."
                      author: "Ayat Saadati"
                      createdAt: "2023-01-15T08:00:00Z"
                      updatedAt: "2023-01-15T08:00:00Z"
                    - id: 102
                      title: "Embrace the Journey"
                      content: "Life is a journey, not a destination. Enjoy the process, learn from every step, and grow."
                      author: "Guest Contributor"
                      createdAt: "2023-02-20T14:30:00Z"
                      updatedAt: "2023-02-20T14:30:00Z"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internalError:
                  summary: Example of an internal server error
                  value:
                    code: 500
                    message: "An unexpected error occurred on the server."
    post:
      summary: Create a new Saadat
      description: |
        Adds a new 'Saadat' entry to the system. The request body should contain
        the title, content, and author for the new Saadat.
      operationId: createSaadat
      tags:
        - Saadats
      requestBody:
        description: Saadat object to be created.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSaadat'
            examples:
              newSaadatRequest:
                summary: Example request for creating a new Saadat
                value:
                  title: "Mindfulness in Daily Life"
                  content: "Practice being present in every moment. It reduces stress and enhances appreciation."
                  author: "Ayat Saadati"
      responses:
        '201':
          description: Saadat created successfully. Returns the newly created Saadat object with its assigned ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Saadat'
              examples:
                createdSaadat:
                  summary: Example of a newly created Saadat
                  value:
                    id: 103
                    title: "Mindfulness in Daily Life"
                    content: "Practice being present in every moment. It reduces stress and enhances appreciation."
                    author: "Ayat Saadati"
                    createdAt: "2023-10-27T10:00:00Z"
                    updatedAt: "2023-10-27T10:00:00Z"
        '400':
          description: Invalid input provided (e.g., missing required fields).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidInput:
                  summary: Example of invalid input error
                  value:
                    code: 400
                    message: "Validation Error: 'title' and 'content' are required."
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
  /saadats/{saadatId}:
    parameters:
      - name: saadatId
        in: path
        description: Unique identifier of the Saadat to retrieve, update, or delete.
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
        examples:
          existingId:
            value: 101
          nonExistentId:
            value: 999
    get:
      summary: Retrieve a single Saadat by ID
      description: |
        Fetches the details of a specific 'Saadat' using its unique identifier.
      operationId: getSaadatById
      tags:
        - Saadats
      responses:
        '200':
          description: The requested Saadat object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Saadat'
              examples:
                singleSaadat:
                  summary: Example of a single Saadat retrieved by ID
                  value:
                    id: 101
                    title: "The Power of Gratitude"
                    content: "Cultivate an attitude of gratitude, and watch your world transform. Every challenge is an opportunity."
                    author: "Ayat Saadati"
                    createdAt: "2023-01-15T08:00:00Z"
                    updatedAt: "2023-01-15T08:00:00Z"
        '404':
          description: Saadat not found with the provided ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  summary: Example of Saadat not found error
                  value:
                    code: 404
                    message: "Saadat with ID 999 not found."
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update an existing Saadat
      description: |
        Updates the details of an existing 'Saadat' identified by its ID.
        Only provided fields will be updated.
      operationId: updateSaadat
      tags:
        - Saadats
      requestBody:
        description: Saadat object with updated fields.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSaadat'
            examples:
              updateSaadatRequest:
                summary: Example request for updating a Saadat
                value:
                  title: "The Enduring Power of Gratitude"
                  author: "Ayat Saadati Team"
      responses:
        '200':
          description: Saadat updated successfully. Returns the updated Saadat object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Saadat'
              examples:
                updatedSaadat:
                  summary: Example of a successfully updated Saadat
                  value:
                    id: 101
                    title: "The Enduring Power of Gratitude"
                    content: "Cultivate an attitude of gratitude, and watch your world transform. Every challenge is an opportunity."
                    author: "Ayat Saadati Team"
                    createdAt: "2023-01-15T08:00:00Z"
                    updatedAt: "2023-10-27T11:30:00Z"
        '400':
          description: Invalid input provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Saadat not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
