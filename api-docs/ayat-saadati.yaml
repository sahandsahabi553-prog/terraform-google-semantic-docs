```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati Service API
  description: |
    Welcome to the Ayat Saadati Service API documentation. This API provides
    a robust set of endpoints for managing articles, users, and their interactions
    on a modern blogging platform. You can create, retrieve, update, and delete
    articles, manage user profiles, and interact with comments.

    This documentation aims to be comprehensive, providing clear examples and
    detailed schema definitions for all operations.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Production server for Ayat Saadati service
  - url: https://qa.dev.to/ayat_saadat
    description: QA environment for testing
tags:
  - name: Articles
    description: Operations related to articles/posts
  - name: Users
    description: Operations related to user accounts
  - name: Comments
    description: Operations related to article comments
paths:
  /articles:
    get:
      summary: Get all articles
      description: Retrieve a paginated list of all articles available on the platform.
      tags:
        - Articles
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
          description: Maximum number of articles to return
          required: false
          example: 10
        - in: query
          name: offset
          schema:
            type: integer
            format: int32
            minimum: 0
          description: Number of articles to skip for pagination
          required: false
          example: 0
        - in: query
          name: tag
          schema:
            type: string
          description: Filter articles by a specific tag
          required: false
          example: programming
      responses:
        '200':
          description: A list of articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new article
      description: Submit a new article to be published on the platform.
      tags:
        - Articles
      requestBody:
        description: Article object that needs to be added
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewArticle'
      responses:
        '201':
          description: Article created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /articles/{articleId}:
    get:
      summary: Get a single article by ID
      description: Retrieve detailed information for a specific article using its unique identifier.
      tags:
        - Articles
      parameters:
        - in: path
          name: articleId
          schema:
            type: string
            format: uuid
          description: The ID of the article to retrieve
          required: true
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
      responses:
        '200':
          description: Article found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update an existing article
      description: Update the content or metadata of an existing article.
      tags:
        - Articles
      parameters:
        - in: path
          name: articleId
          schema:
            type: string
            format: uuid
          description: The ID of the article to update
          required: true
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
      requestBody:
        description: Article object with updated fields
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArticle'
      responses:
        '200':
          description: Article updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '440':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete an article
      description: Permanently delete an article from the platform. This action cannot be undone.
      tags:
        - Articles
      parameters:
        - in: path
          name: articleId
          schema:
            type: string
            format: uuid
          description: The ID of the article to delete
          required: true
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
      responses:
        '204':
          description: Article deleted successfully (No Content)
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/{userId}:
    get:
      summary: Get user profile by ID
      description: Retrieve the profile details for a specific user.
      tags:
        - Users
      parameters:
        - in: path
          name: userId
          schema:
            type: string
            format: uuid
          description: The ID of the user to retrieve
          required: true
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
      responses:
        '200':
          description: User profile found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /articles/{articleId}/comments:
    post:
      summary: Add a comment to an article
      description: Add a new comment to a specific article.
      tags:
        - Comments
      parameters:
        - in: path
          name: articleId
          schema:
            type: string
            format: uuid
          description: The ID of the article to comment on
          required: true
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
      requestBody:
        description: Comment object to be added
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewComment'
      responses:
        '201':
          description: Comment added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: Invalid input provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Article:
      type: object
      required:
        - id
        - title
        - content
        - authorId
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the article
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        title:
          type: string
          description: The title of the article
          example: My First Blog Post
        content:
          type: string
          description: The main content of the article (Markdown allowed)
          example: This is the **full content** of my first article.
        authorId:
          type: string
          format: uuid
          description: The ID of the user who authored the article
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        tags:
          type: array
          items:
            type: string
          description: List of tags associated with the article
          example: ["programming", "webdev", "tutorial"]
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the article was created
          example: 2023-10-27T10:00:00Z
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the article was last updated
          example: 2023-10-27T11:30:00Z
    NewArticle:
      type: object
      required:
        - title
        - content
        - authorId
      properties:
        title:
          type: string
          description: The title of the new article
          example: A Guide to OpenAPI 3.0
        content:
          type: string
          description: The main content of the new article (Markdown allowed)
          example: OpenAPI 3.0 is a powerful specification...
        authorId:
          type: string
          format: uuid
          description: The ID of the author creating the article
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        tags:
          type: array
          items:
            type: string
          description: Optional list of tags for the article
          example: ["openapi", "api-design", "documentation"]
    UpdateArticle:
      type: object
      properties:
        title:
          type: string
          description: The updated title of the article
          example: A Comprehensive Guide to OpenAPI 3.0
        content:
          type: string
          description: The updated main content of the article (Markdown allowed)
          example: OpenAPI 3.0 is a powerful and widely adopted specification...
        tags:
          type: array
          items:
            type: string
          description: Updated list of tags for the article
          example: ["openapi", "api-design", "documentation", "swagger"]
    User:
      type: object
      required:
        - id
        - username
        - email
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the user
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        username:
          type: string
          description: User's chosen username
          example: ayat_saadat
        email:
          type: string
          format: email
          description: User's email address
          example: ayat.saadat@example.com
        bio:
          type: string
          description: Short biography of the user
          nullable: true
          example: Passionate software engineer and API enthusiast.
        profilePictureUrl:
          type: string
          format: uri
          description: URL to the user's profile picture
          nullable: true
          example: https://example.com/profiles/ayat.jpg
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the user account was created
          example: 2022-01-15T08:00:00Z
    Comment:
      type: object
      required:
        - id
        - articleId
        - authorId
        - content
        - createdAt
      properties:
        id:
          type: