```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati Content API
  description: |
    Welcome to the Ayat Saadati Content API documentation!
    This API provides programmatic access to manage articles, user content, and other related resources.
    It supports creating, retrieving, updating, and deleting content items.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Development/Staging server for Ayat Saadati
tags:
  - name: Articles
    description: Operations related to articles and blog posts.
paths:
  /articles:
    get:
      tags:
        - Articles
      summary: Retrieve a list of articles
      description: Fetches a paginated list of all articles available in the system.
      operationId: getArticles
      parameters:
        - name: limit
          in: query
          description: Maximum number of articles to return
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
          example: 10
        - name: offset
          in: query
          description: The number of articles to skip before starting to collect the result set
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
          example: 0
      responses:
        '200':
          description: A list of articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Articles
      summary: Create a new article
      description: Creates a brand new article with the provided content and author details.
      operationId: createArticle
      requestBody:
        description: Article object to be created
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewArticle'
      responses:
        '201':
          description: Article created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /articles/{articleId}:
    get:
      tags:
        - Articles
      summary: Retrieve a single article by ID
      description: Fetches the details of a specific article using its unique identifier.
      operationId: getArticleById
      parameters:
        - name: articleId
          in: path
          description: The unique identifier of the article
          required: true
          schema:
            type: string
            format: uuid
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
      responses:
        '200':
          description: Article details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Articles
      summary: Update an existing article
      description: Updates the content or details of an existing article identified by its ID.
      operationId: updateArticle
      parameters:
        - name: articleId
          in: path
          description: The unique identifier of the article to update
          required: true
          schema:
            type: string
            format: uuid
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
      requestBody:
        description: Article object with updated fields
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArticle'
      responses:
        '200':
          description: Article updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Articles
      summary: Delete an article
      description: Deletes an article permanently from the system using its unique identifier.
      operationId: deleteArticle
      parameters:
        - name: articleId
          in: path
          description: The unique identifier of the article to delete
          required: true
          schema:
            type: string
            format: uuid
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
      responses:
        '204':
          description: Article deleted successfully (No Content)
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Article:
      type: object
      required:
        - id
        - title
        - content
        - authorId
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the article
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        title:
          type: string
          description: The title of the article
          example: My First Blog Post
        content:
          type: string
          description: The main body content of the article (can be Markdown or HTML)
          example: This is the **full content** of my first blog post. It's very exciting!
        authorId:
          type: string
          format: uuid
          description: The unique identifier of the author who wrote the article
          example: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the article was created
          example: '2023-10-26T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the article was last updated
          example: '2023-10-26T11:30:00Z'
    NewArticle:
      type: object
      required:
        - title
        - content
        - authorId
      properties:
        title:
          type: string
          description: The title of the article
          example: A New Adventure in Tech
        content:
          type: string
          description: The main body content of the article
          example: Exploring the latest trends in API design and development.
        authorId:
          type: string
          format: uuid
          description: The unique identifier of the author
          example: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
    UpdateArticle:
      type: object
      properties:
        title:
          type: string
          description: The updated title of the article
          example: An Updated Adventure in Tech
        content:
          type: string
          description: The updated main body content of the article
          example: We've now refined our exploration of API design and development.
      minProperties: 1 # At least one property must be provided for update
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: A unique error code
          example: 4001
        message:
          type: string
          description: A human-readable description of the error
          example: Invalid article ID format.
```