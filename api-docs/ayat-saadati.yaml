```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati Service API
  description: API documentation for the Ayat Saadati content management service. This API allows managing posts and related content, providing a robust interface for creating, retrieving, updating, and deleting posts.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Development server for Ayat Saadati service
tags:
  - name: Posts
    description: Operations related to blog posts and articles.
paths:
  /posts:
    get:
      tags:
        - Posts
      summary: Retrieve a list of all posts
      description: Fetches an array of all available posts, allowing for pagination to manage large datasets efficiently.
      operationId: getAllPosts
      parameters:
        - name: limit
          in: query
          description: How many items to return at one time (max 100)
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 10
        - name: offset
          in: query
          description: Offset for pagination, indicating the starting point of the results.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: A paginated list of posts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '500':
          description: Internal server error. An unexpected error occurred on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Posts
      summary: Create a new post
      description: Creates a new post with the provided data, assigning it a unique identifier and timestamps.
      operationId: createPost
      requestBody:
        description: Post object to be created.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPost'
      responses:
        '201':
          description: Post created successfully. Returns the newly created post object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Invalid input. The request body contains invalid or missing data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error. An unexpected error occurred on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /posts/{postId}:
    parameters:
      - name: postId
        in: path
        description: Unique identifier of the post to retrieve, update, or delete.
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
        example: 123
    get:
      tags:
        - Posts
      summary: Retrieve a single post by ID
      description: Fetches a specific post using its unique identifier.
      operationId: getPostById
      responses:
        '200':
          description: A single post object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Post not found. The specified postId does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error. An unexpected error occurred on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Posts
      summary: Update an existing post
      description: Updates the details of an existing post identified by its ID. Only provided fields will be updated.
      operationId: updatePost
      requestBody:
        description: Post object with fields to be updated.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePost'
      responses:
        '200':
          description: Post updated successfully. Returns the updated post object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Invalid input. The request body contains invalid data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found. The specified postId does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error. An unexpected error occurred on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Posts
      summary: Delete a post
      description: Deletes a post identified by its ID. This action is irreversible.
      operationId: deletePost
      responses:
        '204':
          description: Post deleted successfully. No content is returned.
        '404':
          description: Post not found. The specified postId does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error. An unexpected error occurred on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Post:
      type: object
      required:
        - id
        - title
        - content
        - authorId
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the post.
          readOnly: true
          example: 1
        title:
          type: string
          description: Title of the post.
          minLength: 3
          maxLength: 255
          example: My First Post
        content:
          type: string
          description: Full content of the post.
          minLength: 10
          example: This is the detailed content of my very first post, discussing various topics.
        authorId:
          type: integer
          format