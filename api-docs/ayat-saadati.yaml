```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati Service API
  description: |
    Welcome to the Ayat Saadati Service API documentation!

    This API provides a comprehensive set of endpoints to manage posts, articles, and other content related to Ayat Saadati's platform. You can create, read, update, and delete posts, interact with user profiles, and manage comments.

    Explore the endpoints below to integrate with our service.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Production server for Ayat Saadati Service
tags:
  - name: Posts
    description: Operations related to blog posts and articles.
  - name: Users
    description: Operations related to user profiles.
  - name: Comments
    description: Operations related to post comments.
paths:
  /posts:
    get:
      tags:
        - Posts
      summary: Get all posts
      description: Retrieves a paginated list of all available posts on the platform.
      operationId: getAllPosts
      parameters:
        - name: limit
          in: query
          description: Maximum number of posts to retrieve.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 10
        - name: offset
          in: query
          description: The number of posts to skip before starting to collect the result set.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: A list of posts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Posts
      summary: Create a new post
      description: Creates a new post with the provided details.
      operationId: createPost
      requestBody:
        description: Post object to be created.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPost'
      responses:
        '201':
          description: Post created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Invalid input provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /posts/{postId}:
    get:
      tags:
        - Posts
      summary: Get a post by ID
      description: Retrieves a single post by its unique identifier.
      operationId: getPostById
      parameters:
        - name: postId
          in: path
          description: ID of the post to retrieve.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Post found successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Post not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Posts
      summary: Update an existing post
      description: Updates the details of an existing post identified by its ID.
      operationId: updatePost
      parameters:
        - name: postId
          in: path
          description: ID of the post to update.
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Post object with updated fields.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePost'
      responses:
        '200':
          description: Post updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Invalid input provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Posts
      summary: Delete a post
      description: Deletes a post identified by its unique ID.
      operationId: deletePost
      parameters:
        - name: postId
          in: path
          description: ID of the post to delete.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Post deleted successfully, no content.
        '404':
          description: Post not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/{userId}:
    get:
      tags:
        - Users
      summary: Get user profile by ID
      description: Retrieves a user's profile information by their unique identifier.
      operationId: getUserById
      parameters:
        - name: userId
          in: path
          description: ID of the user to retrieve.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: User profile found successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /posts/{postId}/comments:
    post:
      tags:
        - Comments
      summary: Add a comment to a post
      description: Adds a new comment to a specified post.
      operationId: addCommentToPost
      parameters:
        - name: postId
          in: path
          description: ID of the post to add a comment to.
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Comment object to be created.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewComment'
      responses:
        '201':
          description: Comment created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: Invalid input provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Post:
      type: object
      required:
        - id
        - title
        - content
        - authorId
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the post.
          example: 101
        title:
          type: string
          description: Title of the post.
          example: My First Blog Post
        content:
          type: string
          description: Full content of the post, can include markdown or HTML.
          example: This is the detailed content of my very first post. It's exciting!
        authorId:
          type: integer
          format: int64
          description: ID of the user who authored the post.
          example: 1
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the post was created.
          example: '2023-10-27T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the post was last updated.
          example: '2023-10-27T11:30:00Z'
    NewPost:
      type: object
      required:
        - title
        - content
        - authorId
      properties:
        title:
          type: string
          description: Title of the new post.
          example: Exciting New Project Announcement
        content:
          type: string
          description: The main body content of the new post.
          example: We are thrilled to announce our latest project, focusing on...
        authorId:
          type: integer
          format: int64
          description: The ID of the author creating this post.
          example: 1
    UpdatePost:
      type: object
      properties:
        title:
          type: string
          description: New title for the post.
          example: Updated Project Announcement
        content:
          type: string
          description: New content for the post.
          example: The project has been updated with new features...
    User:
      type: object
      required:
        - id
        - username
        - email
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the user.
          example: 1
        username:
          type: string
          description: User's chosen username.
          example: ayat_saadati
        email:
          type: string
          format: email
          description: User's email address.
          example: ayat.saadati@example.com
        bio:
          type: string
          nullable: true
          description: Short biography of the user.
          example: Passionate about tech and writing.
    Comment:
      type: object
      required:
        - id
        - postId
        - authorId
        - content
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the comment.
          example: 1001
        postId:
          type: integer
          format: int64
          description: The ID of the post this comment belongs to.
          example: 101
        authorId:
          type: integer
          format: int64
          description: The ID of the user who made the comment.
          example: 2
        content:
          type: string
          description: The text content of the comment.
          example: This is a great post! Very insightful.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the comment was created.
          example: '2023-10-27T12:05:00Z'
    NewComment:
      type: object
      required:
        - authorId
        - content
      properties:
        authorId:
          type: integer
          format: int64
          description: The ID of the user making the comment.
          example: 2
        content:
          type: string
          description: The text content of the new comment.
          example: I really enjoyed reading this article!
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: Error code.
          example: 400
        message:
          type: string
          description: A human-readable description of the error.
          example: Invalid input parameters.
```