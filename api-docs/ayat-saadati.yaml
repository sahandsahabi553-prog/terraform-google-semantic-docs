tags:
  - name: Quotes
    description: Operations related to managing inspirational quotes and "ayat".
paths:
  /quotes:
    get:
      summary: Retrieve a list of all quotes
      operationId: getAllQuotes
      tags:
        - Quotes
      description: Fetches all available quotes from the database. Results can be paginated or filtered in future versions.
      responses:
        '200':
          description: A successful response returning a list of quotes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Quote'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Add a new quote
      operationId: createQuote
      tags:
        - Quotes
      description: Creates and stores a new quote with its text, author, and optional details.
      requestBody:
        description: Quote object to be added to the collection.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewQuote'
      responses:
        '201':
          description: Quote created successfully. Returns the newly created quote with its assigned ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          description: Invalid request payload. Missing required fields or incorrect data types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /quotes/{quoteId}:
    parameters:
      - in: path
        name: quoteId
        schema:
          type: string
          format: uuid
        required: true
        description: Unique identifier (UUID) of the quote to retrieve, update, or delete.
    get:
      summary: Retrieve a single quote by ID
      operationId: getQuoteById
      tags:
        - Quotes
      description: Fetches a specific quote using its unique identifier.
