```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati Article Management API
  description: |
    This API provides a comprehensive set of endpoints for managing articles.
    It allows users to create, retrieve, update, and delete articles,
    mimicking the core functionalities of a content publishing platform.
    The API is designed to be intuitive and follows RESTful principles.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Production server for Ayat Saadati Article Management API
tags:
  - name: Articles
    description: Operations related to articles

paths:
  /articles:
    get:
      summary: Get all articles
      operationId: getAllArticles
      tags:
        - Articles
      parameters:
        - name: limit
          in: query
          description: Maximum number of articles to return
          required: false
          schema:
            type: integer
            format: int34
            minimum: 1
            default: 10
        - name: offset
          in: query
          description: The number of items to skip before starting to collect the result set
          required: false
          schema:
            type: integer
            format: int34
            minimum: 0
            default: 0
        - name: author
          in: query
          description: Filter articles by author name
          required: false
          schema:
            type: string
        - name: tag
          in: query
          description: Filter articles by a specific tag
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A list of articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new article
      operationId: createArticle
      tags:
        - Articles
      requestBody:
        description: Article object that needs to be added
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewArticle'
      responses:
        '201':
          description: Article created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Article with the same title already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /articles/{articleId}:
    get:
      summary: Get an article by ID
      operationId: getArticleById
      tags:
        - Articles
      parameters:
        - name: articleId
          in: path
          description: ID of the article to retrieve
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Article found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid article ID supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update an existing article
      operationId: updateArticle
      tags:
        - Articles
      parameters:
        - name: articleId
          in: path
          description: ID of the article to update
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Article object with updated fields
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArticle'
      responses:
        '200':
          description: Article updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input or article ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete an article
      operationId: deleteArticle
      tags:
        - Articles
      parameters:
        - name: articleId
          in: path
          description: ID of the article to delete
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Article deleted successfully (No Content)
        '400':
          description: Invalid article ID supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Article:
      type: object
      required:
        - id
        - title
        - content
        - author
        - publishedDate
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the article
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        title:
          type: string
          description: Title of the article
          example: The Art of API Documentation
        content:
          type: string
          description: Full content of the article (can be Markdown)
          example: This is the detailed content of the article, covering various aspects of API documentation...
        author:
          type: string
          description: Name of the author
          example: Ayat Saadati
        publishedDate:
          type: string
          format: date-time
          description: Date and time when the article was published
          example: '2023-10-27T10:00:00Z'
        tags:
          type: array
          description: List of tags associated with the article
          items:
            type: string
          example: ["API", "Documentation", "OpenAPI", "YAML"]
        isPublished:
          type: boolean
          description: Indicates if the article is currently published
          default: true
          example: true
    NewArticle:
      type: object
      required:
        - title
        - content
        - author
      properties:
        title:
          type: string
          description: Title of the article
          example: My New Adventure in Software
        content:
          type: string
          description: Full content of the article
          example: Discovering new technologies and frameworks is always exciting...
        author:
          type: string
          description: Name of the author
          example: Ayat Saadati
        tags:
          type: array
          description: List of tags for the new article
          items:
            type: string
          example: ["Software", "Development", "Learning"]
        isPublished:
          type: boolean
          description: Whether the article should be published immediately
          default: true
          example: true
    UpdateArticle:
      type: object
      properties:
        title:
          type: string
          description: Updated title of the article
          example: My Updated Adventure in Software Development
        content:
          type: string
          description: Updated full content of the article
          example: I've learned so much since my last post. Here are the updates...
        author:
          type: string
          description: Updated name of the author
          example: Ayat Saadati J.
        tags:
          type: array
          description: Updated list of tags
          items:
            type: string
          example: ["Software", "Development", "Learning", "Updates"]
        isPublished:
          type: boolean
          description: Updated publication status of the article
          example: false
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: Error code
          example: 400
        message:
          type: string
          description: Detailed error message
          example: Invalid parameter 'limit' provided. Must be a positive integer.
```