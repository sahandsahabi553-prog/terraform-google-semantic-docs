```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati Service API
  description: |
    Welcome to the Ayat Saadati Service API documentation. This API allows you to manage articles, users, and content related to the Ayat Saadati platform.
    Explore endpoints to create, retrieve, update, and delete various resources.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Production server for Ayat Saadati service
tags:
  - name: Articles
    description: Operations related to articles.
  - name: Users
    description: Operations related to users.
paths:
  /articles:
    get:
      summary: Get all articles
      operationId: getAllArticles
      tags:
        - Articles
      parameters:
        - name: limit
          in: query
          description: Maximum number of articles to return
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 10
        - name: offset
          in: query
          description: Number of articles to skip for pagination
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: A list of articles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new article
      operationId: createArticle
      tags:
        - Articles
      requestBody:
        description: Article object that needs to be added to the service
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewArticle'
      responses:
        '201':
          description: Article created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /articles/{articleId}:
    get:
      summary: Get an article by ID
      operationId: getArticleById
      tags:
        - Articles
      parameters:
        - name: articleId
          in: path
          description: ID of the article to retrieve
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Article details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          description: Article not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid article ID format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update an existing article
      operationId: updateArticle
      tags:
        - Articles
      parameters:
        - name: articleId
          in: path
          description: ID of the article to update
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Article object with updated fields
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArticle'
      responses:
        '200':
          description: Article updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input or article ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Article not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete an article
      operationId: deleteArticle
      tags:
        - Articles
      parameters:
        - name: articleId
          in: path
          description: ID of the article to delete
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Article deleted successfully.
        '404':
          description: Article not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid article ID format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/{userId}:
    get:
      summary: Get user profile by ID
      operationId: getUserById
      tags:
        - Users
      parameters:
        - name: userId
          in: path
          description: ID of the user to retrieve
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User profile details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid user ID format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Article:
      type: object
      required:
        - id
        - title
        - content
        - authorId
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the article.
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        title:
          type: string
          description: Title of the article.
          example: My First Article on Dev.to
        content:
          type: string
          description: Full content of the article (can be Markdown).
          example: This is the **full content** of my first article.
        authorId:
          type: string
          format: uuid
          description: ID of the author who wrote the article.
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the article was created.
          example: '2023-10-27T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the article was last updated.
          example: '2023-10-27T11:30:00Z'
    NewArticle:
      type: object
      required:
        - title
        - content
        - authorId
      properties:
        title:
          type: string
          description: Title of the new article.
          example: My Brand New Article
        content:
          type: string
          description: Full content of the new article.
          example: This is the content for a newly created article.
        authorId:
          type: string
          format: uuid
          description: ID of the author creating the article.
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
    UpdateArticle:
      type: object
      properties:
        title:
          type: string
          description: New title for the article.
          example: Updated Article Title
        content:
          type: string
          description: New content for the article.
          example: This article now has updated content.
    User:
      type: object
      required:
        - id
        - username
        - email
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the user.
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        username:
          type: string
          description: User's chosen username.
          example: ayat_saadat
        email:
          type: string
          format: email
          description: User's email address.
          example: ayat.saadat@example.com
        bio:
          type: string
          nullable: true
          description: Short biography of the user.
          example: Passionate about web development and open source.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the user account was created.
          example: '2022-01-15T08:00:00Z'
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: Error code.
          example: 400
        message:
          type: string
          description: A human-readable description of the error.
          example: Invalid input for article title.
```