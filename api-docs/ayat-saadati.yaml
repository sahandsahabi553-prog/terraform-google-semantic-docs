```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati Article Service
  description: |
    Welcome to the Ayat Saadati Article Service API documentation!

    This API allows you to manage articles for a developer blog or similar platform. You can create, retrieve, update, and delete articles, as well as manage their publication status.

    Built for developers, by developers.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Production server for Ayat Saadati
tags:
  - name: Articles
    description: Operations related to articles.
paths:
  /articles:
    get:
      tags:
        - Articles
      summary: Retrieve a list of articles
      description: Fetches a paginated list of articles. Can be filtered by author or tags.
      operationId: getArticles
      parameters:
        - name: limit
          in: query
          description: Maximum number of articles to return
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 10
        - name: offset
          in: query
          description: Number of articles to skip before starting to collect the result set
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: authorId
          in: query
          description: Filter articles by author ID
          required: false
          schema:
            type: integer
            format: int64
        - name: tag
          in: query
          description: Filter articles by a specific tag
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A list of articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
              examples:
                articlesList:
                  value:
                    - id: 101
                      title: "My First Article on OpenAPI"
                      content: "This is the content of my very first article about OpenAPI specification..."
                      authorId: 1
                      isPublished: true
                      tags: ["OpenAPI", "API Design", "Documentation"]
                      publishedAt: "2023-01-15T10:00:00Z"
                      updatedAt: "2023-01-15T10:00:00Z"
                    - id: 102
                      title: "The Joys of YAML for API Docs"
                      content: "Exploring the benefits and pitfalls of using YAML for API documentation..."
                      authorId: 1
                      isPublished: false
                      tags: ["YAML", "API Docs"]
                      publishedAt: "2023-02-20T14:30:00Z"
                      updatedAt: "2023-02-20T14:30:00Z"
        '400':
          description: Invalid query parameters supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Articles
      summary: Create a new article
      description: Adds a new article to the system. Requires authentication.
      operationId: createArticle
      security:
        - BearerAuth: []
      requestBody:
        description: Article object to be created
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleInput'
            examples:
              newArticle:
                value:
                  title: "New Article Title Here"
                  content: "The fascinating content of the new article goes here..."
                  authorId: 1
                  tags: ["New", "Example"]
                  isPublished: false
      responses:
        '201':
          description: Article created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
              examples:
                createdArticle:
                  value:
                    id: 103
                    title: "New Article Title Here"
                    content: "The fascinating content of the new article goes here..."
                    authorId: 1
                    isPublished: false
                    tags: ["New", "Example"]
                    publishedAt: "2023-03-01T09:00:00Z"
                    updatedAt: "2023-03-01T09:00:00Z"
        '400':
          description: Invalid input provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /articles/{articleId}:
    get:
      tags:
        - Articles
      summary: Retrieve a single article by ID
      description: Fetches a specific article using its unique ID.
      operationId: getArticleById
      parameters:
        - name: articleId
          in: path
          description: ID of the article to retrieve
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Article found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
              examples:
                singleArticle:
                  value:
                    id: 101
                    title: "My First Article on OpenAPI"
                    content: "This is the content of my very first article about OpenAPI specification..."
                    authorId: 1
                    isPublished: true
                    tags: ["OpenAPI", "API Design", "Documentation"]
                    publishedAt: "2023-01-15T10:00:00Z"
                    updatedAt: "2023-01-15T10:00:00Z"
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Articles
      summary: Update an existing article
      description: Updates an existing article identified by its ID. Requires authentication.
      operationId: updateArticle
      security:
        - BearerAuth: []
      parameters:
        - name: articleId
          in: path
          description: ID of the article to update
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Article object with updated fields
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleUpdate'
            examples:
              updateArticleRequest:
                value:
                  title: "Updated Article Title"
                  content: "This is the revised content of the article."
                  authorId: 1
                  tags: ["OpenAPI", "Updated"]
                  isPublished: true
      responses:
        '200':
          description: Article updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
              examples:
                updatedArticleResponse:
                  value:
                    id: 101
                    title: "Updated Article Title"
                    content: "This is the revised content of the article."
                    authorId: 1
                    isPublished: true
                    tags: ["OpenAPI", "Updated"]
                    publishedAt: "2023-01-15T10:00:00Z"
                    updatedAt: "2023-03-01T15:00:00Z"
        '400':
          description: Invalid input provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Articles
      summary: Delete an article
      description: Removes an article from the system by its ID. Requires authentication.
      operationId: deleteArticle
      security:
        - BearerAuth: []
      parameters:
        - name: articleId
          in: path
          description: ID