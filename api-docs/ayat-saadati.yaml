```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati Content API
  description: |
    This API provides access to manage articles, posts, and other content for Ayat Saadati's platform.
    It supports creating, retrieving, updating, and deleting content items.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Development server for Ayat Saadati content
paths:
  /posts:
    get:
      summary: Retrieve a list of all posts
      operationId: getPosts
      parameters:
        - name: limit
          in: query
          description: How many posts to return at one time (max 100)
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: The number of items to skip before starting to collect the result set
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: A list of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new post
      operationId: createPost
      requestBody:
        description: Post object that needs to be added to the store
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPost'
      responses:
        '201':
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Invalid input provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /posts/{postId}:
    parameters:
      - name: postId
        in: path
        description: ID of the post to retrieve or modify
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Retrieve a single post by ID
      operationId: getPostById
      responses:
        '200':
          description: Post details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update an existing post
      operationId: updatePost
      requestBody:
        description: Post object with updated fields
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePost'
      responses:
        '200':
          description: Post updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Invalid input provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a post
      operationId: deletePost
      responses:
        '204':
          description: Post deleted successfully (No Content)
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/{userId}/posts:
    parameters:
      - name: userId
        in: path
        description: ID of the user whose posts are to be retrieved
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Retrieve all posts by a specific user
      operationId: getPostsByUser
      responses:
        '200':
          description: A list of posts by the specified user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Post:
      type: object
      required:
        - id
        - title
        - content
        - authorId
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the post
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        title:
          type: string
          description: Title of the post
          example: My First Blog Post
        content:
          type: string
          description: Full content of the post, can be in Markdown or HTML
          example: This is the **rich content** of my first post.
        authorId:
          type: string
          format: uuid
          description: ID of the author who created the post
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        tags:
          type: array
          items:
            type: string
          description: List of tags associated with the post
          example: ["programming", "webdev", "openapi"]
        status:
          type: string
          description: Current status of the post (e.g., draft, published, archived)
          enum:
            - draft
            - published
            - archived
          default: draft
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the post was created
          example: 2023-10-26T10:00:00Z
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the post was last updated
          example: 2023-10-26T10:30:00Z
    NewPost:
      type: object
      required:
        - title
        - content
        - authorId
      properties:
        title:
          type: string
          description: Title of the post
          example: My New Blog Post Idea
        content:
          type: string
          description: Full content of the post
          example: This is the draft content for my new article.
        authorId:
          type: string
          format: uuid
          description: ID of the author creating the post
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        tags:
          type: array
          items:
            type: string
          description: List of tags for the new post
          example: ["technology", "ai"]
        status:
          type: string
          description: Initial status of the post
          enum:
            - draft
            - published
          default: draft
    UpdatePost:
      type: object
      properties:
        title:
          type: string
          description: Updated title of the post
          example: My Updated Blog Post Title
        content:
          type: string
          description: Updated full content of the post
          example: This content has been updated with new information.
        tags:
          type: array
          items:
            type: string
          description: Updated list of tags for the post
          example: ["technology", "ai", "machine learning"]
        status:
          type: string
          description: New status of the post
          enum:
            - draft
            - published
            - archived
          example: published
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: Error code
          example: 400
        message:
          type: string
          description: Human-readable error message
          example: Invalid input parameters.
```