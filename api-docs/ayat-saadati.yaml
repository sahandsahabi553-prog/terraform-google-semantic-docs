```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati Content Service API
  description: |
    Welcome to the Ayat Saadati Content Service API documentation.
    This API allows you to manage blog posts, articles, and related content.
    You can create, retrieve, update, and delete posts, as well as interact with other content entities.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Development server for Ayat Saadati service
tags:
  - name: Posts
    description: Operations related to blog posts and articles.
  - name: Categories
    description: Operations related to content categories.
paths:
  /posts:
    get:
      summary: Retrieve a list of all posts
      operationId: getAllPosts
      tags:
        - Posts
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
          description: Maximum number of posts to return.
          example: 10
        - in: query
          name: offset
          schema:
            type: integer
            format: int32
            minimum: 0
          description: Number of posts to skip before starting to collect the result set.
          example: 0
        - in: query
          name: categoryId
          schema:
            type: string
            format: uuid
          description: Filter posts by category ID.
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
      responses:
        '200':
          description: A paginated list of posts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new post
      operationId: createPost
      tags:
        - Posts
      requestBody:
        description: Post object to be created.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPost'
      responses:
        '201':
          description: Post successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Invalid input provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized to create a post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /posts/{postId}:
    get:
      summary: Retrieve a single post by ID
      operationId: getPostById
      tags:
        - Posts
      parameters:
        - in: path
          name: postId
          schema:
            type: string
            format: uuid
          required: true
          description: ID of the post to retrieve.
          example: 5d2b77a2-1a4a-4a7b-8c7a-9a0d8e1f2c3d
      responses:
        '200':
          description: Post details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Post not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update an existing post
      operationId: updatePost
      tags:
        - Posts
      parameters:
        - in: path
          name: postId
          schema:
            type: string
            format: uuid
          required: true
          description: ID of the post to update.
          example: 5d2b77a2-1a4a-4a7b-8c7a-9a0d8e1f2c3d
      requestBody:
        description: Post object with updated fields.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePost'
      responses:
        '200':
          description: Post successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Invalid input provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized to update this post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - not authorized to modify this post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a post
      operationId: deletePost
      tags:
        - Posts
      parameters:
        - in: path
          name: postId
          schema:
            type: string
            format: uuid
          required: true
          description: ID of the post to delete.
          example: 5d2b77a2-1a4a-4a7b-8c7a-9a0d8e1f2c3d
      responses:
        '204':
          description: Post successfully deleted.
        '401':
          description: Unauthorized to delete this post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - not authorized to delete this post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /categories:
    get:
      summary: Retrieve a list of all categories
      operationId: getAllCategories
      tags:
        - Categories
      responses:
        '200':
          description: A list of content categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Post:
      type: object
      required:
        - id
        - title
        - content
        - authorId
        - categoryId
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the post.
          readOnly: true
          example: 5d2b77a2-1a4a-4a7b-8c7a-9a0d8e1f2c3d
        title:
          type: string
          description: Title of the post.
          example: My First Ayat Saadati Post
        content:
          type: string
          description: Full content of the post, can be HTML or Markdown.
          example: This is the **amazing** content of my first post.
        authorId:
          type: string
          format: uuid
          description: ID of the user who authored the post.
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        categoryId:
          type: string
          format: uuid
          description: ID of the category the post belongs to.
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        tags:
          type: array
          items:
            type: string
          description: A list of tags associated with the post.
          example: ["blog", "saadati", "first-post"]
        createdAt:
          type: string
          format: date-time
          description: Date and time when the post was created.
          readOnly: true
          example: '2023-10-27T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Date and time when the post was last updated.
          readOnly: true
          example: '2023-10-27T10:30:00Z'
    NewPost:
      type: object
      required:
        - title
        - content
        - authorId
        - categoryId
      properties:
        title:
          type: string
          description: Title of the new post.
          example: My Brand New Article
        content:
          type: string
          description: Full content of the new post.
          example: This is the detailed content for the brand new article, written in markdown.
        authorId:
          type: string
          format: uuid
          description: ID of the user creating the post.
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        categoryId:
          type: string
          format: uuid
          description: ID of the category this post belongs to.
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        tags:
          type: array
          items:
            type: string
          description: Optional list of tags for the post.
          example: ["new", "article", "tech"]
    UpdatePost:
      type: object
      properties:
        title:
          type: string
          description: New title for the post.
          example: My Updated Article Title
        content:
          type: string
          description: New content for the post.
          example: This article has been updated with new information.
        categoryId:
          type: string
          format: uuid
          description: New category ID for the post.
          example: f1e2d3c4-b5a6-7890-1234-567890abcdef
        tags:
          type: array
          items:
            type: string
          description: Updated list of tags for the post.
          example: ["updated", "article", "revision"]
    Category:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the category.
          readOnly: true
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        name:
          type: string
          description: Name of the category.
          example: Technology
        description:
          type: string
          description: A brief description of the category.
          example: Articles related to software development, hardware, and digital trends.
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: A unique error code.
          example: 'POST_NOT_FOUND'
        message:
          type: string
          description: A human-readable error message.
          example: The requested post could not be found.
```