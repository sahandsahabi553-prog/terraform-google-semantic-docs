```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati Article Service API
  description: |
    API documentation for the Ayat Saadati service, allowing management of articles.
    This service provides endpoints to create, retrieve, update, and delete articles,
    mimicking core functionalities found on platforms like dev.to.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Production server for Ayat Saadati service
tags:
  - name: Articles
    description: Operations related to articles
paths:
  /articles:
    get:
      tags:
        - Articles
      summary: Retrieve a list of all articles
      description: Returns a list of all available articles, optionally filtered.
      operationId: getAllArticles
      parameters:
        - name: authorId
          in: query
          description: Filter articles by author ID
          required: false
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          description: Maximum number of articles to return
          required: false
          schema:
            type: integer
            format: int32
            default: 10
      responses:
        '200':
          description: A list of articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Articles
      summary: Create a new article
      description: Adds a new article to the service.
      operationId: createArticle
      requestBody:
        description: Article object to be created
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewArticle'
      responses:
        '201':
          description: Article created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /articles/{articleId}:
    get:
      tags:
        - Articles
      summary: Retrieve a single article by ID
      description: Returns a specific article based on its unique ID.
      operationId: getArticleById
      parameters:
        - $ref: '#/components/parameters/articleId'
      responses:
        '200':
          description: An article object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Articles
      summary: Update an existing article
      description: Updates the details of an existing article identified by its ID.
      operationId: updateArticle
      parameters:
        - $ref: '#/components/parameters/articleId'
      requestBody:
        description: Updated article object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatedArticle'
      responses:
        '200':
          description: Article updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Articles
      summary: Delete an article
      description: Deletes an article from the service based on its ID.
      operationId: deleteArticle
      parameters:
        - $ref: '#/components/parameters/articleId'
      responses:
        '204':
          description: Article deleted successfully (No Content)
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Article:
      type: object
      required:
        - id
        - title
        - content
        - authorId
        - publishedAt
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the article
          example: 12345
        title:
          type: string
          description: Title of the article
          example: "My First Post on Ayat Saadati"
        content:
          type: string
          description: Full content of the article (markdown or HTML)
          example: "This is the **amazing** content of my first post. It's truly wonderful."
        authorId:
          type: integer
          format: int64
          description: ID of the author who published the article
          example: 101
        publishedAt:
          type: string
          format: date-time
          description: Date and time when the article was published
          example: "2023-10-27T10:00:00Z"
    NewArticle:
      type: object
      required:
        - title
        - content
        - authorId
      properties:
        title:
          type: string
          description: Title of the article
          example: "My New Draft Article"
        content:
          type: string
          description: Full content of the article (markdown or HTML)
          example: "This is a draft content that will be published soon."
        authorId:
          type: integer
          format: int64
          description: ID of the author publishing the article
          example: 101
    UpdatedArticle:
      type: object
      properties:
        title:
          type: string
          description: New title for the article
          example: "Updated Title for My Article"
        content:
          type: string
          description: New content for the article (markdown or HTML)
          example: "This is the updated content, fixing some typos and adding new information."
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: Error code
          example: 400
        message:
          type: string
          description: Detailed error message
          example: "Invalid input provided."
  parameters:
    articleId:
      name: articleId
      in: path
      description: The unique ID of the article
      required: true
      schema:
        type: integer
        format: int64
```