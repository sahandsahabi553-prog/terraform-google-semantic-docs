```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati API
  description: |
    Welcome to the Ayat Saadati API documentation. This API provides programmatic access to manage articles, 
    comments, and user profiles on the Ayat Saadati platform hosted on dev.to.

    Explore the endpoints below to interact with your content programmatically.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Production server for Ayat Saadati
paths:
  /articles:
    get:
      summary: Get all articles
      operationId: getArticles
      parameters:
        - name: limit
          in: query
          description: Maximum number of articles to return
          required: false
          schema:
            type: integer
            minimum: 1
            default: 10
        - name: offset
          in: query
          description: Number of articles to skip for pagination
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: A list of articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new article
      operationId: createArticle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleCreate'
      responses:
        '201':
          description: Article created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /articles/{articleId}:
    get:
      summary: Get an article by ID
      operationId: getArticleById
      parameters:
        - name: articleId
          in: path
          description: ID of the article to retrieve
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Article details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update an article by ID
      operationId: updateArticleById
      parameters:
        - name: articleId
          in: path
          description: ID of the article to update
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleUpdate'
      responses:
        '200':
          description: Article updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - User not authorized to update this article
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete an article by ID
      operationId: deleteArticleById
      parameters:
        - name: articleId
          in: path
          description: ID of the article to delete
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Article deleted successfully (No content)
        '401':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - User not authorized to delete this article
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /articles/{articleId}/comments:
    post:
      summary: Add a comment to an article
      operationId: addCommentToArticle
      parameters:
        - name: articleId
          in: path
          description: ID of the article to add a comment to
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreate'
      responses:
        '201':
          description: Comment added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: Invalid input provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Article:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the article
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        title:
          type: string
          description: Title of the article
          example: My First Post on Ayat Saadati
        content:
          type: string
          description: Full content of the article (Markdown supported)
          example: This is the **amazing** content of my first post!
        authorId:
          type: string
          format: uuid
          description: ID of the author who wrote the article
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        tags:
          type: array
          items:
            type: string
          description: List of tags associated with the article
          example: ["programming", "webdev", "thoughts"]
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the article was created
          example: '2023-10-26T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the article was last updated
          example: '2023-10-26T12:30:00Z'
      required:
        - id
        - title
        - content
        - authorId
        - createdAt
    ArticleCreate:
      type: object
      properties:
        title:
          type: string
          description: Title of the article
          example: My New Awesome Article
          minLength: 5
        content:
          type: string
          description: Full content of the article (Markdown supported)
          example: This is the **exciting** content of my new article!
          minLength: 20
        authorId:
          type: string
          format: uuid
          description: ID of the author creating the article
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        tags:
          type: array
          items:
            type: string
          description: List of tags for the article
          example: ["tech", "innovation"]
      required:
        - title
        - content
        - authorId
    ArticleUpdate:
      type: object
      properties:
        title:
          type: string
          description: New title for the article
          example: An Updated Article Title
          minLength: 5
        content:
          type: string
          description: New content for the article (Markdown supported)
          example: This is the **revised** content of the article.
          minLength: 20
        tags:
          type: array
          items:
            type: string
          description: Updated list of tags for the article
          example: ["tech", "updates", "refactor"]
    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the comment
          example: 0e3f8a7b-1c2d-3e4f-5a6b-7c8d9e0f1a2b
        articleId:
          type: string
          format: uuid
          description: ID of the article the comment belongs to
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        authorId:
          type: string
          format: uuid
          description: ID of the user who made the comment
          example: b2c3d4e5-f6a7-8b9c-0d1e-2f3a4b5c6d7e
        content:
          type: string
          description: The actual comment text
          example: Great article! Very insightful.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the comment was created
          example: '2023-10-26T15:00:00Z'
      required:
        - id
        - articleId
        - authorId
        - content
        - createdAt
    CommentCreate:
      type: object
      properties:
        authorId:
          type: string
          format: uuid
          description: ID of the user creating the comment
          example: b2c3d4e5-f6a7-8b9c-0d1e-2f3a4b5c6d7e
        content:
          type: string
          description: The comment text
          example: I really enjoyed reading this!
          minLength: 3
      required:
        - authorId
        - content
    Error:
      type: object
      properties:
        code:
          type: string
          description: A unique error code
          example: 'ARTICLE_NOT_FOUND'
        message:
          type: string
          description: A human-readable description of the error
          example: 'The article with the specified ID could not be found.'
```