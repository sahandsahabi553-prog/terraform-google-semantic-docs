```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati API
  description: |
    API for managing content, posts, and user interactions for the Ayat Saadati platform.
    This API provides endpoints to create, retrieve, update, and delete posts, as well as manage comments on these posts.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Development server for Ayat Saadati
tags:
  - name: Posts
    description: Operations related to blog posts or content items.
  - name: Comments
    description: Operations related to comments on posts.
paths:
  /posts:
    get:
      summary: Retrieve a list of all posts
      operationId: getPosts
      tags:
        - Posts
      parameters:
        - name: limit
          in: query
          description: How many posts to return at one time (max 100)
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Offset for pagination
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: A list of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new post
      operationId: createPost
      tags:
        - Posts
      requestBody:
        description: Post object to be created
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPost'
      responses:
        '201':
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Invalid input provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /posts/{postId}:
    get:
      summary: Retrieve a specific post by ID
      operationId: getPostById
      tags:
        - Posts
      parameters:
        - name: postId
          in: path
          description: ID of the post to retrieve
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update an existing post
      operationId: updatePost
      tags:
        - Posts
      parameters:
        - name: postId
          in: path
          description: ID of the post to update
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Post object with updated fields
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePost'
      responses:
        '200':
          description: Post updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Invalid input provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a post
      operationId: deletePost
      tags:
        - Posts
      parameters:
        - name: postId
          in: path
          description: ID of the post to delete
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Post deleted successfully (No Content)
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /posts/{postId}/comments:
    post:
      summary: Add a comment to a specific post
      operationId: addCommentToPost
      tags:
        - Comments
      parameters:
        - name: postId
          in: path
          description: ID of the post to add a comment to
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Comment object to be added
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewComment'
      responses:
        '201':
          description: Comment added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: Invalid input provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Post:
      type: object
      properties:
        id: