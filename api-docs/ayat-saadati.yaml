```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati Article Management API
  description: |
    This API provides a comprehensive set of endpoints for managing articles and user interactions on the Ayat Saadati platform.
    It supports creating, retrieving, updating, and deleting articles, as well as fetching user-specific content.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Production server for Ayat Saadati
tags:
  - name: Articles
    description: Operations related to articles/posts
  - name: Users
    description: Operations related to users
paths:
  /articles:
    get:
      tags:
        - Articles
      summary: Retrieve a list of all articles
      description: Returns a list of all published articles, optionally filtered or paginated.
      parameters:
        - name: limit
          in: query
          description: Maximum number of articles to return
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 10
        - name: offset
          in: query
          description: Number of articles to skip before starting to collect the result set
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: A list of articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Articles
      summary: Create a new article
      description: Allows a user to publish a new article to the platform.
      requestBody:
        description: Article object to be created
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewArticle'
      responses:
        '201':
          description: Article created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /articles/{articleId}:
    get:
      tags:
        - Articles
      summary: Retrieve a single article by ID
      description: Returns the details of a specific article using its unique ID.
      parameters:
        - name: articleId
          in: path
          description: ID of the article to retrieve
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Article details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Articles
      summary: Update an existing article
      description: Modifies the details of an existing article identified by its ID.
      parameters:
        - name: articleId
          in: path
          description: ID of the article to update
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Article object with updated fields
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArticle'
      responses:
        '200':
          description: Article updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Articles
      summary: Delete an article
      description: Removes an article from the platform using its unique ID.
      parameters:
        - name: articleId
          in: path
          description: ID of the article to delete
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Article deleted successfully (No Content)
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/{userId}/articles:
    get:
      tags:
        - Users
        - Articles
      summary: Retrieve articles by a specific user
      description: Returns a list of all articles published by a given user ID.
      parameters:
        - name: userId
          in: path
          description: ID of the user whose articles to retrieve
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Maximum number of articles to return
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 10
      responses:
        '200':
          description: A list of articles by the specified user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Article:
      type: object
      required:
        - id
        - title
        - content
        - authorId
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the article
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        title:
          type: string
          description: Title of the article
          example: My First Article on Ayat Saadati
        content:
          type: string
          description: The full content of the article, typically in Markdown or HTML
          example: "## Introduction\nThis is the content of my first article...\n"
        authorId:
          type: string
          format: uuid
          description: Unique identifier of the article's author
          example: 0a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
        tags:
          type: array
          description: List of tags associated with the article
          items:
            type: string
          example: ["programming", "webdev", "tutorial"]
        createdAt:
          type: string
          format: date-time
          description: Date and time the article was created
          example: "2023-10-27T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          description: Date and time the article was last updated
          example: "2023-10-27T11:30:00Z"
    NewArticle:
      type: object
      required:
        - title
        - content
        - authorId
      properties:
        title:
          type: string
          description: Title of the article
          example: My Second Article
        content:
          type: string
          description: The full content of the article, typically in Markdown or HTML
          example: "### Getting Started\nAnother great article here.\n"
        authorId:
          type: string
          format: uuid
          description: Unique identifier of the article's author
          example: 0a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
        tags:
          type: array
          description: List of tags associated with the article
          items:
            type: string
          example: ["javascript", "backend"]
    UpdateArticle:
      type: object
      properties:
        title:
          type: string
          description: New title for the article
          example: My Updated Article Title
        content:
          type: string
          description: New content for the article
          example: "Updated content for the article, fixing some typos."
        tags:
          type: array
          description: New list of tags for the article
          items:
            type: string
          example: ["programming", "refactored"]
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: A unique error code
          example: ARTICLE_NOT_FOUND
        message:
          type: string
          description: A human-readable error message
          example: The requested article could not be found.
```