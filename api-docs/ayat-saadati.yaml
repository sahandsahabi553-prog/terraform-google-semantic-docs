```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati Content Management API
  description: |
    This API provides access to manage articles, posts, and other content for Ayat Saadati's platform.
    It allows for creation, retrieval, updates, and deletion of content items.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Production server for Ayat Saadati's platform
tags:
  - name: Articles
    description: Operations related to articles and blog posts.
  - name: Categories
    description: Managing content categories.
paths:
  /articles:
    get:
      tags:
        - Articles
      summary: Retrieve a list of articles
      description: Returns a paginated list of all articles available on the platform.
      operationId: listArticles
      parameters:
        - name: limit
          in: query
          description: How many articles to return at one time (max 100)
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: The number of items to skip before starting to collect the result set
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: A list of articles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Articles
      summary: Create a new article
      description: Adds a new article to the platform.
      operationId: createArticle
      requestBody:
        description: Article object to be created.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleInput'
      responses:
        '201':
          description: Article created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /articles/{articleId}:
    get:
      tags:
        - Articles
      summary: Retrieve a single article by ID
      description: Returns a specific article based on its unique ID.
      operationId: getArticleById
      parameters:
        - name: articleId
          in: path
          description: ID of the article to retrieve.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested article.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          description: Article not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Articles
      summary: Update an existing article
      description: Updates the details of an existing article identified by its ID.
      operationId: updateArticle
      parameters:
        - name: articleId
          in: path
          description: ID of the article to update.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Article object with updated fields.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleInput'
      responses:
        '200':
          description: Article updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Article not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Articles
      summary: Delete an article
      description: Deletes an article from the platform using its ID.
      operationId: deleteArticle
      parameters:
        - name: articleId
          in: path
          description: ID of the article to delete.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Article deleted successfully (No Content).
        '404':
          description: Article not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /categories:
    get:
      tags:
        - Categories
      summary: Retrieve a list of content categories
      description: Returns a list of all available categories for articles.
      operationId: listCategories
      responses:
        '200':
          description: A list of categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Article:
      type: object
      required:
        - id
        - title
        - content
        - authorId
        - publishedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the article.
          readOnly: true
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        title:
          type: string
          description: The title of the article.
          example: My First Blog Post
        slug:
          type: string
          description: URL-friendly version of the article title.
          example: my-first-blog-post
        content:
          type: string
          description: The full content of the article, usually in Markdown or HTML.
          example: "# Hello World\nThis is the *content* of my first blog post."
        authorId:
          type: string
          format: uuid
          description: The unique identifier of the article's author.
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        category:
          type: string
          description: The category the article belongs to.
          example: Technology
        tags:
          type: array
          items:
            type: string
          description: List of tags associated with the article.
          example: ["blogging", "tutorial", "webdev"]
        publishedAt:
          type: string
          format: date-time
          description: The date and time when the article was published.
          readOnly: true
          example: "2023-10-27T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          description: The date and time when the article was last updated.
          readOnly: true
          example: "2023-10-27T11:30:00Z"
    ArticleInput:
      type: object
      required:
        - title
        - content
        - authorId
      properties:
        title:
          type: string
          description: The title of the article.
          example: My First Blog Post
          minLength: 5
          maxLength: 255
        slug:
          type: string
          description: URL-friendly version of the article title. Auto-generated if not provided.
          example: my-first-blog-post
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        content:
          type: string
          description: The full content of the article, usually in Markdown or HTML.
          example: "# Hello World\nThis is the *content* of my first blog post."
          minLength: 10
        authorId:
          type: string
          format: uuid
          description: The unique identifier of the article's author.
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        category:
          type: string
          description: The category the article belongs to.
          example: Technology
        tags:
          type: array
          items:
            type: string
          description: List of tags associated with the article.
          example: ["blogging", "tutorial", "webdev"]
    Category:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the category.
          readOnly: true
          example: c1d2e3f4-g5h6-7890-1234-567890abcdef
        name:
          type: string
          description: The name of the category.
          example: Web Development
        slug:
          type: string
          description: URL-friendly version of the category name.
          example: web-development
        description:
          type: string
          description: A brief description of the category.
          example: Articles related to web development technologies and practices.
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: Application-specific error code.
          example: 1001
        message:
          type: string
          description: A human-readable explanation of the error.
          example: Article with ID 'd290f1ee-6c54-4b01-90e6-d701748f0851' not found.
```