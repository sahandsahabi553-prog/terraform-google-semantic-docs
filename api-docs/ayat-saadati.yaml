openapi: 3.0.0
info:
  title: Ayat Saadati API
  description: |
    API for managing inspirational quotes and "ayat" (verses/signs), providing comprehensive CRUD operations
    and convenient retrieval methods like getting a random quote.
    This service aims to store, categorize, and serve meaningful text snippets.

