```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati Article Management API
  description: |
    Welcome to the Ayat Saadati Article Management API! This API provides a comprehensive set of endpoints
    for creating, retrieving, updating, and deleting articles. It supports managing the lifecycle of articles,
    from draft to published, and allows for efficient content management.

    The API is designed to be RESTful, using standard HTTP methods for operations and
    JSON for data transfer.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Production server for Ayat Saadati API
paths:
  /articles:
    get:
      summary: Retrieve a list of articles
      description: Returns a list of all articles, with optional filtering capabilities.
      operationId: getArticles
      parameters:
        - name: status
          in: query
          description: Filter articles by their publication status.
          required: false
          schema:
            type: string
            enum:
              - draft
              - published
              - archived
        - name: authorId
          in: query
          description: Filter articles by the ID of the author.
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A list of articles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
        '400':
          description: Invalid query parameters provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new article
      description: Creates a new article in the system. The article will initially be in 'draft' status unless specified otherwise.
      operationId: createArticle
      requestBody:
        description: Article object to be created.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewArticle'
      responses:
        '201':
          description: Article created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid article data provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /articles/{articleId}:
    get:
      summary: Retrieve a specific article
      description: Returns a single article identified by its unique ID.
      operationId: getArticleById
      parameters:
        - name: articleId
          in: path
          description: The unique identifier of the article.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The article details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          description: Article not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update an existing article
      description: Updates all fields of an existing article identified by its unique ID.
      operationId: updateArticle
      parameters:
        - name: articleId
          in: path
          description: The unique identifier of the article to update.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Article object with updated fields. All fields are required for a full update.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArticle'
      responses:
        '200':
          description: Article updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid article data provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Article not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete an article
      description: Deletes an article identified by its unique ID. This action is irreversible.
      operationId: deleteArticle
      parameters:
        - name: articleId
          in: path
          description: The unique identifier of the article to delete.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Article deleted successfully (No Content).
        '404':
          description: Article not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Article:
      type: object
      required:
        - id
        - title
        - content
        - authorId
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier of the article.
          readOnly: true
        title:
          type: string
          description: The title of the article.
          minLength: 5
          maxLength: 255
        content:
          type: string
          description: The main body content of the article.
          minLength: 10
        authorId:
          type: string
          format: uuid
          description: The unique identifier of the article's author.
        status:
          type: string
          description: The current publication status of the article.
          enum:
            - draft
            - published
            - archived
          default: draft
        createdAt:
          type: string
          format: date-time
          description: The timestamp when the article was first created.
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: The timestamp when the article was last updated.
          readOnly: true
      example:
        id: "d290f1ee-6c54-4b01-90e6-d701748f0851"
        title: "Introduction to OpenAPI 3.0"
        content: "OpenAPI 3.0 is a specification for machine-readable interface files for describing, producing, consuming, and visualizing RESTful web services."
        authorId: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
        status: "published"
        createdAt: "2023-01-15T10:00:00Z"
        updatedAt: "2023-01-15T11:30:00Z"
    NewArticle:
      type: object
      required:
        - title
        - content
        - authorId
      properties:
        title:
          type: string
          description: The title of the new article.
          minLength: 5
          maxLength: 255
        content:
          type: string
          description: The main body content of the new article.
          minLength: 10
        authorId:
          type: string
          format: uuid
          description: The unique identifier of the author creating the article.
        status:
          type: string
          description: The initial publication status of the article. Defaults to 'draft'.
          enum:
            - draft
            - published
          default: draft
      example:
        title: "Getting Started with Ayat Saadati"
        content: "This article provides a quick guide to understanding the Ayat Saadati platform and its core functionalities."
        authorId: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
        status: "draft"
    UpdateArticle:
      type: object
      required:
        - title
        - content
        - authorId
        - status
      properties:
        title:
          type: string
          description: The updated title of the article.
          minLength: 5
          maxLength: 255
        content:
          type: string
          description: The updated main body content of the article.
          minLength: 10
        authorId:
          type: string
          format: uuid
          description: The updated unique identifier of the article's author.
        status:
          type: string
          description: The updated publication status of the article.
          enum:
            - draft
            - published
            - archived
      example:
        title: "Updated Guide to Ayat Saadati Features"
        content: "This article has been revised to include the latest features and best practices for the Ayat Saadati platform."
        authorId: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
        status: "published"
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: A unique error code.
        message:
          type: string
          description: A human-readable description of the error.
      example:
        code: 404
        message: "Article with ID 'd290f1ee-6c54-4b01-90e6-d701748f0851' not found."
```