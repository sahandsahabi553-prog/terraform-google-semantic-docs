```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati Service API
  description: API documentation for the Ayat Saadati content platform. This service enables users to manage articles, comments, and related resources on the Ayat Saadati blog.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Production server for Ayat Saadati
tags:
  - name: Articles
    description: Operations related to articles (blog posts)
  - name: Comments
    description: Operations related to article comments
paths:
  /articles:
    get:
      tags:
        - Articles
      summary: Retrieve a list of articles
      description: Returns a paginated list of all articles published on the Ayat Saadati platform.
      parameters:
        - name: limit
          in: query
          description: Maximum number of articles to return
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Number of articles to skip for pagination
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: A successful response with a list of articles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Articles
      summary: Create a new article
      description: Publishes a new article to the Ayat Saadati platform.
      requestBody:
        description: Article object that needs to be created.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleInput'
      responses:
        '201':
          description: Article created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input provided (e.g., missing required fields, invalid format).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /articles/{articleId}:
    get:
      tags:
        - Articles
      summary: Retrieve a single article by ID
      description: Returns the details of a specific article using its unique identifier.
      parameters:
        - name: articleId
          in: path
          description: Unique ID of the article to retrieve.
          required: true
          schema:
            type: string
            format: uuid
            example: d290f1ee