```yaml
openapi: 3.0.3
info:
  title: Ayat Saadati Service
  description: Centralized API for managing Ayat Saadati's professional profile, articles, and interactions.
  version: 1.0.0
  contact:
    name: API Support
    email: support@ayatsaadati.dev
servers:
  - url: https://dev.to/ayat_saadati
    description: Production server
tags:
  - name: Profile
    description: Operations related to the user profile
  - name: Articles
    description: CRUD operations on articles
  - name: Bookmarks
    description: Save and manage bookmarked articles
paths:
  /profile:
    get:
      tags:
        - Profile
      summary: Get public profile
      operationId: getProfile
      responses:
        '200':
          description: Profile data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404':
          $ref: '#/components/responses/NotFound'
  /articles:
    get:
      tags:
        - Articles
      summary: List articles
      operationId: listArticles
      parameters:
        - $ref: '#/components/parameters/limitQuery'
        - $ref: '#/components/parameters/offsetQuery'
      responses:
        '200':
          description: Paginated article list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Article'
                  total:
                    type: integer
                    example: 42
    post:
      tags:
        - Articles
      summary: Publish new article
      operationId: createArticle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
  /articles/{id}:
    parameters:
      - $ref: '#/components/parameters/articleId'
    get:
      tags:
        - Articles
      summary: Get single article
      operationId: getArticle
      responses:
        '200':
          description: Article details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Articles
      summary: Update article
      operationId: updateArticle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Articles
      summary: Delete article
      operationId: deleteArticle
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /bookmarks:
    get:
      tags:
        - Bookmarks
      summary: List bookmarked articles
      operationId: listBookmarks
      parameters:
        - $ref: '#/components/parameters/limitQuery'
        - $ref: '#/components/parameters/offsetQuery'
      responses:
        '200':
          description: Bookmarked articles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Article'
                  total:
                    type: integer
                    example: 7
    post:
      tags:
        - Bookmarks
      summary: Bookmark an article
      operationId: addBookmark
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - articleId
              properties:
                articleId:
                  type: string
                  format: uuid
                  example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '201':
          description: Bookmarked
        '409':
          description: Already bookmarked
components:
  parameters:
    articleId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    limitQuery:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    offsetQuery:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
  schemas:
    Profile:
      type: object
      properties:
        username:
          type: string
          example: ayat_saadati
        name:
          type: string
          example: Ayat Saadati
        bio:
          type: string
          example: Software engineer & technical writer
        followers:
          type: integer
          example: 1250
        following:
          type: integer
          example: 300
    Article:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: Advanced OpenAPI Patterns
        slug:
          type: string
          example: advanced-openapi-patterns
        description:
          type: string
          example: Deep dive into reusable components
        tags:
          type: array
          items:
            type: string
          example: [openapi, api-design]
        publishedAt:
          type: string
          format: date-time
        readingTime:
          type: integer
          description: Estimated minutes to read
          example: 5
    ArticleInput:
      type: object
      required:
        - title
        - bodyMarkdown
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          maxLength: 300
        bodyMarkdown:
          type: string
        tags:
          type: array
          items:
            type: string
            maxLength: 20
          maxItems: 4
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Resource not found
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Invalid input
    Unauthorized:
      description: Authentication required
```