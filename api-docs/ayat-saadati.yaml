```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati Service API
  description: |-
    This API provides access to resources managed by the Ayat Saadati service,
    allowing users to interact with posts, manage content, and perform various operations.
    It supports creating, retrieving, updating, and deleting posts.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Development server for Ayat Saadati Service
tags:
  - name: Posts
    description: Operations related to blog posts and articles.
  - name: Health
    description: API health check endpoint.
paths:
  /health:
    get:
      summary: Check API Health
      operationId: getApiHealth
      tags:
        - Health
      responses:
        '200':
          description: API is up and running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  timestamp:
                    type: string
                    format: date-time
                    example: "2023-10-27T10:00:00Z"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /posts:
    get:
      summary: Retrieve a list of posts
      operationId: getAllPosts
      tags:
        - Posts
      parameters:
        - name: limit
          in: query
          description: Maximum number of posts to return
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 10
        - name: offset
          in: query
          description: Number of posts to skip before starting to return results
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: A list of posts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new post
      operationId: createPost
      tags:
        - Posts
      requestBody:
        description: Post object to be created
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPost'
      responses:
        '201':
          description: Post created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Invalid post data provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /posts/{postId}:
    get:
      summary: Retrieve a specific post by ID
      operationId: getPostById
      tags:
        - Posts
      parameters:
        - name: postId
          in: path
          description: The ID of the post to retrieve.
          required: true
          schema:
            type: string
            format: uuid
            example: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
      responses:
        '200':
          description: The post object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Post not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update an existing post by ID
      operationId: updatePost
      tags:
        - Posts
      parameters:
        - name: postId
          in: path
          description: The ID of the post to update.
          required: true
          schema:
            type: string
            format: uuid
            example: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
      requestBody:
        description: Updated post object.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePost'
      responses:
        '200':
          description: Post updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Invalid post data provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a post by ID
      operationId: deletePost
      tags:
        - Posts
      parameters:
        - name: postId
          in: path
          description: The ID of the post to delete.
          required: true
          schema:
            type: string
            format: uuid
            example: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
      responses:
        '204':
          description: Post deleted successfully. No content.
        '404':
          description: Post not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Post:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the post.
          example: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
        title:
          type: string
          description: Title of the post.
          example: "My First Blog Post on Dev.to"
        content:
          type: string
          description: The main content of the post, in Markdown format.
          example: "# Hello World\n\nThis is my *amazing* post content."
        authorId:
          type: string
          format: uuid
          description: Unique identifier of the author.
          example: "f1e2d3c4-b5a6-0987-6543-210fedcba987"
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the post was created.
          example: "2023-10-27T08:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the post was last updated.
          example: "2023-10-27T09:45:00Z"
      required:
        - id
        - title
        - content
        - authorId
        - createdAt
        - updatedAt
    NewPost:
      type: object
      properties:
        title:
          type: string
          description: Title of the post.
          example: "My Brand New Blog Post"
        content:
          type: string
          description: The main content of the post, in Markdown format.
          example: "## Getting Started\n\nHere's how to begin your journey."
        authorId:
          type: string
          format: uuid
          description: Unique identifier of the author.
          example: "f1e2d3c4-b5a6-0987-6543-210fedcba987"
      required:
        - title
        - content
        - authorId
    UpdatePost:
      type: object
      properties:
        title:
          type: string
          description: New title for the post.
          example: "My Updated Blog Post Title"
        content:
          type: string
          description: New content for the post, in Markdown format.
          example: "## Revised Content\n\nThis content has been significantly improved."
      minProperties: 1 # At least one field must be provided for update
    Error:
      type: object
      properties:
        code:
          type: string
          description: A unique error code identifier.
          example: "POST_NOT_FOUND"
        message:
          type: string
          description: A human-readable error message.
          example: "The requested post with ID 'a1b2c3d4-e5f6-7890-1234-567890abcdef' was not found."
      required:
        - code
        - message
```