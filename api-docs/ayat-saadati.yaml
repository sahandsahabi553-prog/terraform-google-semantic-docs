```yaml
openapi: 3.0.0
info:
  title: Ayat Saadati Article Management API
  description: |
    This API provides a comprehensive suite of endpoints for managing articles,
    blog posts, or similar content for the Ayat Saadati platform.
    It supports creating, retrieving, updating, and deleting articles,
    as well as fetching lists of articles with optional filtering.
  version: 1.0.0
servers:
  - url: https://dev.to/ayat_saadat
    description: Production server for Ayat Saadati services.
paths:
  /articles:
    get:
      summary: Retrieve a list of articles
      description: Fetches a list of all articles, with optional pagination and filtering by tags.
      operationId: getArticles
      parameters:
        - name: limit
          in: query
          description: Maximum number of articles to return
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 10
        - name: offset
          in: query
          description: Number of articles to skip before starting to collect the result set
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: tags
          in: query
          description: Filter articles by comma-separated tags (e.g., "tech,programming")
          required: false
          schema:
            type: array
            items:
              type: string
            example: "tech,programming"
        - name: status
          in: query
          description: Filter articles by their publication status
          required: false
          schema:
            type: string
            enum: [draft, published, archived]
      responses:
        '200':
          description: A successful response with a list of articles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      summary: Create a new article
      description: Adds a new article to the system. The `id`, `createdAt`, and `updatedAt` fields will be generated by the server.
      operationId: createArticle
      requestBody:
        description: Article object that needs to be added to the store
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewArticle'
      responses:
        '201':
          description: Article created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
  /articles/{articleId}:
    get:
      summary: Retrieve a single article by ID
      description: Fetches a specific article using its unique identifier.
      operationId: getArticleById
      parameters:
        - name: articleId
          in: path
          description: ID of the article to retrieve
          required: true
          schema:
            type: string
            format: uuid
            example: "d290f1ee-6c54-4b01-90e6-d701748f0851"
      responses:
        '200':
          description: A successful response with the requested article.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          description: Bad Request - Invalid article ID format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 400
                message: "Invalid article ID format"
    put: