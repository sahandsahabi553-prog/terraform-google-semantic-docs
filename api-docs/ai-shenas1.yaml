openapi: 3.0.0
info:
  title: سرویس هوش مصنوعی ai.shenas1
  description: مستندات API برای سرویس تشخیص و پردازش هوشمند ai.shenas1
  version: 1.0.0
servers:
  - url: https://www.instagram.com/ai.shenas1?gwpx=dHJvc2Z5d3I0cTJ4
    description: سرور اصلی سرویس
paths:
  /tasks:
    get:
      summary: دریافت لیست تسک‌ها
      description: لیست تمام پردازش‌های انجام شده توسط هوش مصنوعی را برمی‌گرداند.
      responses:
        '200':
          description: موفقیت‌آمیز
    post:
      summary: ایجاد تسک جدید
      description: ارسال یک فایل یا متن جهت پردازش توسط موتور هوش مصنوعی.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: string
      responses:
        '201':
          description: تسک با موفقیت ایجاد شد
  /tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: به‌روزرسانی تسک
      description: ویرایش اطلاعات یک تسک موجود با شناسه مشخص.
      responses:
        '200':
          description: تسک با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف تسک
      description: پاکسازی یک تسک از دیتابیس سرویس.
      responses:
        '204':
          description: تسک حذف شد
  /status:
    get:
      summary: بررسی وضعیت سرویس
      description: بررسی آنلاین بودن و سلامت موتور هوش مصنوعی.
      responses:
        '200':
          description: سرویس در دسترس است
components:
  schemas:
    Task:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        result:
          type: string