openapi: 3.0.0
info:
  title: سرویس API قمر
  description: مستندات رسمی API برای مدیریت سرویس‌های قمر
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی تولید
paths:
  /v1/projects:
    get:
      summary: دریافت لیست پروژه‌ها
      description: بازگرداندن تمامی پروژه‌های موجود در سیستم قمر
      responses:
        '200':
          description: لیست پروژه‌ها با موفقیت دریافت شد
    post:
      summary: ایجاد پروژه جدید
      description: ثبت یک پروژه جدید در دیتابیس قمر
      responses:
        '201':
          description: پروژه با موفقیت ساخته شد
  /v1/projects/{id}:
    get:
      summary: دریافت جزئیات پروژه
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: اطلاعات پروژه با موفقیت ارسال شد
    put:
      summary: به‌روزرسانی پروژه
      description: ویرایش اطلاعات یک پروژه موجود
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: پروژه با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف پروژه
      description: حذف دائمی یک پروژه از سیستم
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: پروژه با موفقیت حذف شد
components:
  schemas:
    Project:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, inactive, archived]