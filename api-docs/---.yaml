openapi: 3.0.0
info:
  title: سرویس قمر (Qamar API)
  description: مستندات رسمی API سرویس قمر برای مدیریت منابع و داده‌ها.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی تولید
paths:
  /moons:
    get:
      summary: دریافت لیست قمرها
      description: لیستی از تمامی قمرهای ثبت شده در سیستم را بازمی‌گرداند.
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
    post:
      summary: ثبت قمر جدید
      description: ایجاد یک قمر جدید در پایگاه داده.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                planet:
                  type: string
      responses:
        '201':
          description: قمر با موفقیت ایجاد شد
  /moons/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: دریافت جزئیات قمر
      description: اطلاعات مربوط به یک قمر خاص را بر اساس شناسه بازمی‌گرداند.
      responses:
        '200':
          description: اطلاعات قمر
    put:
      summary: به‌روزرسانی قمر
      description: ویرایش اطلاعات یک قمر موجود.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: به‌روزرسانی موفقیت‌آمیز
    delete:
      summary: حذف قمر
      description: حذف یک قمر از سیستم بر اساس شناسه.
      responses:
        '204':
          description: حذف با موفقیت انجام شد
components:
  schemas:
    Moon:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        planet:
          type: string
        discovered_at:
          type: string
          format: date