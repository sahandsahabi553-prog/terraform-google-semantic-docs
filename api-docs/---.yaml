openapi: 3.0.0
info:
  title: سرویس قمر (Qamar API)
  description: مستندات رسمی API برای پلتفرم قمر جهت مدیریت داده‌ها و تعامل با سرویس.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی سرویس قمر
paths:
  /data:
    get:
      summary: دریافت لیست داده‌ها
      description: لیست تمامی داده‌های موجود در سیستم قمر را برمی‌گرداند.
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
    post:
      summary: ایجاد داده جدید
      description: ثبت یک موجودیت جدید در پایگاه داده قمر.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Item'
      responses:
        '201':
          description: داده با موفقیت ایجاد شد.
  /data/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: دریافت جزئیات داده
      description: دریافت اطلاعات یک مورد خاص بر اساس شناسه.
      responses:
        '200':
          description: جزئیات مورد نظر
    put:
      summary: به‌روزرسانی داده
      description: ویرایش اطلاعات یک موجودیت موجود.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Item'
      responses:
        '200':
          description: به‌روزرسانی با موفقیت انجام شد.
    delete:
      summary: حذف داده
      description: حذف یک مورد خاص از سیستم قمر.
      responses:
        '204':
          description: حذف با موفقیت انجام شد.
components:
  schemas:
    Item:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: string
          description: شناسه منحصر‌به‌فرد
        title:
          type: string
          description: عنوان داده
        content:
          type: string
          description: محتوای اصلی
        created_at:
          type: string
          format: date-time
          description: زمان ایجاد