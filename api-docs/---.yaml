openapi: 3.0.0
info:
  title: سرویس قمر (Qamar API)
  description: مستندات رسمی سرویس قمر برای مدیریت داده‌های نجومی و کاربران.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی عملیاتی
paths:
  /celestial-objects:
    get:
      summary: دریافت لیست اجرام آسمانی
      tags:
        - اجرام
      responses:
        '200':
          description: لیست با موفقیت دریافت شد
    post:
      summary: ثبت جرم آسمانی جدید
      tags:
        - اجرام
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                type: {type: string}
      responses:
        '201':
          description: جرم با موفقیت ایجاد شد
  /celestial-objects/{id}:
    put:
      summary: به‌روزرسانی اطلاعات جرم
      tags:
        - اجرام
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: اطلاعات با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف یک جرم آسمانی
      tags:
        - اجرام
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '204':
          description: حذف با موفقیت انجام شد
  /users/profile:
    get:
      summary: دریافت پروفایل کاربر
      tags:
        - کاربران
      responses:
        '200':
          description: اطلاعات کاربر دریافت شد
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: {type: string}
                  email: {type: string}