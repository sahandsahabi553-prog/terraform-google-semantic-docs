openapi: 3.0.0
info:
  title: API سرویس قمر
  description: مستندات رسمی رابط برنامه‌نویسی کاربردی سرویس قمر برای مدیریت منابع ماهواره‌ای و داده‌های نجومی.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی تولید
paths:
  /celestial-bodies:
    get:
      summary: دریافت لیست اجرام آسمانی
      description: بازگرداندن لیستی از تمام اجرام ثبت شده در پایگاه داده قمر.
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
    post:
      summary: ثبت جرم آسمانی جدید
      description: افزودن یک جرم آسمانی جدید به سیستم.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                type:
                  type: string
      responses:
        '201':
          description: جرم با موفقیت ایجاد شد
  /celestial-bodies/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: به‌روزرسانی اطلاعات جرم
      description: اصلاح مشخصات یک جرم آسمانی موجود با شناسه مشخص.
      responses:
        '200':
          description: به‌روزرسانی موفقیت‌آمیز
    delete:
      summary: حذف جرم آسمانی
      description: حذف دائمی یک جرم آسمانی از پایگاه داده.
      responses:
        '204':
          description: حذف با موفقیت انجام شد
  /status:
    get:
      summary: بررسی وضعیت سلامت سرویس
      description: بازگرداندن وضعیت آنلاین بودن سرورهای شبکه قمر.
      responses:
        '200':
          description: سرویس در دسترس است
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "operational"