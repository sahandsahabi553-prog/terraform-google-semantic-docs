openapi: 3.0.0
info:
  title: سرویس قمر (Qamar API)
  description: مستندات رسمی API برای پلتفرم قمر جهت مدیریت منابع سیستم.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی تولید
paths:
  /api/v1/items:
    get:
      summary: دریافت لیست آیتم‌ها
      description: بازگرداندن لیستی از تمام آیتم‌های موجود در سیستم.
      responses:
        '200':
          description: عملیات با موفقیت انجام شد.
    post:
      summary: ایجاد آیتم جدید
      description: ثبت یک آیتم جدید در دیتابیس قمر.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201':
          description: آیتم با موفقیت ایجاد شد.
  /api/v1/items/{id}:
    get:
      summary: دریافت جزئیات یک آیتم
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: جزئیات آیتم با موفقیت دریافت شد.
    put:
      summary: به‌روزرسانی آیتم
      description: ویرایش اطلاعات یک آیتم موجود با استفاده از شناسه آن.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: آیتم با موفقیت به‌روزرسانی شد.
    delete:
      summary: حذف آیتم
      description: حذف یک آیتم مشخص از سیستم.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: آیتم با موفقیت حذف شد.