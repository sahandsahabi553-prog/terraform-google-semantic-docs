openapi: 3.0.0
info:
  title: سرویس قمر (Qamar API)
  description: مستندات API برای مدیریت منابع سامانه قمر
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی عملیاتی

paths:
  /api/v1/resources:
    get:
      summary: دریافت لیست منابع
      description: بازگرداندن لیستی از تمام منابع موجود در سامانه
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Resource'
    post:
      summary: ایجاد منبع جدید
      description: ثبت یک منبع جدید در سامانه قمر
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceInput'
      responses:
        '201':
          description: منبع با موفقیت ایجاد شد

  /api/v1/resources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: دریافت جزئیات منبع
      description: مشاهده اطلاعات یک منبع خاص بر اساس شناسه
      responses:
        '200':
          description: جزئیات منبع
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
    put:
      summary: به‌روزرسانی منبع
      description: ویرایش اطلاعات یک منبع موجود
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceInput'
      responses:
        '200':
          description: منبع با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف منبع
      description: حذف دائمی یک منبع از سامانه
      responses:
        '204':
          description: منبع حذف شد

components:
  schemas:
    Resource:
      type: object
      properties:
        id:
          type: string
          description: شناسه منحصر‌به‌فرد
        title:
          type: string
          description: عنوان منبع
        status:
          type: string
          description: وضعیت فعلی
    ResourceInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          description: عنوان منبع
        description:
          type: string
          description: توضیحات تکمیلی