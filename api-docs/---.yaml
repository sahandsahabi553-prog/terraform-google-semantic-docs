openapi: 3.0.0
info:
  title: سرویس قمر (Qamar API)
  description: مستندات رسمی API سرویس قمر برای مدیریت داده‌ها و تعاملات سیستم.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی تولیدی

paths:
  /users:
    get:
      summary: دریافت لیست کاربران
      description: بازگرداندن لیستی از تمام کاربران ثبت شده در سامانه.
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: ثبت کاربر جدید
      description: ایجاد یک حساب کاربری جدید در سیستم قمر.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: کاربر با موفقیت ایجاد شد.

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: به‌روزرسانی اطلاعات کاربر
      description: ویرایش جزئیات یک کاربر خاص با استفاده از شناسه.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: اطلاعات با موفقیت به‌روزرسانی شد.
    delete:
      summary: حذف کاربر
      description: حذف یک کاربر از دیتابیس قمر.
      responses:
        '204':
          description: کاربر با موفقیت حذف شد.

  /status:
    get:
      summary: وضعیت سلامت سرویس
      description: بررسی وضعیت آنلاین بودن و سلامت سرور قمر.
      responses:
        '200':
          description: سرویس در دسترس است.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "operational"

components:
  schemas:
    User:
      type: object
      required:
        - username
        - email
      properties:
        id:
          type: string
          description: شناسه منحصر‌به‌فرد کاربر
        username:
          type: string
          description: نام کاربری
        email:
          type: string
          format: email
          description: پست الکترونیکی کاربر