openapi: 3.0.0
info:
  title: سرویس API قمر
  description: رابط برنامه‌نویسی برای مدیریت منابع در پلتفرم قمر
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی عملیاتی

paths:
  /moons:
    get:
      summary: دریافت لیست قمرها
      responses:
        '200':
          description: لیست قمرها با موفقیت دریافت شد
    post:
      summary: ثبت یک قمر جدید
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: نام قمر
                planet:
                  type: string
                  description: سیاره میزبان
      responses:
        '201':
          description: قمر با موفقیت ایجاد شد

  /moons/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: دریافت جزئیات یک قمر
      responses:
        '200':
          description: جزئیات قمر بازگشت داده شد
    put:
      summary: به‌روزرسانی اطلاعات قمر
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                planet:
                  type: string
      responses:
        '200':
          description: اطلاعات قمر اصلاح شد
    delete:
      summary: حذف یک قمر
      responses:
        '204':
          description: قمر با موفقیت حذف شد

components:
  schemas:
    Moon:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        planet:
          type: string
        discovered_at:
          type: string
          format: date