openapi: 3.0.0
info:
  title: سرویس API قمر
  description: مستندات رسمی رابط برنامه‌نویسی کاربردی (API) پلتفرم قمر
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی عملیاتی
paths:
  /users:
    get:
      summary: دریافت لیست کاربران
      description: بازگرداندن لیستی از تمام کاربران فعال در سامانه
      responses:
        '200':
          description: موفقیت آمیز
    post:
      summary: ثبت نام کاربر جدید
      description: ایجاد یک حساب کاربری جدید در قمر
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
      responses:
        '201':
          description: کاربر با موفقیت ایجاد شد
  /users/{id}:
    put:
      summary: ویرایش اطلاعات کاربر
      description: به‌روزرسانی مشخصات یک کاربر بر اساس شناسه
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: اطلاعات با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف کاربر
      description: حذف دائمی یک کاربر از پایگاه داده قمر
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: کاربر با موفقیت حذف شد
  /status:
    get:
      summary: بررسی وضعیت سلامت سرویس
      description: بررسی آنلاین بودن و پایداری سرورهای قمر
      responses:
        '200':
          description: سرویس در دسترس است
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "online"