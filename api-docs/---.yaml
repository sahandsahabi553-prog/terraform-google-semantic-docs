openapi: 3.0.0
info:
  title: سرویس قمر (Qamar API)
  description: مستندات رسمی سرویس قمر برای مدیریت داده‌های نجومی و محتوای مرتبط.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی سرویس قمر
paths:
  /celestial-bodies:
    get:
      summary: دریافت لیست اجرام آسمانی
      tags:
        - اجرام آسمانی
      responses:
        '200':
          description: لیست اجرام با موفقیت دریافت شد.
    post:
      summary: ثبت یک جرم آسمانی جدید
      tags:
        - اجرام آسمانی
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: نام جرم آسمانی
                type:
                  type: string
                  description: نوع جرم (ستاره، سیاره و غیره)
      responses:
        '201':
          description: جرم با موفقیت ایجاد شد.
  /celestial-bodies/{id}:
    put:
      summary: به‌روزرسانی اطلاعات یک جرم آسمانی
      tags:
        - اجرام آسمانی
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: اطلاعات با موفقیت به‌روزرسانی شد.
    delete:
      summary: حذف یک جرم آسمانی
      tags:
        - اجرام آسمانی
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: جرم با موفقیت حذف شد.
  /observations:
    get:
      summary: مشاهده لیست رصدهای ثبت شده
      tags:
        - رصدها
      responses:
        '200':
          description: لیست رصدها با موفقیت دریافت شد.
components:
  schemas:
    CelestialBody:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        discovered_at:
          type: string
          format: date