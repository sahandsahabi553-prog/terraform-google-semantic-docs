openapi: 3.0.0
info:
  title: سرویس API قمر
  description: مستندات رسمی API برای مدیریت منابع در سامانه قمر
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی عملیاتی

paths:
  /items:
    get:
      summary: دریافت لیست آیتم‌ها
      description: بازگرداندن لیستی از تمام منابع موجود در سیستم قمر
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
    post:
      summary: ایجاد آیتم جدید
      description: ثبت یک منبع جدید در سامانه
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Item'
      responses:
        '201':
          description: آیتم با موفقیت ایجاد شد

  /items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: دریافت جزئیات آیتم
      description: دریافت اطلاعات یک آیتم خاص بر اساس شناسه
      responses:
        '200':
          description: جزئیات آیتم
    put:
      summary: ویرایش آیتم
      description: به‌روزرسانی اطلاعات یک آیتم موجود
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Item'
      responses:
        '200':
          description: آیتم با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف آیتم
      description: حذف یک منبع از سیستم قمر
      responses:
        '204':
          description: آیتم با موفقیت حذف شد

components:
  schemas:
    Item:
      type: object
      required:
        - title
      properties:
        id:
          type: string
          readOnly: true
        title:
          type: string
          description: عنوان آیتم در سامانه قمر
        status:
          type: string
          enum: [active, inactive]
          description: وضعیت فعالیت آیتم