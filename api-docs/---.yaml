openapi: 3.0.0
info:
  title: سرویس قمر (Qamar API)
  description: مستندات رسمی API برای مدیریت و پردازش داده‌ها در سرویس قمر
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی عملیاتی
paths:
  /api/v1/data:
    get:
      summary: دریافت لیست داده‌ها
      description: لیستی از تمام داده‌های موجود در سیستم قمر را بازمی‌گرداند.
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
    post:
      summary: ثبت داده جدید
      description: ایجاد یک موجودیت جدید در پایگاه داده قمر
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: نام آیتم
  /api/v1/data/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: دریافت جزئیات داده
      description: دریافت اطلاعات یک مورد خاص با استفاده از شناسه
      responses:
        '200':
          description: موفق
    put:
      summary: به‌روزرسانی داده
      description: ویرایش اطلاعات یک موجودیت موجود
      responses:
        '200':
          description: به‌روزرسانی با موفقیت انجام شد
    delete:
      summary: حذف داده
      description: حذف یک موجودیت از سیستم قمر
      responses:
        '204':
          description: حذف با موفقیت انجام شد
components:
  schemas:
    Item:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time