openapi: 3.0.0
info:
  title: سرویس API قمر
  description: مستندات رسمی API برای مدیریت منابع در سامانه قمر
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی عملیاتی

paths:
  /items:
    get:
      summary: دریافت لیست آیتم‌ها
      description: بازگرداندن فهرستی از تمامی آیتم‌های موجود در سیستم
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
    post:
      summary: ایجاد آیتم جدید
      description: ثبت یک منبع جدید در سامانه قمر
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201':
          description: آیتم با موفقیت ایجاد شد

  /items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: دریافت جزئیات آیتم
      description: مشاهده اطلاعات یک آیتم خاص بر اساس شناسه
      responses:
        '200':
          description: جزئیات آیتم
    put:
      summary: ویرایش آیتم
      description: بروزرسانی اطلاعات یک آیتم موجود
      responses:
        '200':
          description: بروزرسانی با موفقیت انجام شد
    delete:
      summary: حذف آیتم
      description: حذف دائمی یک آیتم از سامانه
      responses:
        '204':
          description: آیتم با موفقیت حذف شد

components:
  schemas:
    Item:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time