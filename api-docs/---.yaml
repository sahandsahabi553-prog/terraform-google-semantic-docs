openapi: 3.0.0
info:
  title: سرویس API قمر
  description: مستندات رسمی API برای مدیریت منابع در سامانه قمر.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی عملیاتی
paths:
  /items:
    get:
      summary: لیست تمام آیتم‌ها
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
    post:
      summary: ایجاد یک آیتم جدید
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201':
          description: آیتم با موفقیت ایجاد شد
  /items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: دریافت جزئیات یک آیتم خاص
      responses:
        '200':
          description: جزئیات آیتم یافت شد
    put:
      summary: به‌روزرسانی اطلاعات آیتم
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: آیتم با موفقیت ویرایش شد
    delete:
      summary: حذف یک آیتم
      responses:
        '204':
          description: آیتم با موفقیت حذف شد
components:
  schemas:
    Item:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time