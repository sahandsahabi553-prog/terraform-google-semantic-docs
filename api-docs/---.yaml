openapi: 3.0.0
info:
  title: سرویس قمر (Qamar API)
  description: مستندات رسمی API سرویس قمر برای مدیریت داده‌های نجومی و کاربران.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی تولید
paths:
  /celestial-bodies:
    get:
      summary: دریافت لیست اجرام آسمانی
      tags:
        - اجرام آسمانی
      responses:
        '200':
          description: لیست اجرام با موفقیت دریافت شد.
    post:
      summary: ثبت جرم آسمانی جدید
      tags:
        - اجرام آسمانی
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                type:
                  type: string
      responses:
        '201':
          description: جرم جدید با موفقیت ثبت شد.
  /celestial-bodies/{id}:
    put:
      summary: به‌روزرسانی اطلاعات جرم آسمانی
      tags:
        - اجرام آسمانی
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: اطلاعات با موفقیت به‌روزرسانی شد.
    delete:
      summary: حذف یک جرم آسمانی
      tags:
        - اجرام آسمانی
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: جرم با موفقیت حذف شد.
  /auth/profile:
    get:
      summary: دریافت پروفایل کاربری
      tags:
        - احراز هویت
      responses:
        '200':
          description: پروفایل کاربر بازیابی شد.
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    type: string
                  email:
                    type: string