openapi: 3.0.0
info:
  title: سرویس قمر (Qamar API)
  description: مستندات رسمی API برای مدیریت سرویس‌های قمر
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی تولید
paths:
  /celestial-bodies:
    get:
      summary: دریافت لیست اجرام آسمانی
      tags:
        - اجرام
      responses:
        '200':
          description: لیست با موفقیت دریافت شد
    post:
      summary: ثبت جرم آسمانی جدید
      tags:
        - اجرام
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                type:
                  type: string
      responses:
        '201':
          description: جرم با موفقیت ثبت شد
  /celestial-bodies/{id}:
    put:
      summary: به‌روزرسانی اطلاعات جرم
      tags:
        - اجرام
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: به‌روزرسانی انجام شد
    delete:
      summary: حذف یک جرم آسمانی
      tags:
        - اجرام
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: جرم حذف شد
  /status:
    get:
      summary: بررسی وضعیت سلامت سرویس
      tags:
        - سیستم
      responses:
        '200':
          description: سرویس در دسترس است
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "operational"