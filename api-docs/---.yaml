openapi: 3.0.0
info:
  title: سرویس قمر (Qamar API)
  description: مستندات رسمی API برای پلتفرم قمر. این سرویس امکان مدیریت منابع داده‌ای را فراهم می‌کند.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی عملیاتی

paths:
  /items:
    get:
      summary: دریافت لیست آیتم‌ها
      description: بازگرداندن لیستی از تمام آیتم‌های موجود در سیستم.
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
    post:
      summary: ایجاد آیتم جدید
      description: ثبت یک آیتم جدید در دیتابیس قمر.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemInput'
      responses:
        '201':
          description: آیتم با موفقیت ایجاد شد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'

  /items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: دریافت جزئیات آیتم
      description: دریافت اطلاعات یک آیتم خاص با استفاده از شناسه آن.
      responses:
        '200':
          description: اطلاعات یافت شد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
    put:
      summary: ویرایش آیتم
      description: به‌روزرسانی اطلاعات یک آیتم موجود.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemInput'
      responses:
        '200':
          description: آیتم با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف آیتم
      description: حذف یک آیتم از سیستم با استفاده از شناسه.
      responses:
        '204':
          description: آیتم با موفقیت حذف شد

components:
  schemas:
    Item:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
    ItemInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        description:
          type: string