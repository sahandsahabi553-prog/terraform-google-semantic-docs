openapi: 3.0.0
info:
  title: سرویس API قمر
  description: مستندات رسمی API برای مدیریت داده‌های سرویس قمر
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی عملیاتی

paths:
  /celestials:
    get:
      summary: دریافت لیست اجرام
      description: بازگرداندن لیستی از تمام اجرام ثبت شده در سامانه قمر
      responses:
        '200':
          description: عملیات با موفقیت انجام شد
    post:
      summary: ثبت جرم جدید
      description: ایجاد یک موجودیت جدید در پایگاه داده قمر
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                type:
                  type: string
      responses:
        '201':
          description: جرم با موفقیت ایجاد شد

  /celestials/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: دریافت جزئیات جرم
      description: دریافت اطلاعات کامل یک جرم خاص با استفاده از شناسه
      responses:
        '200':
          description: اطلاعات یافت شد
        '404':
          description: جرم مورد نظر پیدا نشد
    put:
      summary: ویرایش جرم
      description: به‌روزرسانی اطلاعات یک جرم موجود
      responses:
        '200':
          description: اطلاعات با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف جرم
      description: حذف یک جرم از لیست اجرام سرویس قمر
      responses:
        '204':
          description: جرم با موفقیت حذف شد

components:
  schemas:
    Celestial:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        created_at:
          type: string
          format: date-time