openapi: 3.0.0
info:
  title: سرویس قمر (Qamar API)
  description: مستندات رسمی API سرویس قمر برای مدیریت منابع و داده‌ها.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی تولید
paths:
  /moons:
    get:
      summary: دریافت لیست قمرها
      description: لیستی از تمامی قمرهای ثبت شده در سیستم را برمی‌گرداند.
      responses:
        '200':
          description: عملیات با موفقیت انجام شد.
    post:
      summary: ثبت قمر جدید
      description: ایجاد یک قمر جدید در سامانه.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: نام قمر
                orbit:
                  type: string
                  description: مدار گردش
      responses:
        '201':
          description: قمر با موفقیت ایجاد شد.
  /moons/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: جزئیات یک قمر
      description: اطلاعات اختصاصی یک قمر را بر اساس شناسه دریافت کنید.
      responses:
        '200':
          description: اطلاعات قمر دریافت شد.
    put:
      summary: ویرایش قمر
      description: به‌روزرسانی اطلاعات یک قمر موجود.
      responses:
        '200':
          description: اطلاعات با موفقیت ویرایش شد.
    delete:
      summary: حذف قمر
      description: حذف یک قمر از دیتابیس بر اساس شناسه.
      responses:
        '204':
          description: قمر با موفقیت حذف شد.
components:
  schemas:
    Moon:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        orbit:
          type: string