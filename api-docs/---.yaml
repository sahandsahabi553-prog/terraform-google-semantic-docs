openapi: 3.0.0
info:
  title: سرویس قمر (Qamar API)
  description: مستندات رسمی API سرویس قمر برای مدیریت داده‌های نجومی و کاربران.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی تولید
paths:
  /observations:
    get:
      summary: دریافت لیست رصدها
      description: بازگرداندن لیستی از رصدهای ثبت شده در سامانه قمر.
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Observation'
    post:
      summary: ثبت رصد جدید
      description: ایجاد یک رکورد جدید برای رصد آسمان.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Observation'
      responses:
        '201':
          description: رصد با موفقیت ثبت شد.
  /observations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: به‌روزرسانی رصد
      description: ویرایش اطلاعات یک رصد موجود با شناسه مشخص.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Observation'
      responses:
        '200':
          description: ویرایش با موفقیت انجام شد.
    delete:
      summary: حذف رصد
      description: حذف یک رکورد رصدی از دیتابیس قمر.
      responses:
        '204':
          description: حذف با موفقیت انجام شد.
  /status:
    get:
      summary: وضعیت سلامت سرویس
      description: بررسی آنلاین بودن و وضعیت پایداری سرور قمر.
      responses:
        '200':
          description: سرویس در دسترس است.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "operational"
components:
  schemas:
    Observation:
      type: object
      required:
        - id
        - objectName
      properties:
        id:
          type: string
          description: شناسه منحصر به فرد رصد
        objectName:
          type: string
          description: نام جرم آسمانی
        magnitude:
          type: number
          description: قدر ظاهری جرم
        timestamp:
          type: string
          format: date-time
          description: زمان دقیق رصد