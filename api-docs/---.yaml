openapi: 3.0.0
info:
  title: سرویس قمر (Qamar API)
  description: مستندات رسمی API سرویس قمر برای مدیریت داده‌های نجومی و سیستم‌های مرتبط.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی سرویس قمر
paths:
  /celestial-bodies:
    get:
      summary: دریافت لیست اجرام آسمانی
      description: بازگرداندن لیستی از تمام اجرام ثبت شده در پایگاه داده قمر.
      responses:
        '200':
          description: عملیات با موفقیت انجام شد.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Body'
    post:
      summary: ثبت جرم آسمانی جدید
      description: افزودن یک جرم آسمانی جدید به سیستم.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body'
      responses:
        '201':
          description: جرم با موفقیت ایجاد شد.
  /celestial-bodies/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: به‌روزرسانی اطلاعات جرم
      description: ویرایش مشخصات یک جرم آسمانی موجود با استفاده از شناسه.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body'
      responses:
        '200':
          description: اطلاعات با موفقیت به‌روزرسانی شد.
    delete:
      summary: حذف جرم آسمانی
      description: حذف یک جرم از پایگاه داده سرویس قمر.
      responses:
        '204':
          description: جرم با موفقیت حذف شد.
  /status:
    get:
      summary: وضعیت سلامت سیستم
      description: بررسی وضعیت آنلاین بودن و سلامت سرویس‌های قمر.
      responses:
        '200':
          description: سیستم در وضعیت پایدار قرار دارد.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "online"
components:
  schemas:
    Body:
      type: object
      required:
        - name
        - type
      properties:
        id:
          type: string
          description: شناسه منحصر به فرد جرم
        name:
          type: string
          description: نام جرم آسمانی
        type:
          type: string
          description: نوع جرم (سیاره، قمر، ستاره و غیره)
        distance:
          type: number
          description: فاصله از مرکز (واحد نجومی)