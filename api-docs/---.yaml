openapi: 3.0.0
info:
  title: سرویس API قمر
  description: مستندات رسمی API پلتفرم قمر برای مدیریت منابع و داده‌ها.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی تولید
paths:
  /items:
    get:
      summary: دریافت لیست آیتم‌ها
      description: بازگرداندن لیستی از تمام آیتم‌های موجود در سیستم.
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
    post:
      summary: ایجاد آیتم جدید
      description: ثبت یک آیتم جدید در دیتابیس.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Item'
      responses:
        '201':
          description: آیتم با موفقیت ایجاد شد
  /items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: دریافت جزئیات آیتم
      description: مشاهده جزئیات یک آیتم خاص بر اساس شناسه.
      responses:
        '200':
          description: جزئیات آیتم دریافت شد
    put:
      summary: به‌روزرسانی آیتم
      description: ویرایش اطلاعات یک آیتم موجود.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Item'
      responses:
        '200':
          description: آیتم با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف آیتم
      description: حذف یک آیتم مشخص از سیستم.
      responses:
        '204':
          description: آیتم با موفقیت حذف شد
components:
  schemas:
    Item:
      type: object
      required:
        - name
      properties:
        id:
          type: string
          description: شناسه منحصر‌به‌فرد آیتم
        name:
          type: string
          description: نام آیتم
        description:
          type: string
          description: توضیحات تکمیلی آیتم