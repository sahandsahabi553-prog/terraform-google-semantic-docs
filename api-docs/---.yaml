openapi: 3.0.0
info:
  title: سرویس قمر (Qamar API)
  description: مستندات رسمی API برای مدیریت سرویس قمر.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی
paths:
  /moons:
    get:
      summary: دریافت لیست قمرها
      description: لیستی از تمام قمرهای ثبت شده در سیستم را بازمی‌گرداند.
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
    post:
      summary: ثبت قمر جدید
      description: ایجاد یک رکورد جدید برای یک قمر در پایگاه داده.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                planet:
                  type: string
      responses:
        '201':
          description: قمر با موفقیت ایجاد شد
  /moons/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: جزئیات قمر
      description: دریافت اطلاعات یک قمر خاص با استفاده از شناسه آن.
      responses:
        '200':
          description: جزئیات قمر
    put:
      summary: به‌روزرسانی قمر
      description: تغییر مشخصات یک قمر موجود.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف قمر
      description: پاک کردن یک قمر از سیستم.
      responses:
        '204':
          description: با موفقیت حذف شد