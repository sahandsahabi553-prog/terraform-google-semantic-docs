openapi: 3.0.0
info:
  title: سرویس API قمر
  description: مستندات رسمی رابط برنامه‌نویسی کاربردی سامانه قمر
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی عملیاتی

paths:
  /moons:
    get:
      summary: لیست تمامی قمرها
      description: دریافت فهرستی از تمامی اقمار ثبت شده در سامانه
      responses:
        '200':
          description: عملیات با موفقیت انجام شد
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Moon'
    post:
      summary: ثبت قمر جدید
      description: ایجاد یک رکورد جدید برای قمر در پایگاه داده
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Moon'
      responses:
        '201':
          description: قمر با موفقیت ایجاد شد

  /moons/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: جزئیات یک قمر
      description: دریافت اطلاعات دقیق یک قمر بر اساس شناسه اختصاصی
      responses:
        '200':
          description: اطلاعات قمر یافت شد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Moon'
    put:
      summary: بروزرسانی قمر
      description: ویرایش اطلاعات یک قمر موجود
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Moon'
      responses:
        '200':
          description: بروزرسانی با موفقیت انجام شد
    delete:
      summary: حذف قمر
      description: پاک کردن یک قمر از سامانه
      responses:
        '204':
          description: قمر با موفقیت حذف شد

components:
  schemas:
    Moon:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: شناسه یکتای قمر
        name:
          type: string
          description: نام فارسی قمر
        diameter:
          type: number
          description: قطر قمر به کیلومتر
        is_visible:
          type: boolean
          description: وضعیت رویت‌پذیری قمر