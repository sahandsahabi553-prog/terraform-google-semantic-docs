openapi: 3.0.0
info:
  title: سرویس قمر (Qamar API)
  description: مستندات رسمی API برای پلتفرم قمر جهت مدیریت منابع سیستم.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی تولید
paths:
  /v1/resources:
    get:
      summary: لیست منابع
      description: دریافت لیست تمام منابع موجود در سیستم قمر.
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
    post:
      summary: ایجاد منبع جدید
      description: ثبت یک منبع جدید در دیتابیس قمر.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
  /v1/resources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: دریافت جزئیات منبع
      description: بازگرداندن اطلاعات دقیق یک منبع خاص با استفاده از شناسه.
      responses:
        '200':
          description: جزئیات منبع
    put:
      summary: به‌روزرسانی منبع
      description: ویرایش اطلاعات یک منبع موجود.
      responses:
        '200':
          description: منبع با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف منبع
      description: پاک کردن یک منبع از سیستم قمر.
      responses:
        '204':
          description: منبع حذف شد