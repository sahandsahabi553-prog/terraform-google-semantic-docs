openapi: 3.0.0
info:
  title: سرویس API قمر
  description: مستندات رسمی برای تعامل با سرویس قمر
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی تولید
paths:
  /moons:
    get:
      summary: دریافت لیست قمرها
      responses:
        '200':
          description: لیست قمرها با موفقیت دریافت شد
    post:
      summary: ثبت یک قمر جدید
      responses:
        '201':
          description: قمر با موفقیت ایجاد شد
  /moons/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: دریافت جزئیات یک قمر خاص
      responses:
        '200':
          description: جزئیات قمر
    put:
      summary: به‌روزرسانی اطلاعات قمر
      responses:
        '200':
          description: اطلاعات با موفقیت ویرایش شد
    delete:
      summary: حذف یک قمر از سامانه
      responses:
        '204':
          description: قمر با موفقیت حذف شد
components:
  schemas:
    Moon:
      type: object
      properties:
        id:
          type: string
          description: شناسه منحصر‌به‌فرد قمر
        name:
          type: string
          description: نام قمر
        radius:
          type: number
          description: شعاع قمر به کیلومتر