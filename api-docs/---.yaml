openapi: 3.0.0
info:
  title: سرویس API قمر
  description: مستندات رسمی API برای مدیریت منابع در سامانه قمر
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی عملیاتی

paths:
  /moons:
    get:
      summary: دریافت لیست اقمار
      description: بازگرداندن لیستی از تمام اقمار ثبت شده در سیستم
      responses:
        '200':
          description: لیست اقمار با موفقیت دریافت شد
    post:
      summary: ثبت قمر جدید
      description: ایجاد یک موجودیت جدید در پایگاه داده قمر
      responses:
        '201':
          description: قمر با موفقیت ایجاد شد

  /moons/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: دریافت جزئیات قمر
      description: مشاهده اطلاعات دقیق یک قمر خاص بر اساس شناسه
      responses:
        '200':
          description: اطلاعات قمر دریافت شد
    put:
      summary: به‌روزرسانی اطلاعات قمر
      description: ویرایش ویژگی‌های یک قمر موجود
      responses:
        '200':
          description: اطلاعات با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف قمر
      description: حذف یک قمر از سیستم بر اساس شناسه مربوطه
      responses:
        '204':
          description: قمر با موفقیت حذف شد

components:
  schemas:
    Moon:
      type: object
      properties:
        id:
          type: string
          description: شناسه منحصر‌به‌فرد قمر
        name:
          type: string
          description: نام قمر
        orbit_period:
          type: number
          description: دوره تناوب مداری به روز