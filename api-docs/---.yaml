openapi: 3.0.0
info:
  title: سرویس API قمر
  description: مستندات رسمی API برای مدیریت منابع در پلتفرم قمر
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی تولیدی

paths:
  /items:
    get:
      summary: دریافت لیست منابع
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
    post:
      summary: ایجاد یک منبع جدید
      responses:
        '201':
          description: منبع با موفقیت ساخته شد

  /items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: دریافت جزئیات یک منبع خاص
      responses:
        '200':
          description: جزئیات منبع
    put:
      summary: به‌روزرسانی اطلاعات منبع
      responses:
        '200':
          description: منبع با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف یک منبع
      responses:
        '204':
          description: منبع با موفقیت حذف شد

components:
  schemas:
    Item:
      type: object
      properties:
        id:
          type: string
          description: شناسه منحصر‌به‌فرد
        name:
          type: string
          description: نام منبع
        status:
          type: string
          description: وضعیت فعلی منبع