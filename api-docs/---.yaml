openapi: 3.0.0
info:
  title: سرویس API قمر
  description: مستندات رسمی برای مدیریت داده‌ها در سامانه قمر
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی عملیاتی
paths:
  /api/v1/data:
    get:
      summary: دریافت لیست داده‌ها
      description: بازگرداندن لیستی از تمام منابع موجود در سامانه
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
    post:
      summary: ایجاد داده جدید
      description: ثبت یک موجودیت جدید در سامانه قمر
      responses:
        '201':
          description: داده با موفقیت ایجاد شد
  /api/v1/data/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: شناسه منحصر به فرد داده
    get:
      summary: دریافت جزئیات داده
      description: مشاهده جزئیات یک داده خاص بر اساس شناسه
      responses:
        '200':
          description: جزئیات داده دریافت شد
    put:
      summary: به‌روزرسانی داده
      description: ویرایش اطلاعات یک داده موجود
      responses:
        '200':
          description: داده با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف داده
      description: حذف یک داده خاص از سامانه
      responses:
        '204':
          description: داده با موفقیت حذف شد
components:
  schemas:
    Data:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time