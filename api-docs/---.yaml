openapi: 3.0.0
info:
  title: سرویس قمر (Qamar API)
  description: مستندات رسمی API سرویس قمر برای مدیریت داده‌ها و منابع سیستم.
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی عملیاتی
paths:
  /satellites:
    get:
      summary: دریافت لیست تمام قمرها
      responses:
        '200':
          description: لیست قمرها با موفقیت دریافت شد
    post:
      summary: ثبت یک قمر جدید
      responses:
        '201':
          description: قمر با موفقیت ایجاد شد
  /satellites/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: دریافت جزئیات یک قمر خاص
      responses:
        '200':
          description: جزئیات قمر دریافت شد
    put:
      summary: به‌روزرسانی اطلاعات یک قمر
      responses:
        '200':
          description: اطلاعات قمر با موفقیت ویرایش شد
    delete:
      summary: حذف یک قمر از سیستم
      responses:
        '204':
          description: قمر با موفقیت حذف شد
components:
  schemas:
    Satellite:
      type: object
      properties:
        id:
          type: string
          description: شناسه منحصر به فرد قمر
        name:
          type: string
          description: نام قمر
        orbit_period:
          type: number
          description: دوره تناوب مداری به روز
        status:
          type: string
          enum: [active, inactive, maintenance]
          description: وضعیت فعلی قمر