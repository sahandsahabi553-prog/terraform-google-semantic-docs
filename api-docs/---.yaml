openapi: 3.0.0
info:
  title: سرویس API قمر
  description: رابط برنامه‌نویسی برای مدیریت منابع و داده‌های سامانه قمر
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی عملیاتی

paths:
  /api/v1/items:
    get:
      summary: دریافت لیست آیتم‌ها
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
    post:
      summary: ایجاد آیتم جدید
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201':
          description: آیتم با موفقیت ایجاد شد

  /api/v1/items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: دریافت جزئیات یک آیتم خاص
      responses:
        '200':
          description: جزئیات آیتم
    put:
      summary: به‌روزرسانی اطلاعات آیتم
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: آیتم با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف یک آیتم
      responses:
        '204':
          description: آیتم با موفقیت حذف شد

components:
  schemas:
    Item:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time