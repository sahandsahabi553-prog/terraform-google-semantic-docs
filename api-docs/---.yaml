openapi: 3.0.0
info:
  title: سرویس قمر (Qamar API)
  description: مستندات رسمی API برای مدیریت سرویس قمر
  version: 1.0.0
servers:
  - url: https://qamar.website
    description: سرور اصلی عملیاتی

paths:
  /celestial-bodies:
    get:
      summary: دریافت لیست اجرام آسمانی
      responses:
        '200':
          description: لیست با موفقیت دریافت شد
    post:
      summary: ثبت جرم آسمانی جدید
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body'
      responses:
        '201':
          description: جرم آسمانی با موفقیت ایجاد شد

  /celestial-bodies/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: به‌روزرسانی اطلاعات جرم آسمانی
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body'
      responses:
        '200':
          description: اطلاعات با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف جرم آسمانی
      responses:
        '204':
          description: جرم آسمانی حذف شد

  /search:
    get:
      summary: جستجو در پایگاه داده قمر
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: نتایج جستجو یافت شد

components:
  schemas:
    Body:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          description: نام جرم آسمانی
        type:
          type: string
          description: نوع جرم (قمر، سیاره، ستاره)
        distance:
          type: integer
          description: فاصله از مرکز (به کیلومتر)