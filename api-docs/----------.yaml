openapi: 3.0.0
info:
  title: API خانه باتری
  description: مستندات سرویس مدیریت محصولات و سفارشات فروشگاه خانه باتری
  version: 1.0.0
servers:
  - url: https://www.batteries.ir/api/v1
    description: سرور اصلی تولید
paths:
  /products:
    get:
      summary: دریافت لیست محصولات
      tags:
        - محصولات
      responses:
        '200':
          description: لیست محصولات با موفقیت دریافت شد
    post:
      summary: افزودن محصول جدید
      tags:
        - محصولات
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد
  /products/{id}:
    put:
      summary: به‌روزرسانی اطلاعات محصول
      tags:
        - محصولات
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: محصول با موفقیت ویرایش شد
    delete:
      summary: حذف محصول از فروشگاه
      tags:
        - محصولات
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: محصول حذف شد
  /orders:
    get:
      summary: دریافت لیست سفارشات مشتری
      tags:
        - سفارشات
      responses:
        '200':
          description: لیست سفارشات دریافت شد
components:
  schemas:
    Product:
      type: object
      required:
        - name
        - price
        - capacity
      properties:
        name:
          type: string
          description: نام باتری
        price:
          type: number
          description: قیمت به تومان
        capacity:
          type: string
          description: ظرفیت باتری (مثلاً 60 آمپر)
        brand:
          type: string
          description: برند تولیدکننده