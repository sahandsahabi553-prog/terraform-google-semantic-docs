openapi: 3.0.0
info:
  title: API خانه باتری
  description: سرویس مدیریت موجودی و سفارشات فروشگاه آنلاین خانه باتری
  version: 1.0.0
servers:
  - url: https://www.batteries.ir/
    description: سرور اصلی
paths:
  /products:
    get:
      summary: دریافت لیست باتری‌ها
      responses:
        '200':
          description: لیست باتری‌های موجود
    post:
      summary: افزودن باتری جدید
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Battery'
      responses:
        '201':
          description: باتری با موفقیت ایجاد شد
  /products/{id}:
    put:
      summary: به‌روزرسانی اطلاعات باتری
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Battery'
      responses:
        '200':
          description: اطلاعات با موفقیت ویرایش شد
    delete:
      summary: حذف باتری از لیست
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: باتری با موفقیت حذف شد
  /orders:
    post:
      summary: ثبت سفارش جدید
      responses:
        '201':
          description: سفارش ثبت شد

components:
  schemas:
    Battery:
      type: object
      required:
        - name
        - capacity
        - price
      properties:
        name:
          type: string
          description: نام مدل باتری
        capacity:
          type: string
          description: ظرفیت باتری (مانند 60 آمپر)
        price:
          type: number
          description: قیمت به تومان
        brand:
          type: string
          description: برند تولیدکننده