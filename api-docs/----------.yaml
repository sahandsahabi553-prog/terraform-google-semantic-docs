openapi: 3.0.0
info:
  title: API سرویس خانه باتری
  description: مستندات رسمی API برای مدیریت موجودی و سفارشات فروشگاه خانه باتری
  version: 1.0.0
servers:
  - url: https://www.batteries.ir/api/v1
    description: سرور اصلی تولید
paths:
  /products:
    get:
      summary: لیست تمام باتری‌ها
      tags: [محصولات]
      responses:
        '200':
          description: لیست باتری‌ها با موفقیت دریافت شد
    post:
      summary: افزودن باتری جدید
      tags: [محصولات]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Battery'
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: به‌روزرسانی اطلاعات باتری
      tags: [محصولات]
      responses:
        '200':
          description: اطلاعات با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف یک باتری از لیست
      tags: [محصولات]
      responses:
        '204':
          description: محصول با موفقیت حذف شد
  /orders:
    post:
      summary: ثبت سفارش جدید
      tags: [سفارشات]
      responses:
        '201':
          description: سفارش شما ثبت شد و در انتظار پرداخت است
components:
  schemas:
    Battery:
      type: object
      required:
        - name
        - capacity
        - price
      properties:
        name:
          type: string
          description: نام مدل باتری
        capacity:
          type: string
          description: ظرفیت باتری (مثلاً ۶۰ آمپر)
        price:
          type: number
          description: قیمت به تومان
        brand:
          type: string
          description: برند تولید کننده