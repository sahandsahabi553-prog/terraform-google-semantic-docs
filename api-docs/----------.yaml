openapi: 3.0.0
info:
  title: API سرویس خانه باتری
  description: مستندات رسمی مدیریت موجودی و سفارشات فروشگاه خانه باتری
  version: 1.0.0
servers:
  - url: https://www.batteries.ir/
    description: سرور اصلی
paths:
  /products:
    get:
      summary: دریافت لیست تمام باتری‌ها
      tags:
        - محصولات
      responses:
        '200':
          description: لیست محصولات با موفقیت دریافت شد
    post:
      summary: افزودن باتری جدید به انبار
      tags:
        - محصولات
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد
  /products/{id}:
    put:
      summary: به‌روزرسانی اطلاعات باتری
      tags:
        - محصولات
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: اطلاعات محصول به‌روزرسانی شد
    delete:
      summary: حذف باتری از سیستم
      tags:
        - محصولات
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: محصول حذف شد
  /orders:
    post:
      summary: ثبت سفارش خرید جدید
      tags:
        - سفارشات
      responses:
        '201':
          description: سفارش با موفقیت ثبت شد
components:
  schemas:
    Product:
      type: object
      required:
        - name
        - capacity
        - price
      properties:
        name:
          type: string
          description: نام تجاری باتری
        capacity:
          type: integer
          description: ظرفیت باتری به آمپر ساعت
        price:
          type: number
          description: قیمت به ریال
        brand:
          type: string
          description: برند تولیدکننده