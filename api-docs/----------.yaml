openapi: 3.0.0
info:
  title: API خانه باتری
  description: سرویس مدیریت موجودی و سفارشات فروشگاه آنلاین خانه باتری
  version: 1.0.0
servers:
  - url: https://www.batteries.ir/api/v1
    description: سرور اصلی تولید
paths:
  /products:
    get:
      summary: دریافت لیست باتری‌ها
      tags:
        - محصولات
      responses:
        '200':
          description: لیست باتری‌ها با موفقیت دریافت شد
    post:
      summary: افزودن باتری جدید
      tags:
        - محصولات
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Battery'
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد
  /products/{id}:
    put:
      summary: به‌روزرسانی اطلاعات باتری
      tags:
        - محصولات
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Battery'
      responses:
        '200':
          description: اطلاعات با موفقیت ویرایش شد
    delete:
      summary: حذف باتری از سیستم
      tags:
        - محصولات
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: محصول با موفقیت حذف شد
  /orders:
    get:
      summary: دریافت لیست سفارشات
      tags:
        - سفارشات
      responses:
        '200':
          description: لیست سفارشات دریافتی
components:
  schemas:
    Battery:
      type: object
      required:
        - name
        - capacity
        - price
      properties:
        name:
          type: string
          description: نام تجاری باتری
        capacity:
          type: string
          description: ظرفیت باتری (مثلاً 60Ah)
        price:
          type: number
          description: قیمت به تومان
        stock:
          type: integer
          description: تعداد موجودی در انبار