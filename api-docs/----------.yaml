openapi: 3.0.0
info:
  title: API خانه باتری
  description: مستندات رسمی سرویس مدیریت موجودی و فروشگاه خانه باتری
  version: 1.0.0
servers:
  - url: https://www.batteries.ir/
    description: سرور اصلی تولید
paths:
  /products:
    get:
      summary: دریافت لیست تمام باتری‌ها
      tags:
        - محصولات
      responses:
        '200':
          description: لیست محصولات با موفقیت دریافت شد
    post:
      summary: افزودن باتری جدید به انبار
      tags:
        - محصولات
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: محصول با موفقیت ایجاد شد
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: دریافت جزئیات یک باتری خاص
      tags:
        - محصولات
      responses:
        '200':
          description: جزئیات محصول
    put:
      summary: به‌روزرسانی اطلاعات باتری
      tags:
        - محصولات
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: اطلاعات با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف باتری از سیستم
      tags:
        - محصولات
      responses:
        '204':
          description: محصول با موفقیت حذف شد
components:
  schemas:
    Product:
      type: object
      required:
        - name
        - capacity
        - price
      properties:
        name:
          type: string
          description: نام مدل باتری
        capacity:
          type: string
          description: ظرفیت باتری (مثلاً 60Ah)
        price:
          type: number
          description: قیمت به تومان
        stock:
          type: integer
          description: موجودی در انبار