openapi: 3.0.0
info:
  title: API سرویس خانه باتری
  description: مستندات رسمی API برای مدیریت موجودی و سفارشات فروشگاه خانه باتری.
  version: 1.0.0
servers:
  - url: https://www.batteries.ir/api/v1
    description: سرور اصلی تولید
paths:
  /batteries:
    get:
      summary: دریافت لیست باتری‌ها
      description: بازگرداندن لیستی از تمام باتری‌های موجود در انبار.
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
    post:
      summary: افزودن باتری جدید
      description: ثبت یک مدل باتری جدید در سیستم.
      responses:
        '201':
          description: باتری با موفقیت ایجاد شد
  /batteries/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: دریافت جزئیات باتری
      description: مشاهده مشخصات فنی و قیمت یک باتری خاص بر اساس شناسه.
      responses:
        '200':
          description: جزئیات یافت شد
    put:
      summary: به‌روزرسانی اطلاعات باتری
      description: ویرایش قیمت یا وضعیت موجودی یک باتری موجود.
      responses:
        '200':
          description: اطلاعات با موفقیت به‌روزرسانی شد
    delete:
      summary: حذف باتری
      description: حذف یک باتری از لیست محصولات فروشگاه.
      responses:
        '204':
          description: باتری با موفقیت حذف شد
components:
  schemas:
    Battery:
      type: object
      properties:
        id:
          type: string
        model:
          type: string
        capacity:
          type: string
        price:
          type: number
        stock:
          type: integer