openapi: 3.0.0
info:
  title: API سرویس خانه باتری
  description: مستندات رسمی API برای مدیریت موجودی و سفارشات فروشگاه خانه باتری
  version: 1.0.0
servers:
  - url: https://www.batteries.ir/api/v1
    description: سرور اصلی تولید
paths:
  /batteries:
    get:
      summary: دریافت لیست باتری‌ها
      description: لیستی از تمام باتری‌های موجود در انبار را بازمی‌گرداند
      responses:
        '200':
          description: عملیات موفقیت‌آمیز
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Battery'
    post:
      summary: افزودن باتری جدید
      description: ثبت یک مدل باتری جدید در سیستم
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Battery'
      responses:
        '201':
          description: باتری با موفقیت ثبت شد
  /batteries/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: به‌روزرسانی اطلاعات باتری
      description: ویرایش مشخصات یا موجودی یک باتری خاص
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Battery'
      responses:
        '200':
          description: به‌روزرسانی با موفقیت انجام شد
    delete:
      summary: حذف باتری
      description: حذف یک محصول از لیست موجودی
      responses:
        '204':
          description: باتری حذف شد
  /orders:
    post:
      summary: ثبت سفارش جدید
      description: ایجاد یک سفارش خرید برای مشتری
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                batteryId:
                  type: string
                quantity:
                  type: integer
      responses:
        '201':
          description: سفارش با موفقیت ثبت شد

components:
  schemas:
    Battery:
      type: object
      required:
        - id
        - name
        - capacity
      properties:
        id:
          type: string
          description: شناسه منحصر‌به‌فرد باتری
        name:
          type: string
          description: نام برند و مدل باتری
        capacity:
          type: string
          description: ظرفیت باتری (مثلاً 60 آمپر)
        price:
          type: number
          description: قیمت به تومان
        stock:
          type: integer
          description: تعداد موجود در انبار